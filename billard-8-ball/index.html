<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="3D-Pool-Billard (8-Ball) im Browser – gegen die CPU, zu zweit an einem Gerät oder im Übungsmodus.">
<title>Billard 8-Ball</title>
<link rel="stylesheet" href="src/ui/styles.css?v=1.0.2">
<link rel="modulepreload" href="vendor/three.module.js?v=1.0.2">
<script>
// Startwächter (klassisches Skript, läuft auch dort, wo ES-Module scheitern):
// zeigt eine Fehlermeldung statt endlos „Lade Billard…“.
(function () {
  var VERSION = '1.0.2';
  var MODULES = 27; // JavaScript-Dateien in src/ und vendor/
  var errors = [];
  var failed = false;
  function loadedModules() {
    if (!window.performance || !performance.getEntriesByType) return '?';
    return performance.getEntriesByType('resource').filter(function (r) { return /\.js(\?|$)/.test(r.name); }).length;
  }
  // Fortschritt: vor dem Modulstart zählen wir geladene Dateien, danach meldet main.js die Phase
  function stage() {
    return window.__bootStage || ('Dateien ' + loadedModules() + '/' + MODULES + ' geladen');
  }
  var poll = setInterval(function () {
    var s = document.getElementById('boot-status');
    if (window.__billardReady || failed || !s) { if (window.__billardReady || failed) clearInterval(poll); return; }
    s.textContent = 'v' + VERSION + ' · ' + stage();
  }, 300);
  function show(title, text) {
    if (window.__billardReady || failed) return;
    failed = true;
    var boot = document.getElementById('boot');
    if (!boot) return;
    var where = stage();
    boot.innerHTML = '';
    var h = document.createElement('h1'); h.textContent = title;
    var p = document.createElement('p'); p.textContent = text;
    var b = document.createElement('button'); b.className = 'btn primary'; b.textContent = 'Neu laden';
    b.onclick = function () { location.reload(); };
    var d = document.createElement('p'); d.className = 'boot-detail';
    d.textContent = 'v' + VERSION + ' · hängt bei: ' + where + ' · Fehler: ' + (errors.length ? errors.join(' | ') : 'keine') + ' · ' + navigator.userAgent;
    boot.appendChild(h); boot.appendChild(p); boot.appendChild(b); boot.appendChild(d);
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    errors.push(e.message || (t && (t.src || t.href) ? 'Datei nicht geladen: ' + (t.src || t.href) : 'Ladefehler'));
    setTimeout(function () { show('Das Spiel konnte nicht starten', 'Beim Laden ist ein Fehler aufgetreten. Bitte neu laden; hilft das nicht, Browser aktualisieren.'); }, 300);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  document.addEventListener('DOMContentLoaded', function () {
    if (!('noModule' in HTMLScriptElement.prototype)) {
      show('Browser zu alt', 'Dieser Browser unterstützt keine JavaScript-Module. Bitte Chrome, Firefox, Samsung Internet oder Safari aktualisieren.');
    }
  });
  setTimeout(function () {
    show('Das Spiel startet nicht', errors.length ? 'Beim Laden ist ein Fehler aufgetreten.' : 'Das Laden dauert ungewöhnlich lange. Bitte Internetverbindung prüfen und neu laden.');
  }, 12000);
})();
</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="players">
      <section class="player" id="p0" aria-live="polite">
        <div class="pname"></div>
        <div class="pmeta"><span class="pgroup"></span><span class="pleft"></span><span class="pfouls"></span></div>
        <span class="turn-badge">▶ am Zug</span>
      </section>
      <section class="player" id="p1" aria-live="polite">
        <div class="pname"></div>
        <div class="pmeta"><span class="pgroup"></span><span class="pleft"></span><span class="pfouls"></span></div>
        <span class="turn-badge">▶ am Zug</span>
      </section>
    </div>
    <div id="chips" aria-label="Kugeln auf dem Tisch"></div>
  </header>

  <main id="stage">
    <canvas id="gl" aria-label="Billardtisch"></canvas>
    <div class="stage-left">
      <button class="icon-btn" id="btn-pause" aria-label="Pause / Menü">❚❚</button>
      <button class="icon-btn" id="btn-help" aria-label="Regeln und Hilfe">?</button>
    </div>
    <div class="stage-right">
      <button class="icon-btn" id="btn-top" aria-label="Vogelperspektive">Top</button>
      <button class="icon-btn" id="btn-cam" aria-label="Kamera zurücksetzen">⟲</button>
      <button class="icon-btn" id="btn-replay" aria-label="Letzten Stoß wiederholen">↺▶</button>
    </div>
    <div id="toasts" aria-live="assertive"></div>
    <div id="status-pill" hidden></div>
    <button id="btn-skip" class="pill-btn" hidden>⏩ Überspringen</button>
  </main>

  <footer id="controls">
    <div class="ctrl-row">
      <button class="ctl-btn" id="btn-fine" aria-pressed="false">Feinziel</button>
      <button class="ctl-btn" id="btn-mode">↕ Kraft</button>
      <button class="ctl-btn" id="btn-undo">Undo</button>
      <button class="ctl-btn" id="btn-rerack" hidden aria-label="Kugeln neu aufbauen">↻ Rack</button>
      <button class="ctl-btn" id="btn-sound" aria-label="Sound an/aus" title="Sound an/aus">🔊</button>
    </div>
    <div class="ctrl-main">
      <div id="aim-pad" role="slider" aria-label="Zielen und Kraft" tabindex="0">
        <div class="pad-hint"><span>◀ wischen = zielen ▶</span><span id="pad-vhint">▼ ziehen = Kraft · loslassen = Stoß</span></div>
        <div class="power-wrap">
          <div class="power-bar"><div class="power-fill" id="power-fill"></div></div>
          <div class="power-val" id="power-val">0 %</div>
        </div>
      </div>
      <div id="spin">
        <div class="spin-ball" id="spin-ball" tabindex="0" role="slider" aria-label="Trefferpunkt auf der Spielkugel">
          <div class="spin-safe"></div>
          <div class="spin-cross"></div>
          <div class="spin-dot" id="spin-dot"></div>
        </div>
        <div class="spin-label" id="spin-label">Mitte</div>
        <div class="spin-label dim" id="elev-label">Queue 0°</div>
      </div>
    </div>
  </footer>
</div>
<div id="modal-root"></div>
<div id="boot" class="boot"><div class="boot-ball"></div><p>Lade Billard…</p><p class="boot-detail" id="boot-status">v1.0.2</p></div>
<noscript><p class="fatal">Dieses Spiel benötigt JavaScript.</p></noscript>
<script type="module" src="src/main.js?v=1.0.2"></script>
</body>
</html>
