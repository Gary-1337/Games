/* Weltcup: Saison über mehrere Schanzen, Punkte nach FIS-Tabelle       */
/* ------------------------------------------------------------------ */
const Cup = {
  TOUR: ['F03', 'F06', 'F08', 'F10', 'F12'],
  key(mp) { return mp ? 'asjd_cup_mp' : 'asjd_cup'; },
  load(mp) {
    const d = Store.load(this.key(mp), null);
    return d && d.hills ? this.wrap(d) : null;
  },
  start(random, mp) {
    let hills = this.TOUR.slice();
    if (random) {
      const r = U.rng((Math.random() * 1e9) >>> 0);
      const pool = Hills.FIXED.map(d => d.id).sort(() => r() - 0.5).slice(0, 5);
      hills = pool.sort((a, b) => Hills.FIXED.find(d => d.id === a).K - Hills.FIXED.find(d => d.id === b).K);
    }
    const size = U.clamp(Settings.data.field || 9, 9, AI_JUMPERS.length);
    const d = { hills, station: 0, field: mp ? [] : AI_JUMPERS.slice(0, size).map(a => a.name), pts: {}, wins: {}, results: [], name: Settings.data.name };
    if (mp) d.mp = mp;
    Store.save(this.key(mp), d);
    return this.wrap(d);
  },
  wrap(d) {
    const me = () => Settings.data.name || 'SPIELER';
    return Object.assign(d, {
      done() { return this.station >= this.hills.length; },
      hill() { return Hills.get(this.hills[this.station]); },
      stationLabel() { return 'WELTCUP ' + Math.min(this.station + 1, this.hills.length) + '/' + this.hills.length + (this.station === this.hills.length - 1 ? ' FINALE' : ''); },
      names() { return this.mp ? this.mp.map(p => p.name) : [me()].concat(this.field); },
      standings() { return this.names().map(n => ({ name: n, pts: this.pts[n] || 0, wins: this.wins[n] || 0 })).sort((a, b) => b.pts - a.pts || b.wins - a.wins); },
      leader() { const s = this.standings(); return s[0].pts > 0 ? s[0].name : null; },
      info(n) { const s = this.standings(); const i = s.findIndex(x => x.name === n); return { rank: i + 1, pts: s[i] ? s[i].pts : 0, leader: i === 0 && s[0].pts > 0 }; },
      /** Weltcup-Punkte nach dem Endstand eines Springens vergeben. */
      finishStation(comp) {
        const st = comp.standings();
        st.forEach((c, i) => {
          const n = c.player && !this.mp ? me() : c.name;
          this.pts[n] = (this.pts[n] || 0) + (CUP_POINTS[i] || 0);
          if (i === 0) this.wins[n] = (this.wins[n] || 0) + 1;
        });
        const myPlace = st.findIndex(c => c.player) + 1;
        this.results.push({ hill: comp.h.title, winner: st[0].player && !this.mp ? me() : st[0].name, myPlace });
        this.station++;
        this.save();
        return this;
      },
      save() {
        const plain = {}; ['hills', 'station', 'field', 'pts', 'wins', 'results', 'name', 'skipAI', 'mp'].forEach(k => { plain[k] = this[k]; });
        Store.save(Cup.key(this.mp), plain);
      }
    });
  },
  clear() { Store.save('asjd_cup', null); }
};

class CupScene {
  get centered() { return true; }
  constructor(cup) {
    this.cup = cup || Cup.load();
    this.mx = 0; this.my = 0; this.confirmNew = false;
    this.btns = [];
  }
  enter() { Sound.playSong(this.cup && this.cup.done() ? 'menu' : 'comp'); Sound.duck(1); }
  update(dt) { MenuBG.update(dt); }
  go(id) {
    if ((id === 'new' || id === 'random') && this.cup && this.cup.mp) { Sound.sfx('select'); Game.setScene(new MultiScene()); return; }
    if (id === 'new' || id === 'random') {
      if (this.cup && !this.cup.done() && !this.confirmNew) { this.confirmNew = id; Sound.sfx('blip'); return; }
      this.cup = Cup.start(id === 'random'); this.confirmNew = false; Sound.sfx('select');
    } else if (id === 'next' && this.cup && !this.cup.done()) {
      Sound.sfx('select');
      const h = this.cup.hill();
      Game.setHill(h.id);
      Game.setScene(new CompetitionScene(h, { cup: this.cup }));
    } else if (id === 'podium' && this.cup && this.cup.done()) {
      Game.setScene(new PodiumScene(null, { cup: this.cup }));
    } else if (id === 'menu') { Sound.sfx('back'); Game.setScene(this.cup && this.cup.mp ? new MultiScene() : new MenuScene()); }
  }
  onKey(code, key, repeat) {
    if (repeat) return;
    if (code === 'Enter' || code === 'Space') this.go(this.cup ? (this.cup.done() ? 'podium' : 'next') : 'new');
    else if (code === 'KeyN') this.go('new');
    else if (code === 'KeyZ') this.go('random');
    else if (code === 'Escape') { if (this.confirmNew) this.confirmNew = false; else this.go('menu'); }
  }
  onMove(x, y) { this.mx = x; this.my = y; }
  onClick(x, y) {
    if (U.pointIn(x, y, UI.back)) { this.go('menu'); return; }
    const b = UI.hit(this.btns, x, y);
    if (b) this.go(b.id);
  }
  render(ctx) {
    MenuBG.draw(ctx, 0.62);
    UI.drawBack(ctx, this.mx, this.my);
    UI.title(ctx, this.cup && this.cup.mp ? 'MEHRSPIELER-WELTCUP' : 'WELTCUP');
    const cup = this.cup;
    UI.panel(ctx, 14, 40, 612, 384);
    if (!cup) {
      Font.draw(ctx, 'EINE SAISON ÜBER FÜNF SCHANZEN – VON DER NORMALSCHANZE', 320, 80, '#ffffff', 1, 'center');
      Font.draw(ctx, 'BIS ZUM SKIFLUG-FINALE. WELTCUP-PUNKTE: 100, 80, 60, 50, 45 ... 1', 320, 96, '#ffffff', 1, 'center');
      Font.draw(ctx, 'DER FÜHRENDE SPRINGT IM GELBEN TRIKOT.', 320, 112, COL.hi, 1, 'center');
      Cup.TOUR.forEach((id, i) => {
        const h = Hills.FIXED.find(d => d.id === id);
        Font.draw(ctx, (i + 1) + '. ' + h.name + ' K' + h.K, 170, 150 + i * 22, i === 4 ? COL.hi : COL.cyan, 2);
        if (i === 4) Font.draw(ctx, 'SKIFLUG-FINALE', 470, 154 + i * 22, COL.hi);
      });
      Font.draw(ctx, 'STARTFELD: ' + (U.clamp(Settings.data.field || 9, 9, AI_JUMPERS.length) + 1) + ' SPRINGER (ÄNDERBAR IN DEN EINSTELLUNGEN)', 320, 280, COL.dim, 1, 'center');
      this.btns = [
        { x: 120, y: 386, w: 190, h: 24, label: '[ENTER] SAISON STARTEN', id: 'new' },
        { x: 330, y: 386, w: 190, h: 24, label: '[Z] ZUFALLSTOUR', id: 'random' }
      ];
    } else {
      // Stationen
      cup.hills.forEach((id, i) => {
        const h = Hills.FIXED.find(d => d.id === id);
        const r = cup.results[i], y = 52 + i * 12, cur = i === cup.station;
        Font.draw(ctx, (i + 1) + '. ' + h.name + ' K' + h.K, 26, y, cur ? COL.hi : (r ? '#ffffff' : COL.dim));
        Font.draw(ctx, r ? 'SIEG: ' + r.winner + (cup.mp ? '' : ' · DU: ' + r.myPlace + '.') : (cur ? '◄ NÄCHSTES SPRINGEN' : ''), 200, y, r ? COL.dim : COL.hi);
      });
      // Gesamtstand (2 Spalten)
      const st = cup.standings();
      Font.draw(ctx, 'GESAMTSTAND', 26, 116, COL.cyan);
      st.forEach((e, i) => {
        if (i >= 32) return;
        const cx = i < 16 ? 26 : 330, y = 128 + (i % 16) * 16;
        const mi = cup.mp ? cup.mp.findIndex(p => p.name === e.name) : -1;
        const mine = !cup.mp && e.name === (Settings.data.name || 'SPIELER');
        const a = AI_JUMPERS.find(x => x.name === e.name);
        if (mi >= 0) { ctx.fillStyle = MP_COL[mi].suit; ctx.fillRect(cx + 120, y, 5, 7); }
        Font.draw(ctx, String(i + 1).padStart(2, ' ') + '.', cx, y, i === 0 ? COL.hi : '#ffffff');
        if (i === 0 && e.pts > 0) { ctx.fillStyle = COL.hi; ctx.fillRect(cx + 20, y, 5, 7); }
        Font.draw(ctx, e.name, cx + 30, y, mine ? COL.hi : '#ffffff');
        Font.draw(ctx, a ? a.nat : (mi >= 0 ? 'P' + (mi + 1) : 'DU'), cx + 128, y, COL.dim);
        Font.draw(ctx, e.pts + ' PKT', cx + 270, y, mine ? COL.hi : '#ffffff', 1, 'right');
      });
      if (this.confirmNew) Font.draw(ctx, 'LAUFENDE SAISON VERWERFEN? NOCHMAL KLICKEN ZUM BESTÄTIGEN, ESC = NEIN', 320, 372, COL.bad, 1, 'center');
      this.btns = cup.done()
        ? [{ x: 120, y: 392, w: 190, h: 24, label: '[ENTER] GESAMTSIEGER', id: 'podium' },
           { x: 330, y: 392, w: 190, h: 24, label: '[N] NEUE SAISON', id: 'new' }]
        : cup.mp ? [{ x: 120, y: 392, w: 220, h: 24, label: '[ENTER] ' + cup.stationLabel(), id: 'next' },
           { x: 360, y: 392, w: 160, h: 24, label: '[ESC] ZURÜCK', id: 'menu' }]
        : [{ x: 60, y: 392, w: 220, h: 24, label: '[ENTER] ' + cup.stationLabel(), id: 'next' },
           { x: 300, y: 392, w: 130, h: 24, label: '[N] NEUE SAISON', id: 'new' },
           { x: 440, y: 392, w: 140, h: 24, label: '[Z] ZUFALLSTOUR', id: 'random' }];
    }
    this.btns.forEach(b => UI.button(ctx, b, U.pointIn(this.mx, this.my, b)));
  }
}

/** Siegerehrung mit Podest und Feuerwerk (Einzelspringen oder Weltcup-Gesamtwertung). */
class PodiumScene {
  get centered() { return true; }
  constructor(comp, opts = {}) {
    this.comp = comp; this.cupObj = opts.cup || null;
    this.t = 0; this.fw = []; this.mx = 0; this.my = 0;
    const meName = Settings.data.name || 'SPIELER';
    if (this.cupObj) {
      const st = this.cupObj.standings();
      const mp = this.cupObj.mp;
      this.st = st.map(e => {
        const a = AI_JUMPERS.find(x => x.name === e.name), mi = mp ? mp.findIndex(p => p.name === e.name) : -1;
        return { name: e.name, col: a ? a.col : (mi >= 0 ? MP_COL[mi] : PLAYER_COL), player: !a, score: e.pts };
      });
      this.unit = ' PKT';
      this.title = 'WELTCUP-GESAMTWERTUNG';
      this.sub = 'SAISON ' + this.cupObj.hills.length + ' STATIONEN';
      this.rank = -1;
    } else {
      this.st = comp.standings().map(c => ({ name: c.name, col: c.col, player: c.player, score: comp.total(c) }));
      this.unit = '';
      this.title = 'SIEGEREHRUNG';
      this.sub = comp.h.title;
      const me = this.st.find(c => c.player);
      this.rank = comp.mp ? -1 : Records.submitComp({ score: Math.round(me.score * 10) / 10, name: meName, hill: comp.h.title, place: this.st.indexOf(me) + 1, date: new Date().toLocaleDateString('de-AT') });
    }
    this.mp = !!(this.cupObj ? this.cupObj.mp : comp.mp);
    this.place = this.st.findIndex(c => c.player) + 1;
    if (this.mp) { /* Mehrspieler: keine Einzel-Erfolge */ }
    else if (this.cupObj) { if (this.place === 1) Ach.unlock('cup_win'); }
    else { if (this.place <= 3) Ach.unlock('podium'); if (this.place === 1) Ach.unlock('comp_win'); }
    this.btn = { x: 240, y: 440, w: 160, h: 22, label: '[ENTER] WEITER', id: 'menu' };
  }
  enter() { Sound.playSong(null); Sound.sfx('fanfare'); setTimeout(() => { if (Game.scene === this) Sound.playSong('menu'); }, 2600); }
  leave() { Sound.sfx('select'); Game.setScene(this.cupObj ? new CupScene(this.cupObj) : (this.mp ? new MultiScene() : new MenuScene())); }
  update(dt) {
    this.t += dt; MenuBG.update(dt);
    if (Math.random() < dt * 2.2) {
      const x = 80 - SCR.UIX + Math.random() * (SCR.LW - 160), y = 60 + Math.random() * 140, c = U.hsl(Math.random() * 360, 90, 60);
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * 6.28, sp = 30 + Math.random() * 70;
        this.fw.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 + Math.random(), c });
      }
      Sound.sfx('tick');
    }
    for (let i = this.fw.length - 1; i >= 0; i--) {
      const p = this.fw[i];
      p.life -= dt; p.vy += 40 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) { this.fw[i] = this.fw[this.fw.length - 1]; this.fw.pop(); }
    }
  }
  onKey(code, key, repeat) { if (!repeat && (code === 'Enter' || code === 'Escape' || code === 'Space')) this.leave(); }
  onMove(x, y) { this.mx = x; this.my = y; }
  onClick(x, y) { if (U.pointIn(x, y, this.btn)) this.leave(); }
  render(ctx) {
    MenuBG.draw(ctx, 0.55);
    for (const p of this.fw) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
    UI.title(ctx, this.title);
    Font.draw(ctx, this.sub, 320, 38, COL.cyan, 1, 'center', '#000');
    const base = 360;
    const blocks = [{ pl: 2, x: 160, h: 60, c: '#c0c8d8' }, { pl: 1, x: 260, h: 90, c: '#ffd23c' }, { pl: 3, x: 360, h: 40, c: '#d08a4a' }];
    for (const b of blocks) {
      ctx.fillStyle = b.c; ctx.fillRect(b.x, base - b.h, 120, b.h);
      ctx.fillStyle = U.shade(b.c, -0.3); ctx.fillRect(b.x, base - b.h, 120, 3);
      Font.draw(ctx, String(b.pl), b.x + 60, base - b.h + 14, '#1a1a1a', 4, 'center');
      const c = this.st[b.pl - 1];
      if (!c) continue;
      const cam = { x: 0, y: 0, ppm: 13 }, np = cam.ppm * SCR.Z;
      const bob = b.pl === 1 ? Math.round(Math.abs(Math.sin(this.t * 5)) * 4) : 0;
      const T = ctx.getTransform();
      const jx = ((b.x + 60) * SCR.Z + T.e - SCR.CX) / np, jy = (SCR.CY - (base - b.h - bob) * SCR.Z) / np;
      const col = b.pl === 1 && this.cupObj ? Object.assign({}, c.col, { bib: '#ffd23c' }) : c.col;
      Renderer.drawJumper(ctx, cam, { x: jx, y: jy, rot: 0, scale: 2, pose: 'stand', pose2: b.pl === 1 ? 'wave' : 'stand', blend: b.pl === 1 ? (Math.sin(this.t * 4) > 0 ? 1 : 0.6) : 1 }, col, this.t);
      Font.draw(ctx, c.name, b.x + 60, base - b.h - 74, c.player ? COL.hi : '#ffffff', 1, 'center', '#000');
      Font.draw(ctx, (this.unit ? c.score : U.fmt1(c.score)) + this.unit, b.x + 60, base - b.h - 62, COL.dim, 1, 'center', '#000');
    }
    ctx.fillStyle = '#2a3a6a'; ctx.fillRect(140, base, 360, 6);
    const what = this.cupObj ? 'WELTCUP' : '';
    const msg = this.mp ? this.st[0].name + (this.cupObj ? ' GEWINNT DEN WELTCUP!' : ' GEWINNT!') : this.place === 1 ? (this.cupObj ? 'DU HOLST DEN GESAMTWELTCUP!' : 'GRATULATION! DU HAST GEWONNEN!')
      : (this.place <= 3 ? 'STARK! PLATZ ' + this.place + ' AUF DEM PODEST!' : 'PLATZ ' + this.place + (what ? ' IM ' + what : '') + ' – NÄCHSTES MAL KLAPPT\'S!');
    Font.draw(ctx, msg, 320, 382, this.place === 1 || this.mp ? COL.hi : '#ffffff', 2, 'center', '#000');
    if (this.rank >= 0) Font.draw(ctx, 'EINTRAG IN DER BESTENLISTE: PLATZ ' + (this.rank + 1), 320, 410, COL.good, 1, 'center', '#000');
    UI.button(ctx, this.btn, U.pointIn(this.mx, this.my, this.btn));
  }
}

/* ------------------------------------------------------------------ */
/* Mehrspieler: 2–4 Personen springen abwechselnd an einem Gerät        */
/* ------------------------------------------------------------------ */
const MP_COL = [
  PLAYER_COL,
  { suit: '#2a6cff', suit2: '#16388c', helmet: '#ffffff', ski: '#ff8a2c' },
  { suit: '#20b050', suit2: '#106028', helmet: '#ffd23c', ski: '#ffffff' },
  { suit: '#ffd23c', suit2: '#a07a10', helmet: '#202020', ski: '#e02c2c' }
];
class MultiScene {
  get centered() { return true; }
  constructor() {
    const d = Settings.data.mp || {};
    this.cfg = { n: U.clamp(d.n || 2, 2, 4), names: (d.names || []).slice(0, 4), fmt: d.fmt ? 1 : 0, tour: d.tour ? 1 : 0, hill: d.hill || Game.hill().id };
    for (let i = 0; i < 4; i++) if (!this.cfg.names[i]) this.cfg.names[i] = 'SPIELER ' + (i + 1);
    if (!Hills.FIXED.some(f => f.id === this.cfg.hill)) this.cfg.hill = 'F03';
    this.saved = Cup.load(true);
    this.sel = 0; this.mx = 0; this.my = 0; this.confirm = false;
  }
  get textInput() { return TextField.active; }
  enter() { Sound.playSong('menu'); }
  update(dt) { MenuBG.update(dt); }
  running() { return this.saved && !this.saved.done(); }
  rows() {
    const r = [0]; for (let i = 1; i <= this.cfg.n; i++) r.push(i);
    r.push(5); if (this.cfg.fmt) r.push(6);
    r.push(7); if (this.running()) r.push(8);
    return r;
  }
  rect(id) {
    if (id === 7) return { x: 180, y: 330, w: 280, h: 26, label: this.cfg.fmt ? '[ENTER] WEITER ZUM WELTCUP' : '[ENTER] WEITER ZUR SCHANZENWAHL', id: 7 };
    if (id === 8) return { x: 180, y: 364, w: 280, h: 26, label: '[W] WELTCUP FORTSETZEN (' + this.saved.stationLabel() + ')', id: 8 };
    const y = id <= 4 ? 58 + id * 30 : 58 + (id + 0.5) * 30;
    return { x: 50, y, w: 540, h: 24 };
  }
  save() { Settings.data.mp = this.cfg; Settings.save(); }
  adjust(id, dir) {
    const c = this.cfg;
    if (id === 0) c.n = U.clamp(c.n + dir, 2, 4);
    else if (id === 5) c.fmt = 1 - c.fmt;
    else if (id === 6) {
      if (c.fmt) c.tour = 1 - c.tour;
      else { const L = Hills.FIXED, i = L.findIndex(f => f.id === c.hill); c.hill = L[(i + dir + L.length) % L.length].id; }
    } else return;
    this.confirm = false; Sound.sfx('blip'); this.save();
  }
  editName(i) {
    const r = this.rect(i);
    Sound.sfx('blip');
    TextField.open({ x: r.x + 300, y: r.y + 1, w: 230, h: r.h - 2 }, {
      value: this.cfg.names[i - 1], max: 12, upper: true, filter: /[^A-Z0-9ÄÖÜß .\-]/g,
      onDone: v => { v = v.trim(); if (v) { this.cfg.names[i - 1] = v; this.save(); Sound.sfx('select'); } }
    });
  }
  players() {
    const seen = {};
    return this.cfg.names.slice(0, this.cfg.n).map((n, i) => {
      let name = n.trim() || 'SPIELER ' + (i + 1);
      if (seen[name]) name = name.slice(0, 10) + ' ' + (i + 1);           // doppelte Namen unterscheiden
      seen[name] = 1;
      return { name };
    });
  }
  activate(id) {
    if (id >= 1 && id <= 4) return this.editName(id);
    if (id === 8) { Sound.sfx('select'); Game.setScene(new CupScene(this.saved)); return; }
    if (id !== 7) return this.adjust(id, 1);
    const pl = this.players();
    if (this.cfg.fmt === 0) {
      Sound.sfx('select'); this.save();
      Game.setScene(new HillSelectScene({ mp: pl, hill: this.cfg.hill }));
    } else {
      if (this.running() && !this.confirm) { this.confirm = true; Sound.sfx('blip'); return; }
      Sound.sfx('select');
      Game.setScene(new CupScene(Cup.start(this.cfg.tour === 1, pl)));
    }
  }
  onKey(code, key, repeat) {
    if (TextField.active) return;
    const rows = this.rows(), k = Math.max(0, rows.indexOf(rows[this.sel]));
    if (code === 'ArrowUp') { this.sel = (k + rows.length - 1) % rows.length; Sound.sfx('tick'); }
    else if (code === 'ArrowDown') { this.sel = (k + 1) % rows.length; Sound.sfx('tick'); }
    else if (code === 'ArrowLeft' || code === 'ArrowRight') {
      this.adjust(rows[k], code === 'ArrowLeft' ? -1 : 1);
      this.sel = Math.min(this.sel, this.rows().length - 1);
    }
    else if ((code === 'Enter' || code === 'Space') && !repeat) this.activate(rows[k] === 0 || rows[k] === 5 || rows[k] === 6 ? 7 : rows[k]);
    else if (code === 'KeyW' && this.running() && !repeat) this.activate(8);
    else if (code === 'Escape' && !repeat) { if (this.confirm) this.confirm = false; else { Sound.sfx('back'); Game.setScene(new MenuScene()); } }
  }
  onMove(x, y) {
    this.mx = x; this.my = y;
    const rows = this.rows(), i = rows.findIndex(id => U.pointIn(x, y, this.rect(id)));
    if (i >= 0 && i !== this.sel) this.sel = i;
  }
  onClick(x, y) {
    if (U.pointIn(x, y, UI.back)) { Sound.sfx('back'); Game.setScene(new MenuScene()); return; }
    const id = this.rows().find(r => U.pointIn(x, y, this.rect(r)));
    if (id === undefined) return;
    const r = this.rect(id);
    if (id <= 6 && id !== 1 && id !== 2 && id !== 3 && id !== 4) this.adjust(id, x < r.x + 400 ? -1 : 1);
    else this.activate(id);
  }
  render(ctx) {
    MenuBG.draw(ctx, 0.62);
    UI.drawBack(ctx, this.mx, this.my);
    UI.title(ctx, 'MEHRSPIELER');
    Font.draw(ctx, '2–4 SPIELER SPRINGEN ABWECHSELND AN DIESEM GERÄT', 320, 36, COL.cyan, 1, 'center', '#000');
    UI.panel(ctx, 30, 48, 580, 372);
    const c = this.cfg, rows = this.rows(), cur = rows[Math.min(this.sel, rows.length - 1)];
    const val = {
      0: c.n + ' SPIELER',
      5: c.fmt ? 'WELTCUP (5 SCHANZEN)' : 'EINZELSPRINGEN',
      6: c.tour ? 'ZUFALLSTOUR' : 'STANDARD-TOUR'
    };
    const label = { 0: 'ANZAHL', 5: 'FORMAT', 6: 'TOUR' };
    rows.forEach(id => {
      const r = this.rect(id), on = id === cur;
      if (id >= 7) { UI.button(ctx, r, on); return; }
      if (on) { ctx.fillStyle = 'rgba(255,210,60,0.16)'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.fillStyle = COL.hi; ctx.fillRect(r.x, r.y, 3, r.h); }
      if (id >= 1 && id <= 4) {
        const col = MP_COL[id - 1];
        Font.draw(ctx, 'SPIELER ' + id, r.x + 14, r.y + 6, on ? COL.hi : '#ffffff', 2);
        CompetitionScene.prototype.drawMini(ctx, r.x + 250, r.y + 17, col);
        ctx.fillStyle = col.suit; ctx.fillRect(r.x + 262, r.y + 6, 24, 12);
        if (!(TextField.active && on)) Font.draw(ctx, c.names[id - 1], r.x + 306, r.y + 6, COL.hi, 2);
        if (on && !TextField.active) Font.draw(ctx, 'ENTER = NAME ÄNDERN', r.x + r.w - 8, r.y + 9, COL.dim, 1, 'right');
      } else {
        Font.draw(ctx, label[id], r.x + 14, r.y + 6, on ? COL.hi : '#ffffff', 2);
        Font.draw(ctx, '◄', r.x + 280, r.y + 6, on ? COL.hi : COL.dim, 2);
        Font.draw(ctx, val[id], r.x + 410, r.y + 6, '#ffffff', 2, 'center');
        Font.draw(ctx, '►', r.x + r.w - 20, r.y + 6, on ? COL.hi : COL.dim, 2);
      }
    });
    if (this.confirm) Font.draw(ctx, 'LAUFENDEN MEHRSPIELER-WELTCUP VERWERFEN? NOCHMAL START ZUM BESTÄTIGEN', 320, 398, COL.bad, 1, 'center');
    else Font.draw(ctx, '↑↓ WÄHLEN · ◄► ÄNDERN · ENTER WEITER · ESC ZURÜCK', 320, 404, COL.dim, 1, 'center');
  }
}

/* Einstellungen                                                        */
/* ------------------------------------------------------------------ */
class SettingsScene {
  get centered() { return true; }
  constructor() {
    this.sel = 0; this.mx = 0; this.my = 0;
    this.confirmClear = false;
    this.rows = ['MUSIK-LAUTSTÄRKE', 'EFFEKT-LAUTSTÄRKE', 'MUSIK', 'SCHWIERIGKEIT', 'MAUS-EMPFINDLICHKEIT', 'HILFETEXTE',
      'WETTKAMPF-FELD', 'KI-SPRÜNGE ZEIGEN', 'GRAFIK', 'SPIELERNAME', 'REKORDE LÖSCHEN', 'ZURÜCK'];
    this.rects = this.rows.map((r, i) => ({ x: 70, y: 40 + i * 31, w: 500, h: 26 }));
    this.N_ADJ = 9;    // Zeilen 0..8 sind Regler
  }
  exit() { TextField.close(false); }
  update(dt) { MenuBG.update(dt); }
  value(i) {
    const d = Settings.data;
    switch (i) {
      case 0: return '■'.repeat(d.musicVol) + '□'.repeat(10 - d.musicVol);
      case 1: return '■'.repeat(d.sfxVol) + '□'.repeat(10 - d.sfxVol);
      case 2: return d.musicOn ? 'AN' : 'AUS';
      case 3: return DIFF[d.difficulty].name;
      case 4: return '■'.repeat(d.sens) + '□'.repeat(10 - d.sens);
      case 5: return d.help ? 'AN' : 'AUS';
      case 6: return ((d.field || 9) + 1) + ' SPRINGER';
      case 7: return { all: 'ALLE', top: 'TOP 5', none: 'KEINE' }[d.watchAI || 'top'];
      case 8: return { auto: 'AUTO (' + (Quality.low ? 'NIEDRIG' : 'HOCH') + ')', high: 'HOCH', low: 'NIEDRIG' }[d.gfx || 'auto'];
      case 9: return TextField.active ? '' : d.name;
      case 10: return this.confirmClear ? 'ENTER = WIRKLICH LÖSCHEN' : '';
      default: return '';
    }
  }
  adjust(i, dir) {
    const d = Settings.data;
    switch (i) {
      case 0: d.musicVol = U.clamp(d.musicVol + dir, 0, 10); break;
      case 1: d.sfxVol = U.clamp(d.sfxVol + dir, 0, 10); break;
      case 2: d.musicOn = !d.musicOn; break;
      case 3: d.difficulty = (d.difficulty + dir + 3) % 3; break;
      case 4: d.sens = U.clamp(d.sens + dir, 1, 10); break;
      case 5: d.help = !d.help; break;
      case 6: { const opts = [4, 9, 19, 29]; const i = opts.indexOf(d.field || 9); d.field = opts[U.clamp((i < 0 ? 1 : i) + dir, 0, 3)]; break; }
      case 7: { const opts = ['none', 'top', 'all']; d.watchAI = opts[(opts.indexOf(d.watchAI || 'top') + dir + 3) % 3]; break; }
      case 8: { const opts = ['auto', 'high', 'low']; d.gfx = opts[(opts.indexOf(d.gfx || 'auto') + dir + 3) % 3]; if (d.gfx === 'auto') Quality.init(); else Quality.apply(); break; }
      default: return;
    }
    Settings.save(); Sound.applySettings();
    Sound.sfx('blip');
  }
  activate(i) {
    if (i === 9) {
      Sound.sfx('blip');
      const Rr = this.rects[9];
      TextField.open({ x: Rr.x + 250, y: Rr.y + 2, w: Rr.w - 256, h: Rr.h - 4 }, {
        value: Settings.data.name, max: 12, upper: true, filter: /[^A-Z0-9ÄÖÜß .\-]/g,
        onDone: v => { v = v.trim(); if (v) { Settings.data.name = v; Settings.save(); Sound.sfx('select'); } }
      });
    } else if (i === 10) {
      if (this.confirmClear) { Records.clear(); this.confirmClear = false; Sound.sfx('back'); Game.toast('REKORDE GELÖSCHT'); }
      else { this.confirmClear = true; Sound.sfx('blip'); }
    } else if (i === 11) { Sound.sfx('back'); Game.setScene(new MenuScene()); }
    else this.adjust(i, 1);
  }
  onKey(code, key, repeat) {
    const n = this.rows.length;
    if (code === 'ArrowUp') { this.sel = (this.sel + n - 1) % n; this.confirmClear = false; Sound.sfx('tick'); }
    else if (code === 'ArrowDown') { this.sel = (this.sel + 1) % n; this.confirmClear = false; Sound.sfx('tick'); }
    else if (code === 'ArrowLeft') this.adjust(this.sel, -1);
    else if (code === 'ArrowRight') this.adjust(this.sel, 1);
    else if (repeat) return;
    else if (code === 'Enter' || code === 'Space') this.activate(this.sel);
    else if (code === 'Escape') { Sound.sfx('back'); Game.setScene(new MenuScene()); }
  }
  onMove(x, y) {
    this.mx = x; this.my = y;
    const i = this.rects.findIndex(r => U.pointIn(x, y, r));
    if (i >= 0 && i !== this.sel && !TextField.active) { this.sel = i; this.confirmClear = false; }
  }
  onClick(x, y) {
    if (U.pointIn(x, y, UI.back)) { Sound.sfx('back'); Game.setScene(new MenuScene()); return; }
    const i = this.rects.findIndex(r => U.pointIn(x, y, r));
    if (i < 0) return;
    this.sel = i;
    if (i >= this.N_ADJ) { this.activate(i); return; }
    // Position im rechtsbündig gezeichneten Text '◄ WERT ►' bestimmen (6 px pro Zeichen)
    const R = this.rects[i], text = '◄ ' + this.value(i) + ' ►';
    const right = R.x + R.w - 12, x0 = right - (text.length * 6 - 1);
    const idx = Math.floor((x - x0) / 6);
    if (idx < 0) {                                      // Klick auf die Beschriftung
      if (i === 2 || i === 5 || i === 7 || i === 8) this.adjust(i, 1);
      return;
    }
    if (idx <= 1) { this.adjust(i, -1); return; }       // linker Pfeil: leiser / weniger
    if (idx >= text.length - 2) { this.adjust(i, 1); return; }  // rechter Pfeil: lauter / mehr
    const k = idx - 2;                                  // Klick direkt auf den Wert
    if (i === 0 || i === 1 || i === 4) this.setLevel(i, k + 1);
    else this.adjust(i, 1);
  }
  /** Balkenwert direkt setzen (Klick auf ein Kästchen). */
  setLevel(i, n) {
    const d = Settings.data;
    if (i === 0) d.musicVol = U.clamp(n, 0, 10);
    else if (i === 1) d.sfxVol = U.clamp(n, 0, 10);
    else if (i === 4) d.sens = U.clamp(n, 1, 10);
    Settings.save(); Sound.applySettings(); Sound.sfx('blip');
  }
  render(ctx) {
    MenuBG.draw(ctx, 0.62);
    UI.title(ctx, 'EINSTELLUNGEN');
    UI.drawBack(ctx, this.mx, this.my);
    this.rows.forEach((r, i) => {
      const R = this.rects[i], on = i === this.sel;
      ctx.fillStyle = on ? 'rgba(255,210,60,0.2)' : 'rgba(10,20,60,0.8)';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      if (on) { ctx.fillStyle = COL.hi; ctx.fillRect(R.x, R.y, 3, R.h); }
      Font.draw(ctx, r, R.x + 14, R.y + 6, on ? COL.hi : '#ffffff', 2);
      const v = this.value(i);
      const adj = i < this.N_ADJ;
      if (adj) {
        const right = R.x + R.w - 12, x0 = right - ((v.length + 4) * 6 - 1);
        Font.draw(ctx, '◄', x0, R.y + 9, on ? COL.hi : COL.dim);
        Font.draw(ctx, v, x0 + 12, R.y + 9, COL.cyan);
        Font.draw(ctx, '►', right - 5, R.y + 9, on ? COL.hi : COL.dim);
      } else Font.draw(ctx, v, R.x + R.w - 12, R.y + 10, i === 10 ? COL.bad : COL.cyan, 1, 'right');
    });
    Font.draw(ctx, '↑↓ WÄHLEN · ◄ ► ÄNDERN · ENTER OK · M = MUSIK AN/AUS', 320, 418, COL.dim, 1, 'center', '#000');
    Font.draw(ctx, 'GRAFIK NIEDRIG: SPIELWELT IN HALBER AUFLÖSUNG – FÜR HANDYS UND ÄLTERE GERÄTE', 320, 432, '#5a6a9a', 1, 'center', '#000');
  }
}

/* ------------------------------------------------------------------ */
/* Game – Hauptschleife mit fixem Zeitschritt                           */
/* ------------------------------------------------------------------ */
const Game = {
  canvas: null, ctx: null, scene: null, hillId: 'F03',
  acc: 0, last: 0, toastMsg: null, toastT: 0, training: null,

  init() {
    Settings.init(); Records.init(); Ach.init(); Quality.init();
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.hillId = Settings.data.hill || 'F03';
    try { this.hill(); } catch (e) { this.hillId = 'F03'; }
    Input.init(this.canvas);
    window.addEventListener('resize', () => this.resize());
    this.resize();
    this.setScene(new MenuScene());
    this.canvas.focus();
    requestAnimationFrame(ts => { this.last = ts; this.loop(ts); });
  },
  hill() { return Hills.get(this.hillId); },
  setHill(id) { this.hillId = id; Settings.data.hill = id; Settings.save(); },
  setScene(s) {
    if (this.scene && this.scene !== s && this.scene.exit) this.scene.exit();
    this.scene = s;
    if (s.enter) s.enter();
  },
  /** Trainingssitzung starten bzw. mit R neu starten. */
  startTraining(h, session, extra = {}) {
    if (!session || session.hillId !== h.id) session = { hillId: h.id, last: [], best: 0 };
    if (extra.challenge) session.challenge = extra.challenge;
    this.training = session;
    this.setScene(new JumpScene(h, { mode: 'training', jumper: { name: Settings.data.name, col: PLAYER_COL }, session, gate: session.gate, challenge: session.challenge }));
  },
  toast(msg) { this.toastMsg = msg; this.toastT = 1.6; },
  notes: [],
  /** Große Meldung oben (z. B. freigeschalteter Erfolg); mehrere werden nacheinander gezeigt. */
  notify(title, sub) {
    this.notes.push({ title, sub, t: 0 });
    if (this.notes.length === 1) Sound.sfx('record');
  },

  /** Vollbild umschalten (in eingebetteten Seiten ggf. nicht erlaubt). */
  fullscreen() {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement) { d.exitFullscreen(); return; }
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
      if (!p) { this.toast('VOLLBILD NICHT VERFÜGBAR'); return; }
      p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* ignorieren */ } })
        .catch(() => this.toast('VOLLBILD HIER NICHT ERLAUBT'));
    } catch (e) { this.toast('VOLLBILD NICHT VERFÜGBAR'); }
  },
  key(code, key, repeat) {
    if (code === 'KeyF' && !repeat && !(this.scene instanceof JumpScene)) { this.fullscreen(); return; }
    if (code === 'KeyM' && !(this.scene && this.scene.textInput)) {
      if (!repeat) { Sound.toggleMusic(); this.toast(Settings.data.musicOn ? 'MUSIK AN' : 'MUSIK AUS'); }
      return;
    }
    if (this.scene && this.scene.onKey) this.scene.onKey(code, key, repeat);
  },
  click(x, y, b) { if (this.scene && this.scene.onClick) this.scene.onClick(x, y, b); },
  move(x, y) { if (this.scene && this.scene.onMove) this.scene.onMove(x, y); },

  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    const s = Math.min(w / SCR.LW, h / SCR.LH);
    this.canvas.style.width = Math.floor(SCR.LW * s) + 'px';
    this.canvas.style.height = Math.floor(SCR.LH * s) + 'px';
    TextField.place();
  },

  loop(ts) {
    const dt = Math.min(0.25, Math.max(0, (ts - this.last) / 1000));
    this.last = ts;
    Quality.watch(dt * 1000, this.scene instanceof JumpScene);
    this.acc += dt;
    let steps = 0;
    while (this.acc >= PHYS.DT && steps < 8) {
      this.scene.update(PHYS.DT);
      this.acc -= PHYS.DT; steps++;
      if (this.toastT > 0) this.toastT -= PHYS.DT;
      if (this.notes.length) {
        this.notes[0].t += PHYS.DT;
        if (this.notes[0].t > 2.4) { this.notes.shift(); if (this.notes.length) Sound.sfx('tick'); }
      }
    }
    if (steps >= 8) this.acc = 0;   // nach langer Pause nicht nachholen
    const ctx = this.ctx;
    // Menüs und HUD in logischen 640x480-Koordinaten, exakt 2x skaliert
    ctx.setTransform(SCR.Z, 0, 0, SCR.Z, this.scene.centered ? SCR.UIX * SCR.Z : 0, 0);
    ctx.imageSmoothingEnabled = false;
    this.scene.render(ctx);
    ctx.setTransform(SCR.Z, 0, 0, SCR.Z, SCR.UIX * SCR.Z, 0);
    if (this.toastT > 0 && this.toastMsg) {
      const w = Font.width(this.toastMsg, 2) + 24;
      UI.panel(ctx, 320 - w / 2, 440, w, 26);
      Font.draw(ctx, this.toastMsg, 320, 446, COL.hi, 2, 'center');
    }
    if (Input.isTouch && window.innerHeight > window.innerWidth * 1.05) {
      ctx.setTransform(SCR.Z, 0, 0, SCR.Z, 0, 0);
      ctx.fillStyle = 'rgba(4,8,30,0.88)'; ctx.fillRect(0, 0, SCR.LW, SCR.LH);
      const ph = Math.floor(performance.now() / 700) % 2;           // Handy-Symbol kippt
      ctx.fillStyle = COL.hi;
      if (ph) ctx.fillRect(SCR.LCX - 30, 150, 60, 34); else ctx.fillRect(SCR.LCX - 17, 135, 34, 64);
      ctx.fillStyle = '#0a1433';
      if (ph) ctx.fillRect(SCR.LCX - 26, 154, 52, 26); else ctx.fillRect(SCR.LCX - 13, 139, 26, 56);
      Font.draw(ctx, 'BITTE DAS GERÄT QUER HALTEN', SCR.LCX, 240, COL.hi, 3, 'center');
      Font.draw(ctx, 'DAS SPIEL IST FÜR DAS QUERFORMAT (16:9) GEMACHT.', SCR.LCX, 280, '#ffffff', 2, 'center');
      ctx.setTransform(SCR.Z, 0, 0, SCR.Z, SCR.UIX * SCR.Z, 0);
    }
    if (this.notes.length) {
      const n = this.notes[0], k = Math.min(1, n.t * 5, (2.4 - n.t) * 5);
      const w = Math.max(Font.width(n.title, 2), Font.width(n.sub)) + 40, y = Math.round(-40 + 46 * k);
      UI.panel(ctx, 320 - w / 2, y, w, 38, 0.96);
      ctx.fillStyle = COL.hi; ctx.fillRect(320 - w / 2, y, 4, 38); ctx.fillRect(320 + w / 2 - 4, y, 4, 38);
      Font.draw(ctx, n.title, 320, y + 7, COL.hi, 2, 'center');
      Font.draw(ctx, n.sub, 320, y + 25, '#ffffff', 1, 'center');
    }
    requestAnimationFrame(t => this.loop(t));
  }
};

Game.init();
</script>

</html>
