/* =====================================================================
   ALPINE SKI JUMP DELUXE
   Ein Skisprungspiel im Stil der DOS-Ära – alles prozedural erzeugt.

   Module (in dieser Reihenfolge):
     U         – Hilfsfunktionen (Mathe, Zufall, Farben, Formatierung)
     Font      – 5x7-Bitmap-Schrift, per Code definiert
     Store / Settings / Records – Speicherung in localStorage
     Sound     – Web-Audio: Chiptune-Sequencer, Effekte, Rausch-Loops
     Input     – Tastatur, Maus, Touch
     Hills     – Schanzendefinitionen, Geometrie, Zufallsgenerator, Kalibrierung
     JumpSim   – Physik eines Sprungs (Anlauf, Absprung, Flug, Landung)
     AIPilot   – KI-Steuerung (Gegner und Kalibrier-Referenz)
     Scoring   – Weiten- und Haltungspunkte
     Renderer  – Himmel, Berge, Schanze, Springer, Partikel, Vorschau
     Scenes    – Menü, Schanzenwahl, Zufallsschanze, Sprung, Wettkampf, …
     Game      – Hauptschleife mit fixem Zeitschritt (60 Hz)
   ===================================================================== */

/* ------------------------------------------------------------------ */
/* U – Hilfsfunktionen                                                 */
/* ------------------------------------------------------------------ */
const U = {
  clamp: (v, a, b) => (v < a ? a : (v > b ? b : v)),
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: t => (t <= 0 ? 0 : (t >= 1 ? 1 : t * t * (3 - 2 * t))),
  rad: d => d * Math.PI / 180,
  deg: r => r * 180 / Math.PI,

  /** Deterministischer Zufallsgenerator (Mulberry32). */
  rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  /** FNV-1a-Hash eines Strings (für Seeds). */
  hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  },
  rr: (rng, a, b) => a + (b - a) * rng(),
  ri: (rng, a, b) => Math.floor(a + (b - a + 1) * rng()),
  pick: (rng, arr) => arr[Math.floor(rng() * arr.length) % arr.length],
  gauss(rng) {
    let u = 0;
    while (u === 0) u = rng();
    const v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  },

  /* Farben */
  hex2rgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  rgb2hex(r, g, b) {
    const c = v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  },
  mix(a, b, t) {
    const A = U.hex2rgb(a), B = U.hex2rgb(b);
    return U.rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  },
  /** f > 0 hellt auf (Richtung Weiß), f < 0 dunkelt ab. */
  shade(hex, f) { return f >= 0 ? U.mix(hex, '#ffffff', f) : U.mix(hex, '#000000', -f); },
  hsl(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return U.rgb2hex(f(0) * 255, f(8) * 255, f(4) * 255);
  },

  /* Formatierung (deutsches Dezimalkomma) */
  fmtDist: d => (Math.floor(d * 2) / 2).toFixed(1).replace('.', ','),
  fmt1: n => n.toFixed(1).replace('.', ','),
  pointIn: (px, py, r) => px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h
};

const Font = (() => {

    '<': [0x08, 0x14, 0x22, 0x41, 0], '=': [0x14, 0x14, 0x14, 0x14, 0x14], '>': [0, 0x41, 0x22, 0x14, 0x08],
    '?': [0x02, 0x01, 0x51, 0x09, 0x06], '[': [0, 0x7F, 0x41, 0x41, 0], ']': [0, 0x41, 0x41, 0x7F, 0],
    '_': [0x40, 0x40, 0x40, 0x40, 0x40], '|': [0, 0, 0x7F, 0, 0], '^': [0x04, 0x02, 0x01, 0x02, 0x04],

    'M': [0x7F, 0x02, 0x0C, 0x02, 0x7F], 'N': [0x7F, 0x04, 0x08, 0x10, 0x7F], 'O': [0x3E, 0x41, 0x41, 0x41, 0x3E],
    'P': [0x7F, 0x09, 0x09, 0x09, 0x06], 'Q': [0x3E, 0x41, 0x51, 0x21, 0x5E], 'R': [0x7F, 0x09, 0x19, 0x29, 0x46],
    'S': [0x46, 0x49, 0x49, 0x49, 0x31], 'T': [0x01, 0x01, 0x7F, 0x01, 0x01], 'U': [0x3F, 0x40, 0x40, 0x40, 0x3F],
    'V': [0x1F, 0x20, 0x40, 0x20, 0x1F], 'W': [0x3F, 0x40, 0x38, 0x40, 0x3F], 'X': [0x63, 0x14, 0x08, 0x14, 0x63],
    'Y': [0x07, 0x08, 0x70, 0x08, 0x07], 'Z': [0x61, 0x51, 0x49, 0x45, 0x43],
    'Ä': [0x78, 0x15, 0x14, 0x15, 0x78], 'Ö': [0x38, 0x45, 0x44, 0x45, 0x38], 'Ü': [0x3C, 0x41, 0x40, 0x41, 0x3C],
    'ß': [0x7E, 0x01, 0x49, 0x36, 0x00], '°': [0, 0x06, 0x09, 0x06, 0],
    '↑': [0x04, 0x02, 0x7F, 0x02, 0x04], '↓': [0x10, 0x20, 0x7F, 0x20, 0x10],
    '►': [0x7F, 0x3E, 0x1C, 0x08, 0x00], '◄': [0x00, 0x08, 0x1C, 0x3E, 0x7F],
    '■': [0x7F, 0x7F, 0x7F, 0x7F, 0x7F], '□': [0x7F, 0x41, 0x41, 0x41, 0x7F],
    '·': [0, 0, 0x08, 0, 0], '–': [0x08, 0x08, 0x08, 0x08, 0x08],
    '▲': [0x20, 0x30, 0x38, 0x30, 0x20], '▼': [0x08, 0x18, 0x38, 0x18, 0x08], 'Ø': [0x7E, 0x51, 0x49, 0x45, 0x3F]
  };
  const chars = Object.keys(G);
  const index = {};
  chars.forEach((c, i) => { index[c] = i; });
  const atlases = new Map();   // Farbe -> vorgerenderter Glyphen-Atlas

  function atlas(color) {
    let c = atlases.get(color);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = chars.length * 6; c.height = 8;
    const g = c.getContext('2d');
    g.fillStyle = color;
    chars.forEach((ch, i) => {
      const cols = G[ch];
      for (let x = 0; x < 5; x++)
        for (let y = 0; y < 7; y++)
          if (cols[x] & (1 << y)) g.fillRect(i * 6 + x, y, 1, 1);
    });
    atlases.set(color, c);
    return c;
  }

  const norm = t => String(t).toUpperCase();
  return {
    width: (text, scale = 1) => norm(text).length * 6 * scale - scale,
    /** Zeichnet Text. align: 'left' | 'center' | 'right'. */
    draw(ctx, text, x, y, color = '#fff', scale = 1, align = 'left', shadow = null) {
      const t = norm(text);
      const w = t.length * 6 * scale - scale;
      let sx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
      sx = Math.round(sx); y = Math.round(y);
      if (shadow) this._raw(ctx, t, sx + scale, y + scale, shadow, scale);
      this._raw(ctx, t, sx, y, color, scale);
      return w;
    },
    _raw(ctx, t, x, y, color, scale) {
      const a = atlas(color);
      for (let i = 0; i < t.length; i++) {
        let gi = index[t[i]];
        if (gi === undefined) gi = index['?'];
        if (t[i] === ' ') continue;
        ctx.drawImage(a, gi * 6, 0, 6, 8, x + i * 6 * scale, y, 6 * scale, 8 * scale);
      }
    }
  };
})();

/* ------------------------------------------------------------------ */
/* Store / Settings / Records – lokale Speicherung                     */
/* ------------------------------------------------------------------ */
const Store = {
  load(key, def) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch (e) { return def; }
  },
  save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* Speicher voll/gesperrt */ }
  }
};

const Settings = {
  data: null,
  defaults: {
    musicVol: 6, sfxVol: 8, musicOn: true, difficulty: 1, sens: 5,
    name: 'SPIELER', hill: 'F03', help: true, field: 9, watchAI: 'top', gfx: 'auto'
  },
  init() { this.data = Object.assign({}, this.defaults, Store.load('asjd_settings', {})); },
  save() { Store.save('asjd_settings', this.data); }
};

const Records = {
  hills: null,  // id -> {d, name, date, title}
  comp: null,   // Bestenliste Wettkampf
  init() {
    this.hills = Store.load('asjd_records', {});
    this.comp = Store.load('asjd_comp', []);
  },
  get(id) { return this.hills[id] || null; },
  /** Trägt eine Weite ein. Rückgabe true = neuer Schanzenrekord. */
  submit(hill, dist, name) {
    const r = this.hills[hill.id];
    if (r && r.d >= dist) return false;
    this.hills[hill.id] = {
      d: dist, name, date: new Date().toLocaleDateString('de-AT'),
      title: hill.title, seed: hill.seed || null, random: !!hill.random
    };
    Store.save('asjd_records', this.hills);
    return true;
  },
  submitComp(entry) {
    this.comp.push(entry);
    this.comp.sort((a, b) => b.score - a.score);
    this.comp = this.comp.slice(0, 10);
    Store.save('asjd_comp', this.comp);
    return this.comp.indexOf(entry);
  },
  clear() {
    this.hills = {}; this.comp = [];
    Store.save('asjd_records', this.hills); Store.save('asjd_comp', this.comp);
  }
};

const Sound = (() => {
  const NOTE = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const midi = n => { const m = /^([A-G][#b]?)(-?\d)$/.exec(n); return 12 * (+m[2] + 1) + NOTE[m[1]]; };

  /** Übersetzt eine Songdefinition in eine Event-Liste pro Sechzehntel. */
  function compile(def) {
    const bars = def.lead.length, len = bars * 16;
    const ev = Array.from({ length: len }, () => []);
    def.lead.forEach((bar, b) => {
      const tk = bar.trim().split(/\s+/);
      for (let i = 0; i < 16; i++) {
        const t = tk[i];
        if (!t || t === '-' || t === '.') continue;
        let d = 1;
        while (i + d < 16 && tk[i + d] === '-') d++;
        ev[b * 16 + i].push({ k: 'lead', f: mtof(midi(t)), d });
      }
    });
    for (let b = 0; b < bars; b++) {
      const m = /^([A-G][#b]?)(m?)$/.exec(def.chords[b % def.chords.length]);
      const root = NOTE[m[1]], minor = m[2] === 'm';
      const tones = [0, minor ? 3 : 4, 7, 12];
      const bassRoot = 36 + root + (root > 7 ? -12 : 0);
      for (let i = 0; i < 16; i++) {
        const c = def.bass[i];
        if (c === 'R' || c === 'F' || c === 'O') {
          let d = 1;
          while (i + d < 16 && def.bass[i + d] === '-') d++;
          ev[b * 16 + i].push({ k: 'bass', f: mtof(bassRoot + (c === 'R' ? 0 : c === 'F' ? 7 : 12)), d });
        }
        if (i % def.arpEvery === 0) {
          const tone = tones[(i / def.arpEvery) % 4];
          ev[b * 16 + i].push({ k: 'arp', f: mtof(60 + root + (root > 7 ? -12 : 0) + tone), d: def.arpEvery });
        }
        const dc = def.drums[i];
        if (dc && dc !== '.') ev[b * 16 + i].push({ k: dc });
      }
    }
    return { bpm: def.bpm, len, ev, def };
  }
  const SONGS = {};

  const S = {
    ctx: null, master: null, music: null, sfxOut: null, noiseBuf: null, pulse: null,
    song: null, songName: null, pending: 'menu', nextTime: 0, step: 0, timer: null,
    duckLevel: 1, loops: {},

    /** Wird bei der ersten Nutzerinteraktion aufgerufen (Autoplay-Regeln). */
    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain(); this.master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      this.master.connect(comp).connect(ctx.destination);
      this.music = ctx.createGain(); this.music.connect(this.master);
      this.sfxOut = ctx.createGain(); this.sfxOut.connect(this.master);
      // Weißes Rauschen (2 s) für Schnee, Wind, Jubel, Drums
      const len = ctx.sampleRate * 2;
      this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // 25%-Pulswelle für den typischen Chiptune-Lead
      const N = 32, re = new Float32Array(N), im = new Float32Array(N);
      for (let n = 1; n < N; n++) im[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * 0.25) * 1;
      this.pulse = ctx.createPeriodicWave(re, im);
      for (const k in SONG_DEFS) SONGS[k] = compile(SONG_DEFS[k]);
      this.applySettings();
      this.timer = setInterval(() => this._schedule(), 25);
      const p = this.pending; this.songName = undefined;
      this.playSong(p);
    },

    applySettings() {
      if (!this.ctx) return;
      const s = Settings.data, t = this.ctx.currentTime;
      const mv = s.musicOn ? (s.musicVol / 10) * 0.5 * this.duckLevel : 0;
      this.music.gain.setTargetAtTime(mv, t, 0.08);
      this.sfxOut.gain.setTargetAtTime((s.sfxVol / 10) * 0.9, t, 0.03);
    },
    duck(level) { this.duckLevel = level; this.applySettings(); },
    toggleMusic() {
      Settings.data.musicOn = !Settings.data.musicOn;
      Settings.save(); this.applySettings();
    },

    playSong(name) {
      this.pending = name;
      if (!this.ctx || this.songName === name) return;
      this.songName = name;
      this.song = name ? SONGS[name] : null;
      this.step = 0;
      this.nextTime = this.ctx.currentTime + 0.08;
    },

    _schedule() {
      if (!this.ctx || !this.song) return;
      const now = this.ctx.currentTime;
      const spb = 60 / this.song.bpm / 4;
      if (this.nextTime < now - 0.2) this.nextTime = now + 0.05; // nach Tab-Pause nicht nachholen
      while (this.nextTime < now + 0.12) {
        this._playStep(this.song.ev[this.step], this.nextTime, spb);
        this.nextTime += spb;
        this.step = (this.step + 1) % this.song.len;
      }
    },
    _playStep(list, t, spb) {
      const def = this.song.def, out = this.music;
      for (const e of list) {
        switch (e.k) {
          case 'lead': this.tone(this.pulse, e.f, t, e.d * spb * 0.92, def.leadVol, out, 0.012); break;
          case 'bass': this.tone('triangle', e.f, t, e.d * spb * 0.9, def.bassVol, out); break;
          case 'arp': this.tone('square', e.f, t, e.d * spb * 0.6, def.arpVol, out); break;
          case 'K': this.sweep('sine', 150, 42, t, 0.14, 0.55 * def.drumVol, out); break;
          case 'S': this.noise(t, 0.12, 'bandpass', 1900, 0.28 * def.drumVol, 0.8, out);
            this.tone('triangle', 190, t, 0.05, 0.12 * def.drumVol, out); break;
          case 'H': this.noise(t, 0.035, 'highpass', 7000, 0.14 * def.drumVol, 0.7, out); break;
          case 'O': this.noise(t, 0.14, 'highpass', 6500, 0.12 * def.drumVol, 0.7, out); break;
        }
      }
    },

    /* --- Klangbausteine --- */
    tone(wave, f, t, dur, vol, out, vib = 0) {
      const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
      o.frequency.setValueAtTime(f, t);
      if (vib && dur > 0.25) {   // leichtes Vibrato bei langen Tönen
        o.frequency.setValueAtTime(f, t + 0.18);
        o.frequency.linearRampToValueAtTime(f * (1 + vib), t + dur * 0.6);
        o.frequency.linearRampToValueAtTime(f, t + dur);
      }
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.006);
      g.gain.setTargetAtTime(vol * 0.65, t + 0.01, Math.max(0.02, dur * 0.4));
      g.gain.setTargetAtTime(0, t + dur, 0.025);
      o.connect(g).connect(out || this.sfxOut);
      o.start(t); o.stop(t + dur + 0.2);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    },
    sweep(wave, f0, f1, t, dur, vol, out) {
      const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(out || this.sfxOut);
      o.start(t); o.stop(t + dur + 0.05);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    },
    noise(t, dur, ftype, freq, vol, q = 1, out, attack = 0.003) {
      const ctx = this.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = this.noiseBuf;
      f.type = ftype; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f).connect(g).connect(out || this.sfxOut);
      src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
      src.onended = () => { src.disconnect(); f.disconnect(); g.disconnect(); };
    },

    /** Soundeffekte. p = Intensität 0..1 */
    sfx(name, p = 1) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + 0.005;
      switch (name) {
        case 'blip': this.tone('square', 660, t, 0.04, 0.10); break;
        case 'select': this.tone('square', 660, t, 0.05, 0.11); this.tone('square', 990, t + 0.06, 0.08, 0.11); break;
        case 'back': this.tone('square', 520, t, 0.05, 0.10); this.tone('square', 350, t + 0.06, 0.07, 0.10); break;
        case 'tick': this.tone('square', 1300, t, 0.02, 0.05); break;
        case 'beep': this.tone('square', 520, t, 0.12, 0.14); break;
        case 'go': this.tone('square', 1040, t, 0.28, 0.14); break;
        case 'crouch': this.noise(t, 0.15, 'lowpass', 1200, 0.18); break;
        case 'thud':
          this.sweep('sine', 120, 45, t, 0.14, 0.22 * p + 0.05);
          this.noise(t, 0.12, 'lowpass', 600, 0.18 * p + 0.04);
          break;
        case 'jump':
          this.sweep('square', 260, 780, t, 0.15, 0.12 * p + 0.04);
          this.noise(t, 0.25, 'highpass', 2200, 0.28);
          if (p >= 0.97) { this.tone('square', 1320, t + 0.12, 0.08, 0.08); this.tone('square', 1760, t + 0.2, 0.12, 0.08); }
          break;
        case 'land':
          this.sweep('sine', 150, 45, t, 0.25, 0.5);
          this.noise(t, 0.3, 'lowpass', 900, 0.35 * p + 0.1);
          break;
        case 'crash':
          this.sweep('sine', 120, 35, t, 0.4, 0.6);
          this.noise(t, 0.8, 'bandpass', 500, 0.45, 0.6);
          this.noise(t + 0.25, 0.5, 'lowpass', 700, 0.3);
          this.fail(t + 0.35);
          break;
        case 'fail': this.fail(t); break;
        case 'cheer': this.cheer(t, p); break;
        case 'record': {
          const f = [523, 659, 784, 1047, 1319];
          f.forEach((fr, i) => this.tone(this.pulse, fr, t + i * 0.09, 0.12, 0.13));
          this.tone(this.pulse, 1568, t + 0.45, 0.45, 0.12, null, 0.01);
          break;
        }
        case 'fanfare': {
          const seq = [[392, 0, 0.15], [523, 0.16, 0.15], [659, 0.32, 0.15], [784, 0.48, 0.45], [659, 0.96, 0.15], [784, 1.12, 0.9]];
          seq.forEach(([fr, dt, d]) => {
            this.tone(this.pulse, fr, t + dt, d, 0.14, null, 0.01);
            this.tone('triangle', fr / 2, t + dt, d, 0.18);
          });
          break;
        }
      }
    },
    /** Klassischer "Wah-wah-wah-waaah"-Fehlklang. */
    fail(t) {
      const notes = [[392, 0, 0.22], [370, 0.27, 0.22], [349, 0.54, 0.22], [330, 0.81, 0.8]];
      for (const [f, dt, d] of notes) {
        const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 900;
        o.frequency.setValueAtTime(f, t + dt);
        if (d > 0.5) o.frequency.linearRampToValueAtTime(f * 0.85, t + dt + d);
        g.gain.setValueAtTime(0, t + dt);
        g.gain.linearRampToValueAtTime(0.13, t + dt + 0.03);
        g.gain.setTargetAtTime(0, t + dt + d, 0.05);
        o.connect(lp).connect(g).connect(this.sfxOut);
        o.start(t + dt); o.stop(t + dt + d + 0.3);
        o.onended = () => { o.disconnect(); lp.disconnect(); g.disconnect(); };
      }
    },
    /** Zuschauerjubel: gefilterte Rauschbänder, Klatschen und Pfiffe. */
    cheer(t, p) {
      const ctx = this.ctx, dur = 1.6 + 1.6 * p;
      [800, 1400, 2600].forEach((fr, i) => {
        const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        src.buffer = this.noiseBuf; src.loop = true;
        f.type = 'bandpass'; f.frequency.value = fr; f.Q.value = 1.2;
        const v = (0.12 + 0.12 * p) * (i === 1 ? 1 : 0.7);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + 0.25);
        g.gain.setValueAtTime(v, t + dur * 0.45);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.connect(f).connect(g).connect(this.sfxOut);
        src.start(t, Math.random()); src.stop(t + dur + 0.1);
        src.onended = () => { src.disconnect(); f.disconnect(); g.disconnect(); };
      });
      const claps = Math.floor(8 + 22 * p);
      for (let i = 0; i < claps; i++) this.noise(t + Math.random() * dur * 0.8, 0.04, 'highpass', 1500, 0.12 + Math.random() * 0.08);
      if (p > 0.5) {
        this.sweep('sine', 1700, 2500, t + 0.35, 0.35, 0.07);
        this.sweep('sine', 2400, 1600, t + 0.8, 0.4, 0.06);
      }
    },

    /* --- Dauerschleifen (Schnee-Rauschen, Wind) --- */
    startLoop(name) {
      if (!this.ctx || this.loops[name]) return;
      const ctx = this.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = this.noiseBuf; src.loop = true;
      if (name === 'wind') { f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.8; }
      else { f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 0.5; }   // weicheres Schneerauschen
      g.gain.value = 0;
      src.connect(f).connect(g).connect(this.sfxOut);
      src.start();
      this.loops[name] = { src, f, g };
    },
    setLoop(name, vol, freq) {
      const L = this.loops[name];
      if (!L) return;
      const t = this.ctx.currentTime;
      L.g.gain.setTargetAtTime(vol, t, 0.06);
      if (freq) L.f.frequency.setTargetAtTime(freq, t, 0.08);
    },
    stopLoop(name) {
      const L = this.loops[name];
      if (!L) return;
      delete this.loops[name];
      const t = this.ctx.currentTime;
      L.g.gain.setTargetAtTime(0, t, 0.05);
      L.src.stop(t + 0.35);
      L.src.onended = () => { L.src.disconnect(); L.f.disconnect(); L.g.disconnect(); };
    },
    stopLoops() { Object.keys(this.loops).forEach(n => this.stopLoop(n)); }
  };
  return S;
})();

/* ------------------------------------------------------------------ */
/* Input – Tastatur, Maus und Touch                                     */
/* ------------------------------------------------------------------ */
/* Die Szenen erhalten Ereignisse über Game.key / Game.click / Game.move.
   Für die Flugsteuerung sammelt Input vertikale Mausbewegung (Pixel). */
const Input = {
  canvas: null,
  keys: new Set(),
  mouse: { x: 427, y: 240 },
  dy: 0,                // aufsummierte vertikale Bewegung (Maus/Touch)
  dragTouch: null,      // Touch-ID für die Flugsteuerung
  isTouch: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches),
  BLOCK: ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace', 'Enter'],

  init(canvas) {
    this.canvas = canvas;
    window.addEventListener('keydown', e => {
      if (typeof TextField !== 'undefined' && TextField.active) return;   // Eingabefeld hat den Fokus
      Sound.init();
      if (this.BLOCK.includes(e.code)) e.preventDefault();
      const repeat = e.repeat || this.keys.has(e.code);
      this.keys.add(e.code);
      Game.key(e.code, e.key, repeat);
    });
    window.addEventListener('keyup', e => { this.keys.delete(e.code); });
    window.addEventListener('blur', () => { this.keys.clear(); });

    canvas.addEventListener('mousedown', e => {
      Sound.init();
      e.preventDefault();
      canvas.focus();
      const p = this.toCanvas(e.clientX, e.clientY);
      this.mouse.x = p.x; this.mouse.y = p.y;
      Game.click(p.x, p.y, e.button);
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('mousemove', e => {
      const p = this.toCanvas(e.clientX, e.clientY);
      this.mouse.x = p.x; this.mouse.y = p.y;
      this.dy += e.movementY || 0;
      Game.move(p.x, p.y);
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      Game.key(e.deltaY > 0 ? 'ArrowDown' : 'ArrowUp', '', true);
    }, { passive: false });

    // Touch: im Sprung zwei Zonen (links Absprung/Flug, rechts Landung), sonst wie Klicks
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      Sound.init();
      this.isTouch = true;
      for (const t of e.changedTouches) {
        const p = this.toCanvas(t.clientX, t.clientY);
        const zones = Game.scene && Game.scene.touchZones && Game.scene.touchZones(p.x, p.y);
        if (zones) {
          if (p.x < SCR.LCX) {
            Game.key('Space', ' ', false);
            this.dragTouch = { id: t.identifier, y: t.clientY };
          } else {
            Game.key('KeyS', 's', false);
          }
        } else {
          Game.click(p.x, p.y, 0);
        }
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (this.dragTouch && t.identifier === this.dragTouch.id) {
          this.dy += (t.clientY - this.dragTouch.y) * 1.4;
          this.dragTouch.y = t.clientY;
        }
      }
    }, { passive: false });
    const end = e => {
      e.preventDefault();
      for (const t of e.changedTouches)
        if (this.dragTouch && t.identifier === this.dragTouch.id) this.dragTouch = null;
    };
    canvas.addEventListener('touchend', end, { passive: false });
    canvas.addEventListener('touchcancel', end, { passive: false });
  },

  toCanvas(cx, cy) {
    const r = this.canvas.getBoundingClientRect();
    // logische Koordinaten; zentrierte Menüszenen erhalten Koordinaten relativ zur 640er-Fläche
    let x = (cx - r.left) * SCR.LW / r.width;
    const y = (cy - r.top) * SCR.LH / r.height;
    if (Game.scene && Game.scene.centered) x -= SCR.UIX;
    return { x, y };
  },
  takeDY() { const d = this.dy; this.dy = 0; return d; },
  down(code) { return this.keys.has(code); }
};

    { id: 'F03', name: 'Fichtenalm',     K: 90,  HS: 98,  gamma: 35, alpha: 10.5, table: 6.2, beta: 35.0, vKmh: 84,  wind: 'aufwind',     tod: 'tag',    weather: 'klar',   tint: '#a0ffb8', seed: 103 },
    { id: 'F04', name: 'Mondseeblick',   K: 95,  HS: 104, gamma: 33, alpha: 11.0, table: 6.3, beta: 34.5, vKmh: 86,  wind: 'wechselhaft', tod: 'nacht',  weather: 'leicht', tint: '#9aa8ff', seed: 104 },
    { id: 'F05', name: 'Lärchenkopf',    K: 105, HS: 115, gamma: 36, alpha: 10.0, table: 6.5, beta: 35.5, vKmh: 87,  wind: 'rueckenwind', tod: 'abend',  weather: 'klar',   tint: '#ffcf80', seed: 105 },
    { id: 'F06', name: 'Nordkette',      K: 120, HS: 131, gamma: 35, alpha: 11.0, table: 6.6, beta: 35.0, vKmh: 91,  wind: 'boeig',       tod: 'tag',    weather: 'klar',   tint: '#c0d8ff', seed: 106 },
    { id: 'F07', name: 'Wolfsklamm',     K: 125, HS: 137, gamma: 34, alpha: 10.5, table: 6.6, beta: 34.0, vKmh: 92,  wind: 'ruhig',       tod: 'nacht',  weather: 'stark',  tint: '#b0ffd8', seed: 107 },
    { id: 'F08', name: 'Edelweißhang',   K: 140, HS: 154, gamma: 36, alpha: 11.0, table: 6.8, beta: 36.0, vKmh: 94,  wind: 'aufwind',     tod: 'morgen', weather: 'klar',   tint: '#ffd8f0', seed: 108 },
    { id: 'F09', name: 'Gletscherblick', K: 160, HS: 176, gamma: 35, alpha: 11.5, table: 7.0, beta: 35.5, vKmh: 97,  wind: 'wechselhaft', tod: 'tag',    weather: 'nebel',  tint: '#d0f4ff', seed: 109 },
    { id: 'F10', name: 'Adlerhorst',     K: 185, HS: 205, gamma: 36, alpha: 11.0, table: 7.4, beta: 36.5, vKmh: 99,  wind: 'boeig',       tod: 'abend',  weather: 'klar',   tint: '#ff9a7a', seed: 110 },
    { id: 'F11', name: 'Donnerfels',     K: 215, HS: 235, gamma: 37, alpha: 11.0, table: 7.6, beta: 37.0, vKmh: 102, wind: 'sturm',       tod: 'nacht',  weather: 'klar',   tint: '#c79aff', seed: 111 },
    { id: 'F12', name: 'Riesenberg',     K: 250, HS: 275, gamma: 37, alpha: 11.5, table: 8.0, beta: 37.5, vKmh: 105, wind: 'aufwind',     tod: 'tag',    weather: 'leicht', tint: '#ffffff', seed: 112 }
  ],
  cache: {},

  get(id) {
    if (id && id.startsWith('R:')) return this.random(id.slice(2));
    if (this.cache[id]) return this.cache[id];
    const def = this.FIXED.find(d => d.id === id) || this.FIXED[2];
    return (this.cache[def.id] = this.build(def));
  },

  /** Normalisiert eine Seed-Eingabe (A–Z, 0–9, max. 10 Zeichen). */
  normSeed(s) {
    const n = String(s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
    return n || '1';
  },

  /** Erzeugt eine Zufallsschanze aus einem Seed (reproduzierbar). */
  random(seedIn) {
    const seed = this.normSeed(seedIn);
    const id = 'R:' + seed;
    if (this.cache[id]) return this.cache[id];
    const rng = U.rng(U.hash('ASJD' + seed));
    const K = U.ri(rng, 60, 250);
    const pre = ['Eis', 'Fels', 'Sonnen', 'Wolken', 'Adler', 'Falken', 'Gams', 'Schnee', 'Nebel', 'Sturm',
      'Silber', 'Kristall', 'Hirsch', 'Bären', 'Föhren', 'Tannen', 'Wind', 'Stern', 'Mond', 'Gold', 'Raben', 'Luchs'];
    const suf = ['grat', 'horn', 'kogel', 'spitze', 'alm', 'wand', 'eck', 'kamm', 'joch', 'leiten', 'berg',
      'blick', 'höhe', 'stein', 'kopf', 'riegel'];
    const big = K >= 170;
    const def = {
      id, seed, random: true,
      name: U.pick(rng, pre) + U.pick(rng, suf),
      K, HS: Math.round(K * U.rr(rng, 1.07, 1.115)),
      gamma: U.rr(rng, 31, 37), alpha: U.rr(rng, 9.5, 11.5),
      table: U.rr(rng, 5.6, 7.0) * (big ? 1.12 : 1),
      beta: big ? U.rr(rng, 35.5, 37.5) : U.rr(rng, 33, 36.5),
      thetaVar: U.rr(rng, -1.5, 1.5),
      vKmh: (big ? 79 + 0.105 * K : 63 + 0.2 * K) + U.rr(rng, -1.5, 1.5),
      wind: U.pick(rng, ['ruhig', 'ruhig', 'boeig', 'aufwind', 'aufwind', 'rueckenwind', 'wechselhaft', 'sturm']),
      tod: U.pick(rng, ['morgen', 'tag', 'tag', 'abend', 'nacht']),
      weather: U.pick(rng, ['klar', 'klar', 'klar', 'leicht', 'leicht', 'stark', 'nebel']),
      tint: U.hsl(U.rr(rng, 0, 360), 70, 75),
      seed2: U.ri(rng, 1, 1e9)
    };
    return (this.cache[id] = this.build(def));
  },

  /** Baut aus einer Definition die vollständige Schanze inkl. Kalibrierung. */
  build(def) {
    const h = Object.assign({}, def);
    h.title = h.name + ' K' + h.K;
    h.windDef = WIND_TYPES[h.wind] || WIND_TYPES.ruhig;
    h.weatherDef = WEATHER[h.weather] || WEATHER.klar;
    // v1.7: Profil skaliert mit der Schanzengröße. Große Schanzen fallen nach dem Tisch
    // steiler ab (wie echte Flugschanzen), damit das Nenntempo für die K-Weite reicht.
    const gk = U.clamp((h.K - 90) / 160, 0, 1);
    h.s = h.s || (0.022 * h.K + 0.9) * (1 + 0.6 * gk);   // Tischhöhe über dem Hangbeginn
    h.theta0 = h.theta0 !== undefined ? h.theta0 : 7 + 6 * gk + (h.thetaVar || 0);
    h.r1 = h.r1 || (0.4 * h.K + 50);                // Anlauf-Übergangsradius
    h.r2 = h.r2 || (0.75 * h.K + 45);               // Aufsprung-Übergangsradius
    h.lP = h.lP || (0.58 - 0.3 * gk) * h.K;          // Ende der Knoll-Krümmung
    h.turb = 0.7 + 0.5 * h.windDef.gust;            // Unruhe in der Luft
    h.windLift = PHYS.WIND_LIFT * Math.sqrt(90 / h.K); // Windwirkung auf den Auftrieb (je m/s)
    const dseed = typeof h.seed === 'number' ? h.seed : (h.seed2 || U.hash(String(h.seed)));
    h.decoSeed = dseed;
    // Komfort-Methoden (vor der Kalibrierung, da JumpSim sie nutzt)
    h.groundY = x => this.groundY(h, x);
    h.slopeAt = x => this.slopeAt(h, x);
    h.arcAt = x => this.arcAt(h, x);
    h.inrunAt = s => this.inrunAt(h, s);
    h.inrunYAt = x => this.inrunYAt(h, x);
    this._buildLanding(h);
    this._makePalette(h, U.rng(dseed * 7 + 3));

    // Anlauflänge so wählen, dass die Zielgeschwindigkeit erreicht wird,
    // danach den Auftrieb so kalibrieren, dass ein Idealsprung knapp über K landet.
    let vT = h.vKmh / 3.6;
    for (let attempt = 0; attempt < 10; attempt++) {
      this._fitInrun(h, vT);
      const r = this._fitAero(h);
      if (r === 'ok') break;
      vT *= (r === 'short' ? 1.04 : 0.96);
    }
    h.v0 = this._inrunSpeed(h);
    h.vReal = h.v0 * 3.6;            // v1.7: angezeigtes Tempo = physikalisches Tempo
    h.meter = Scoring.meterValue(h.K);
    h.kPts = Scoring.kPoints(h.K);
    h.kX = this.xAtArc(h, h.K);
    h.hsX = this.xAtArc(h, h.HS);
    this._fitCompensation(h);

    return h;
  },

  /* ---------- Aufsprunghang ---------- */
  _buildLanding(h) {
    const ds = 0.25, beta = U.rad(h.beta), th0 = U.rad(h.theta0);
    const trans = h.r2 * beta, flat1 = 70, cLen = 40, cAng = U.rad(9), flat2 = 90;
    const lT = h.HS, lF = lT + trans, lC = lF + flat1, lE = lC + cLen, total = lE + flat2;
    const P = [];
    let x = 0, y = -h.s, l = 0;
    while (l <= total) {
      let th;
      if (l < h.lP) th = th0 + (beta - th0) * U.smooth(l / h.lP);
      else if (l < lT) th = beta;
      else if (l < lF) th = beta - (l - lT) / h.r2;
      else if (l < lC) th = 0;
      else if (l < lE) th = -cAng * U.smooth((l - lC) / 12);
      else th = -cAng * (1 - U.smooth((l - lE) / 12));
      P.push([x, y, th, l]);
      x += Math.cos(th) * ds; y -= Math.sin(th) * ds; l += ds;
    }
    // Auf gleichmäßiges x-Raster umrechnen (schnelle Abfrage)
    const DX = PHYS.DX, xEnd = P[P.length - 1][0], n = Math.floor(xEnd / DX) + 1;
    const LY = new Float32Array(n), LA = new Float32Array(n), LS = new Float32Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const xi = i * DX;
      while (j < P.length - 2 && P[j + 1][0] < xi) j++;
      const a = P[j], b = P[j + 1];
      const t = U.clamp((xi - a[0]) / Math.max(1e-6, b[0] - a[0]), 0, 1);
      LY[i] = U.lerp(a[1], b[1], t); LA[i] = U.lerp(a[2], b[2], t); LS[i] = U.lerp(a[3], b[3], t);
    }
    h.LY = LY; h.LA = LA; h.LS = LS; h.landN = n; h.xEnd = (n - 1) * DX;
    h.flatX = this.xAtArc(h, lF);
    h.counterX = this.xAtArc(h, lC);
  },

  /* ---------- Anlauf ---------- */
  _buildInrun(h, straight) {
    const a = U.rad(h.alpha), g = U.rad(h.gamma), ds = 0.25;
    const trans = h.r1 * (g - a);
    const n = Math.ceil((h.table + trans + straight) / ds) + 1;
    const IX = new Float32Array(n), IY = new Float32Array(n), IA = new Float32Array(n);
    let x = 0, y = 0;
    for (let k = 0; k < n; k++) {     // rückwärts von der Kante nach oben
      const d = k * ds;
      const th = d < h.table ? a : (d < h.table + trans ? a + (d - h.table) / h.r1 : g);
      const i = n - 1 - k;
      IX[i] = x; IY[i] = y; IA[i] = th;
      x -= Math.cos(th) * ds; y += Math.sin(th) * ds;
    }
    h.IX = IX; h.IY = IY; h.IA = IA; h.inrunN = n;
    h.inrunLen = (n - 1) * ds;
    h.inrunStraight = straight;
    h.topX = IX[0]; h.topY = IY[0];
    // gleichmäßiges x-Raster für die Darstellung
    const DX = PHYS.DX, m = Math.floor(-h.topX / DX) + 1;
    const UY = new Float32Array(m);
    let j = 0;
    for (let i = 0; i < m; i++) {
      const xi = h.topX + i * DX;
      while (j < n - 2 && IX[j + 1] < xi) j++;
      const t = U.clamp((xi - IX[j]) / Math.max(1e-6, IX[j + 1] - IX[j]), 0, 1);
      UY[i] = U.lerp(IY[j], IY[j + 1], t);
    }
    h.IUY = UY; h.iuN = m;
    h.terrH = (h.topY + h.s) * 0.6;
    h.terrTan = h.terrH * 1.6 / -h.topX;
  },
  /** Startposition (m ab Turmspitze) einer Luke; Luke N = ganz oben. */
  gateS(h, g) { return (GATE.N - g) * GATE.SPACING; },
  _inrunSpeed(h, gate = GATE.STD, extraMu = 0) {
    const { G, KD_CROUCH, DT } = PHYS, MU = PHYS.MU + extraMu;
    let s = this.gateS(h, gate), v = 0, guard = 0;
    while (s < h.inrunLen && guard++ < 20000) {
      const th = this.inrunAt(h, s).a;
      v += (G * Math.sin(th) - MU * G * Math.cos(th) - KD_CROUCH * v * v) * DT;
      s += v * DT;
    }
    return v;
  },
  _fitInrun(h, vTarget) {
    let lo = 5, hi = 280;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      this._buildInrun(h, mid);
      if (this._inrunSpeed(h) < vTarget) lo = mid; else hi = mid;
    }
    this._buildInrun(h, (lo + hi) / 2);
  },
  /** Kompensationspunkte kalibrieren: Weitenänderung je Luke und je m/s Wind (Idealsprung). */
  _fitCompensation(h) {
    const sim = (gate, wind) => {
      const s = new JumpSim(h, { calm: true, difficulty: 1, seed: 7, gate });
      if (wind) { s.windBase = wind; }
      const pilot = AIPilot.ideal();
      let guard = 0;
      while (!s.result && guard++ < 9000) s.step(PHYS.DT, pilot.control(s, PHYS.DT));
      return s.result ? h.arcAt(s.x) : 0;           // ungerundet für saubere Steigung
    };
    const d0 = sim(GATE.STD, 0);
    h.mPerGate = Math.max(0.2, (sim(GATE.STD + 2, 0) - sim(GATE.STD - 2, 0)) / 4);
    h.mPerHead = Math.max(0.2, sim(GATE.STD, 1) - d0);     // Aufwind: mehr Weite
    h.mPerTail = Math.max(0.2, d0 - sim(GATE.STD, -1));    // Rückenwind: weniger Weite
    h.gatePts = Math.round(h.mPerGate * h.meter * 100) / 100;
    h.headPts = Math.round(h.mPerHead * h.meter * 100) / 100;
    h.tailPts = Math.round(h.mPerTail * h.meter * 100) / 100;
    h.gateKmh = [];
    for (let g = 1; g <= GATE.N; g++) h.gateKmh[g] = this._inrunSpeed(h, g, h.weatherDef.mu || 0) * 3.6;   // mit Wetter
  },
  /** Setzt die Luftkraft-Beiwerte aus Gleitverhältnis ld und Gleichgewichtsgeschwindigkeit. */
  _setAero(h, ld) {
    h.ld = ld;
    const c = PHYS.G / (h.vEq * h.vEq);
    const n = Math.sqrt(1 + ld * ld);
    h.cl0 = c * ld / n; h.cd0 = c / n;
  },
  _simIdeal(h, ld) {
    this._setAero(h, ld);
    const sim = new JumpSim(h, { calm: true, clean: true, difficulty: 1, seed: 7 });
    const pilot = AIPilot.ideal();
    let guard = 0;
    while (!sim.result && guard++ < 8000) sim.step(PHYS.DT, pilot.control(sim, PHYS.DT));
    this._lastVn = sim.result ? sim.result.vn : 5;
    return sim.result ? sim.result.dist : 0;
  },
  _fitAero(h) {
    const target = h.K * 1.06, b = U.rad(h.beta);
    h.vEq = this._inrunSpeed(h) + 4;
    // Gleitwinkel immer steiler als der Hang (+2°) → Sprünge enden zuverlässig
    let lo = 1 / Math.tan(b + U.rad(16)), hi = 1 / Math.tan(b + U.rad(PHYS.MARGIN));
    if (this._simIdeal(h, hi) < target) { this._setAero(h, hi); return 'short'; }
    if (this._simIdeal(h, lo) > target) { this._setAero(h, lo); return 'long'; }
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      if (this._simIdeal(h, mid) < target) lo = mid; else hi = mid;
    }
    h.refDist = this._simIdeal(h, (lo + hi) / 2);
    h.vnRef = this._lastVn;
    return 'ok';
  },

  /* ---------- Abfragen ---------- */
  _li(h, x) {
    const f = U.clamp(x / PHYS.DX, 0, h.landN - 1.001), i = Math.floor(f);
    return [i, f - i];
  },
  groundY(h, x) {
    if (x < 0) {
      // Gelände unter dem Anlaufturm: konkav, oben ca. 60 % der Turmhöhe
      let y;
      if (x >= h.topX) {
        const r = -x / -h.topX;
        y = -h.s + h.terrH * Math.pow(r, 1.6);
        y = Math.min(y, this.inrunYAt(h, x) - 2.5 - (-x) * 0.04);
      } else {
        y = -h.s + h.terrH + (h.topX - x) * h.terrTan;
      }
      return y;
    }
    const [i, t] = this._li(h, x);
    return h.LY[i] + (h.LY[i + 1] - h.LY[i]) * t;
  },
  slopeAt(h, x) {
    if (x < 0) return Math.atan((this.groundY(h, x - 0.5) - this.groundY(h, x + 0.5)));
    const [i, t] = this._li(h, x);
    return h.LA[i] + (h.LA[i + 1] - h.LA[i]) * t;
  },
  arcAt(h, x) {
    if (x <= 0) return 0;
    const [i, t] = this._li(h, x);
    return h.LS[i] + (h.LS[i + 1] - h.LS[i]) * t;
  },
  xAtArc(h, l) {
    let lo = 0, hi = h.landN - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (h.LS[m] < l) lo = m; else hi = m; }
    const t = U.clamp((l - h.LS[lo]) / Math.max(1e-6, h.LS[hi] - h.LS[lo]), 0, 1);
    return (lo + t) * PHYS.DX;
  },
  inrunAt(h, s) {
    const f = U.clamp(s / 0.25, 0, h.inrunN - 1.001), i = Math.floor(f), t = f - i;
    return {
      x: h.IX[i] + (h.IX[i + 1] - h.IX[i]) * t,
      y: h.IY[i] + (h.IY[i + 1] - h.IY[i]) * t,
      a: h.IA[i] + (h.IA[i + 1] - h.IA[i]) * t
    };
  },
  inrunYAt(h, x) {
    const f = U.clamp((x - h.topX) / PHYS.DX, 0, h.iuN - 1.001), i = Math.floor(f), t = f - i;
    return h.IUY[i] + (h.IUY[i + 1] - h.IUY[i]) * t;
  },

  /* ---------- Farbpalette ---------- */
  _makePalette(h, rng) {
    const b = PALETTES[h.tod] || PALETTES.tag;
    const tint = h.tint || '#ffffff';
    const p = JSON.parse(JSON.stringify(b));
    p.mtn = b.mtn.map(c => U.mix(c, tint, 0.16));
    p.mtnSnow = U.mix(b.mtnSnow, tint, 0.12);
    p.snow = U.mix(b.snow, tint, 0.04);
    p.sky = b.sky.map((c, i) => U.mix(c, tint, 0.05 + i * 0.02));
    p.crowd = [];
    for (let i = 0; i < 10; i++) p.crowd.push(U.hsl(U.rr(rng, 0, 360), U.rr(rng, 55, 90), U.rr(rng, 40, 62)));
    p.banner = [U.hsl(U.rr(rng, 0, 360), 75, 45), U.hsl(U.rr(rng, 0, 360), 70, 55)];
    if (b.light) p.crowd = p.crowd.map(c => U.shade(c, -0.25));
    h.pal = p;
  }
};

/* ------------------------------------------------------------------ */
/* JumpSim – Physik eines einzelnen Sprungs                            */
/* ------------------------------------------------------------------ */
/* Phasen: gate → inrun → flight (→ tumble) → ground | crashed
   Steuerung pro Schritt: { action, land, dAlpha }
   alpha = Körperneigung (Anstellwinkel) in Grad: groß = aufrecht/steil, klein = flach. */
class JumpSim {
  constructor(hill, o = {}) {
    this.h = hill;
    this.D = DIFF[o.difficulty !== undefined ? o.difficulty : 1];
    this.calm = !!o.calm;
    const rng = this.rng = U.rng(o.seed !== undefined ? o.seed : (Math.random() * 4294967296) >>> 0);
    const w = hill.windDef;
    this.windBase = this.calm ? 0 : (o.wind !== undefined ? o.wind : U.clamp(w.base + (rng() * 2 - 1) * w.vari, -3.5, 4));
    this.gust = this.calm ? 0 : w.gust;
    this.ph = [rng() * 6.28, rng() * 6.28, rng() * 6.28, rng() * 6.28];
    this.phase = 'gate'; this.t = 0; this.time = 0; this.ft = 0;
    this.autoStart = o.autoStart !== undefined ? o.autoStart : 10;
    this.gate = o.gate || GATE.STD;
    this.s = Hills.gateS(hill, this.gate); this.v = 0; this.crouched = false; this.crouchAt = 0;
    this.windSum = 0; this.windT = 0;
    this.wmu = o.clean ? 0 : (hill.weatherDef.mu || 0);      // Neuschnee bremst
    const p = hill.inrunAt(this.s);
    this.x = p.x; this.y = p.y; this.vx = 0; this.vy = 0;
    this.alpha = 35; this.inst = 0; this.instMax = 0;
    this.q = 0; this.pressE = null; this.lateDone = false; this.jumped = false; this.timing = '';
    this.landT = null; this.landAlpha = 0; this.landAo = 0;
    this.errSum = 0; this.errN = 0; this.maxH = 0;
    this.result = null; this.events = []; this.stopped = false; this.spin = 0;
  }
  ev(n) { this.events.push(n); }
  wind() {
    return this.windBase + this.gust * 0.6 *
      (0.6 * Math.sin(0.7 * this.time + this.ph[0]) + 0.4 * Math.sin(1.9 * this.time + this.ph[1]));
  }
  alphaOpt() { return 24 + 9 * Math.exp(-this.ft / 0.7); }
  timeToEdge() { return this.v > 0.5 ? (this.h.inrunLen - this.s) / this.v : 99; }
  height() { return this.y - this.h.groundY(this.x); }
  distanceNow() { return this.x > 0 ? this.h.arcAt(this.x) : 0; }
  speed() {
    return (this.phase === 'gate' || this.phase === 'inrun' || this.phase === 'ground' || this.phase === 'crashed')
      ? Math.abs(this.v) : Math.hypot(this.vx, this.vy);
  }
  inAir() { return this.phase === 'flight' || this.phase === 'tumble'; }

  /** Absprungqualität aus Zeitpunkt e (Sekunden vor der Kante; negativ = zu spät). */
  quality(e) {
    const w = this.D.win;
    if (e >= 0 && e <= 0.045 * w) return 1;
    if (e > 0) return Math.max(0.2, 1 - (e - 0.045 * w) / (0.45 * w));
    return Math.max(0.15, 0.92 - (-e) / (0.16 * w) * 0.7);
  }
  timingLabel(q, e) {
    if (q >= 0.999) return 'PERFEKT!';
    if (q >= 0.8) return e > 0 ? 'GUT (ETWAS FRÜH)' : 'GUT (ETWAS SPÄT)';
    if (q >= 0.55) return e > 0 ? 'FRÜH' : 'SPÄT';
    return e > 0 ? 'VIEL ZU FRÜH' : 'VIEL ZU SPÄT';
  }
  applyImpulse(q, e) {
    const a = U.rad(this.h.alpha);
    const imp = 1.5 + 1.5 * q;
    this.vx += Math.sin(a) * imp;
    this.vy += Math.cos(a) * imp;
    this.q = q; this.jumped = true;
    this.timing = this.timingLabel(q, e);
    const sign = this.rng() < 0.5 ? -1 : 1;
    this.alpha = 33 + (1 - q) * sign * 11;
    this.inst = (1 - q) * 0.3;
    this.ev('jump');
  }

  step(dt, c) {
    this.time += dt; this.t += dt;
    const h = this.h, G = PHYS.G;
    switch (this.phase) {
      case 'gate':
        if (c.gate && c.gate !== this.gate) {
          this.gate = U.clamp(c.gate, 1, GATE.N);
          this.s = Hills.gateS(h, this.gate);
          const q = h.inrunAt(this.s); this.x = q.x; this.y = q.y;
        }
        if (c.action || this.t >= this.autoStart) { this.phase = 'inrun'; this.t = 0; this.ev('start'); }
        break;

      case 'inrun': {
        if (c.action) {
          const tte = this.timeToEdge();
          if (!this.crouched && tte > 0.6) { this.crouched = true; this.crouchAt = this.time; this.ev('crouch'); }
          else if (this.pressE === null && tte <= 0.6) {
            if (!this.crouched) this.crouchAt = this.time;
            this.pressE = tte; this.crouched = true; this.ev('press');
          }
        }
        const st = h.inrunAt(this.s);
        const kd = this.crouched ? PHYS.KD_CROUCH : PHYS.KD_STAND;
        this.v += (G * Math.sin(st.a) - (PHYS.MU + this.wmu) * G * Math.cos(st.a) - kd * this.v * this.v) * dt;
        this.s += this.v * dt;
        if (this.s >= h.inrunLen) {
          // Kante erreicht → Flug beginnt
          const a = U.rad(h.alpha), over = this.s - h.inrunLen;
          this.x = Math.cos(a) * over; this.y = -Math.sin(a) * over;
          this.vx = Math.cos(a) * this.v; this.vy = -Math.sin(a) * this.v;
          this.phase = 'flight'; this.t = 0; this.ft = 0;
          this.ev('edge');
          if (this.pressE !== null) this.applyImpulse(this.quality(this.pressE), this.pressE);
        } else {
          const p = h.inrunAt(this.s);
          this.x = p.x; this.y = p.y;
        }
        break;
      }

      case 'flight':
      case 'tumble': {
        this.ft += dt;
        // verspäteter Absprung bzw. verpasst
        if (!this.jumped && !this.lateDone) {
          const lw = 0.16 * this.D.win;
          if (c.action && this.ft <= lw) this.applyImpulse(this.quality(-this.ft), -this.ft);
          else if (this.ft > lw) {
            this.lateDone = true; this.q = 0; this.timing = 'VERPASST!';
            this.inst = 0.35; this.alpha = 30; this.ev('missed');
          }
        }
        const ao = this.alphaOpt();
        // Körperneigung: Spielereingabe + Turbulenz + leichte Vorlage-Tendenz
        if (this.phase === 'flight') {
          if (!this.calm) {
            const turb = this.D.dist * h.turb * 7 *
              (0.6 * Math.sin(1.3 * this.ft + this.ph[2]) + 0.4 * Math.sin(3.1 * this.ft + this.ph[3]));
            this.alpha += (turb - 3) * dt;
          }
          this.alpha = U.clamp(this.alpha + c.dAlpha, 2, 70);
          if (c.land && this.landT === null && this.ft > 0.25) {
            this.landT = 0; this.landAlpha = this.alpha; this.landAo = ao; this.ev('landprep');
          }
        } else {
          this.spin += dt * 6;
        }
        if (this.landT !== null) this.landT += dt;

        // Aerodynamik mit Relativwind
        const w = this.wind();
        if (this.phase === 'flight') { this.windSum += w * dt; this.windT += dt; }
        // v1.7: Wind wirkt v. a. über den Auftrieb (Aufwind trägt, Rückenwind drückt),
        // nur ein kleiner Anteil über die Anströmgeschwindigkeit.
        const rvx = this.vx + w * PHYS.WIND, rvy = this.vy;
        const u = Math.max(0.1, Math.hypot(rvx, rvy)), dx = rvx / u, dy = rvy / u;
        const nx = -dy, ny = dx;
        let cl, cd;
        if (this.phase === 'tumble') { cl = 0; cd = h.cd0 * 0.8; }
        else {
          const dev = this.alpha - ao;
          // Auftrieb: maximal bei optimaler Neigung; Widerstand wächst mit steiler Haltung
          // Auftrieb maximal bei optimaler Neigung; zu steil = viel Widerstand, zu flach = instabil
          const wd = dev / this.D.width;
          cl = h.cl0 * Math.exp(-wd * wd);
          if (this.q >= 0.999 && this.ft < 2.5) cl *= 1.04;         // Bonus für perfekten Absprung
          cl *= 1 + h.windLift * U.clamp(w, -4, 4);
          cd = h.cd0 * (1 + (dev > 0 ? 0.0022 : 0.0011) * dev * dev * (18 / this.D.width));
          if (this.landT !== null) {
            const k = Math.min(1, this.landT / 0.3);
            cl *= 1 - 0.55 * k; cd *= 1 + 0.6 * k;
          }
          // Stabilität
          const D = this.D;
          if (this.landT === null) {
            let di = -0.35;
            if (dev < -8) di = (-dev - 8) * 0.045 * D.inst;
            if (this.alpha < 7) di += 0.8 * D.inst;
            if (dev > 18) di = Math.max(di, (dev - 18) * 0.012 * D.inst);
            this.inst = Math.max(0, this.inst + di * dt);
            this.instMax = Math.max(this.instMax, this.inst);
            if (this.ft > 0.3) { this.errSum += Math.abs(dev); this.errN++; }
            if (this.inst >= 1) { this.phase = 'tumble'; this.ev('tumble'); }
          }
        }
        const u2 = u * u;
        this.vx += (-cd * u2 * dx + cl * u2 * nx) * dt;
        this.vy += (-G - cd * u2 * dy + cl * u2 * ny) * dt;
        this.x += this.vx * dt; this.y += this.vy * dt;
        const hgt = this.height();
        this.maxH = Math.max(this.maxH, hgt);
        if (hgt <= 0 && this.x > 0) this.touchdown();
        break;
      }

      case 'ground':
      case 'crashed': {
        const th = h.slopeAt(this.x);
        let a = G * Math.sin(th) - (this.phase === 'crashed' ? 1.0 : PHYS.MU) * G * Math.cos(th)
          - PHYS.KD_STAND * this.v * this.v;
        if (this.x > h.flatX + 25 && this.phase === 'ground') a -= 3.5;  // Abschwingen
        this.v = Math.max(0, this.v + a * dt);
        this.x += this.v * Math.cos(th) * dt;
        this.y = h.groundY(this.x);
        if (this.phase === 'crashed') this.spin += this.v * dt * 0.8;
        if (this.v < 0.3 && !this.stopped) { this.stopped = true; this.v = 0; this.ev('stop'); }
        break;
      }
    }
  }

  /** Bodenkontakt: Weite messen und Landung bewerten. */
  touchdown() {
    const h = this.h, D = this.D;
    const th = h.slopeAt(this.x);
    const tx = Math.cos(th), ty = -Math.sin(th), nx = Math.sin(th), ny = Math.cos(th);
    const vt = this.vx * tx + this.vy * ty;
    const vn = -(this.vx * nx + this.vy * ny);
    const dist = Math.floor(h.arcAt(this.x) * 2) / 2;
    // Landedruck relativ zu einem sauberen Idealsprung dieser Schanze
    const risk = (vn - (h.vnRef || vn)) + Math.max(0, dist - h.HS) * 0.12 + this.inst * 1.5;
    let L;
    if (this.phase === 'tumble') L = 'crash';
    else if (this.landT === null) L = (D.noPress === 'wobble' && risk < D.crash - 1) ? 'wobble' : 'crash';
    else if (risk > D.crash) L = 'crash';
    else {
      L = this.landT < 0.12 ? 'two' : (this.landAlpha < this.landAo + D.tele ? 'wobble' : 'tele');
      if (risk > D.crash - 1.2) L = (L === 'tele') ? 'two' : 'wobble';
    }
    this.result = { dist, landing: L, vn, risk, windAvg: this.windT > 0 ? this.windSum / this.windT : this.windBase, gate: this.gate };
    this.y = h.groundY(this.x);
    this.v = Math.max(0, vt);
    this.phase = L === 'crash' ? 'crashed' : 'ground';
    this.t = 0;
    this.ev(L === 'crash' ? 'crash' : 'touchdown');
  }
}

/* ------------------------------------------------------------------ */
/* AIPilot – KI-Springer (und Referenzpilot für die Kalibrierung)       */
/* ------------------------------------------------------------------ */
class AIPilot {
  /** skill 0..1 (1 = fehlerfrei). Fehler wachsen mit (1 - skill) * k. */
  constructor(skill, rng, k = 1) {
    const s = (1 - skill) * k;
    this.skill = skill;
    this.startDelay = 0.4 + rng() * 1.2;
    this.crouchAt = 0.2 + rng() * 0.5;
    this.jumpE = 0.022 + U.gauss(rng) * s * 0.3;          // Absprung-Timing (s vor der Kante)
    this.bias = U.gauss(rng) * s * 13;                    // dauerhafte Haltungsabweichung (°)
    this.flutter = s * 9;                                 // Unruhe in der Haltung (°)
    this.gain = 4 + 6 * U.clamp(1 - s, 0, 1);
    this.landH = U.clamp(2.0 + rng() * 1.2 + U.gauss(rng) * s * 2, 0.8, 5);
    this.teleAdd = 6.5 + U.gauss(rng) * s * 6;
    this.wob = rng() * 6.28;
    this.prevH = 0;
    this.safe = 0;        // Sicherheitsabstand zur Hill Size (nur Gegner)
  }
  static ideal() { return new AIPilot(1, () => 0.5); }
  control(sim, dt) {
    const c = { action: false, land: false, dAlpha: 0 };
    if (sim.phase === 'gate') {
      if (sim.t >= this.startDelay) c.action = true;
    } else if (sim.phase === 'inrun') {
      if (!sim.crouched && sim.t >= this.crouchAt && sim.timeToEdge() > 0.6) c.action = true;
      else if (sim.crouched && sim.pressE === null && this.jumpE >= 0 && sim.timeToEdge() <= Math.max(this.jumpE, dt * 1.05)) c.action = true;
    } else if (sim.phase === 'flight') {
      if (!sim.jumped && !sim.lateDone && this.jumpE < 0 && sim.ft >= -this.jumpE) c.action = true;
      const hgt = sim.height();
      // erst nach dem höchsten Punkt über dem Hang an die Landung denken
      const sinking = sim.ft > 0.8 && hgt < this.prevH && hgt < sim.maxH * 0.85;
      this.prevH = hgt;
      let target = sim.alphaOpt() + this.bias + Math.sin(sim.ft * 2.1 + this.wob) * this.flutter;
      if (sinking && hgt < this.landH + 1.5) target = sim.alphaOpt() + this.teleAdd;
      const maxd = 50 * dt;
      c.dAlpha = U.clamp((target - sim.alpha) * this.gain * dt, -maxd, maxd);
      if (sim.landT === null && sinking && hgt < this.landH) c.land = true;
      // vorsichtige Gegner landen früher, bevor es über die Hill Size geht
      if (this.safe && sim.landT === null && sim.ft > 1 && sim.distanceNow() > sim.h.HS - this.safe) c.land = true;
    }
    return c;
  }
}

/* ------------------------------------------------------------------ */
/* Scoring – Punkte nach Skisprung-Prinzip                              */
/* ------------------------------------------------------------------ */
const Scoring = {
  meterValue(K) {
    if (K >= 170) return 1.2;
    if (K >= 100) return 1.8;
    if (K >= 80) return 2.0;
    if (K >= 70) return 2.2;
    if (K >= 60) return 2.4;
    return 2.8;
  },
  kPoints(K) { return K >= 170 ? 120 : 60; },
  LANDING: {
    tele: { label: 'TELEMARK', ded: 0 },
    two: { label: 'BEIDE FÜSSE', ded: 2.0 },
    wobble: { label: 'WACKLER', ded: 3.5 },
    crash: { label: 'STURZ', ded: 8.5 }
  },
  compute(h, sim) {
    const r = sim.result, rng = sim.rng;
    const distPts = Math.max(0, Math.round((h.kPts + (r.dist - h.K) * h.meter) * 10) / 10);
    const avgErr = sim.errN ? sim.errSum / sim.errN : 12;
    let ded = Math.max(0, avgErr - 3) * 0.16 + sim.instMax * 2.2 + (1 - sim.q) * 1.6;
    ded += this.LANDING[r.landing].ded;
    const judges = [];
    for (let i = 0; i < 5; i++) {
      let sc = 19.7 - ded + U.gauss(rng) * 0.45;
      if (r.landing === 'crash') sc = Math.min(sc, 9.5 + U.gauss(rng) * 0.5);
      judges.push(U.clamp(Math.round(sc * 2) / 2, 1, 20));
    }
    let iMin = 0, iMax = 0;
    judges.forEach((v, i) => { if (v < judges[iMin]) iMin = i; if (v > judges[iMax]) iMax = i; });
    if (iMin === iMax) iMax = (iMin + 1) % 5;
    const style = judges.reduce((a, v, i) => a + ((i === iMin || i === iMax) ? 0 : v), 0);
    const comp = this.compensation(h, r.gate, r.windAvg, sim.jury || r.gate);
    const total = Math.round((distPts + style + comp.gate + comp.wind) * 10) / 10;
    return {
      dist: r.dist, distPts, judges, drop: [iMin, iMax], style, total, landing: r.landing, timing: sim.timing, q: sim.q,
      gate: r.gate, gateComp: comp.gate, wind: r.windAvg, windComp: comp.wind
    };
  },
  /** Luken- und Windausgleich (FIS-Prinzip): Weitenvorteil wird in Punkten zurückgerechnet.
      Bezugsluke ist im Wettkampf die Jury-Luke, sonst die Standardluke. */
  compensation(h, gate, wind, ref) {
    const g = Math.round((ref - gate) * (h.gatePts || 0) * 10) / 10;
    const w = Math.round((wind >= 0 ? -wind * (h.headPts || 0) : -wind * (h.tailPts || 0)) * 10) / 10;
    return { gate: g, wind: w };
  }
};

/* ------------------------------------------------------------------ */
/* Renderer – alle Grafik wird prozedural erzeugt (v1.2: 1280x960)      */
/* ------------------------------------------------------------------ */
/* Die Spielwelt wird in voller Auflösung 1280x960 gezeichnet ("native").
   Menüs und HUD arbeiten in logischen Koordinaten 640x480 und werden
   exakt 2x skaliert, damit die Pixelschrift scharf bleibt.
   Kamera: { x, y, ppm }  – ppm = logische Pixel pro Meter (nativ = ppm * Z).
   Boden und Bauwerke werden spaltenweise mit achsenparallelen Rechtecken
   gezeichnet – dadurch bleiben alle Kanten pixelscharf. */
// v1.4: 16:9 – logische Fläche 854x480 (LW x LH), nativ 1708x960.
// Menüs sind für 640x480 gestaltet und werden mittig gesetzt (Versatz UIX).
const SCR = { Z: 2, W: 1708, H: 960, CX: 854, CY: 480, LW: 854, LH: 480, LCX: 427, UIX: 107, NW: 1708, NH: 960 };

/* ------------------------------------------------------------------ */
/* Quality – Grafikstufe. NIEDRIG zeichnet die Spielwelt in halber      */
/* Auflösung (854x480) und skaliert sie pixelgenau hoch; HUD bleibt     */
/* scharf. AUTO wählt auf Handys/schwachen Geräten NIEDRIG und schaltet */
/* herunter, wenn die Bildrate dauerhaft einbricht.                     */
/* ------------------------------------------------------------------ */
const Quality = {
  low: false, canvas: null, ctx: null, slowT: 0, ema: 16.7,
  init() {
    const mode = Settings.data.gfx || 'auto';
    let weak = false;
    try { weak = matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4; } catch (e) { weak = false; }
    this.low = mode === 'low' || (mode === 'auto' && weak);
  },
  apply() { const m = Settings.data.gfx || 'auto'; if (m === 'low') this.low = true; else if (m === 'high') this.low = false; },
  /** Bildzeit beobachten (nur AUTO): dauerhaft über 21 ms → NIEDRIG. */
  watch(frameMs, inJump) {
    if ((Settings.data.gfx || 'auto') !== 'auto' || this.low || !inJump) { this.slowT = 0; return; }
    this.ema += (Math.min(frameMs, 60) - this.ema) * 0.05;
    this.slowT = this.ema > 21 ? this.slowT + frameMs / 1000 : 0;
    if (this.slowT > 3) { this.low = true; this.slowT = 0; Game.toast('GRAFIK: NIEDRIG (AUTO)'); }
  },
  /** Weltzeichnung beginnen: liefert den Kontext, in den die Welt gezeichnet wird. */
  begin(ctx) {
    if (!this.low) return ctx;
    if (!this.canvas) {
      this.canvas = document.createElement('canvas'); this.canvas.width = SCR.NW / 2; this.canvas.height = SCR.NH / 2;
      this.ctx = this.canvas.getContext('2d'); this.ctx.imageSmoothingEnabled = false;
    }
    Object.assign(SCR, { Z: 1, W: SCR.NW / 2, H: SCR.NH / 2, CX: SCR.NW / 4, CY: SCR.NH / 4 });
    return this.ctx;
  },
  /** Weltzeichnung abschließen: Halbbild pixelgenau auf das Hauptbild. */
  end(ctx) {
    if (!this.low || SCR.Z !== 1) return;
    Object.assign(SCR, { Z: 2, W: SCR.NW, H: SCR.NH, CX: SCR.NW / 2, CY: SCR.NH / 2 });
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.canvas, 0, 0, SCR.NW, SCR.NH);
    ctx.restore();
  }
};

/* Posen des Springers: lokale Koordinaten (Meter), Ursprung = Bindung,
   x entlang der Ski nach vorne, y nach oben. */

  const fb = 14;                         // Körper-Ski-Winkel in der Flugphase
  const hipF = dir(fb, 0.95), shF = dir(fb - 3, 0.6, hipF[0], hipF[1]);
