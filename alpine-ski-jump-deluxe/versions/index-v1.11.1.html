    sit:    { knee: [0.36, 0.36], hip: [-0.06, 0.56], sh: [0.02, 1.1], head: [0.06, 1.32], hand: [0.33, 0.8], hand2: [0.3, 0.76], knee2: [0.36, 0.36], foot2: [0, 0], spread: 0 },
    stand:  { knee: [0.12, 0.5], hip: [0, 0.95], sh: [0.07, 1.5], head: [0.1, 1.72], hand: [0.2, 1.02], hand2: [0.15, 1.0], knee2: [0.12, 0.5], foot2: [0, 0], spread: 0 },
    crouch: { knee: [0.4, 0.42], hip: [-0.12, 0.58], sh: [0.45, 0.8], head: [0.67, 0.88], hand: [-0.28, 0.5], hand2: [-0.24, 0.54], knee2: [0.4, 0.42], foot2: [0, 0], spread: 0 },
    takeoff:{ knee: [0.28, 0.5], hip: [0.3, 0.98], sh: [0.78, 1.42], head: [0.94, 1.6], hand: [-0.15, 1.0], hand2: [-0.1, 1.05], knee2: [0.28, 0.5], foot2: [0, 0], spread: 0.05 },
    flight: { knee: dir(fb + 3, 0.48), hip: hipF, sh: shF, head: dir(fb - 5, 0.22, shF[0], shF[1]),
              hand: dir(fb + 188, 0.6, shF[0], shF[1]), hand2: dir(fb + 184, 0.62, shF[0], shF[1]), knee2: dir(fb + 3, 0.48), foot2: [0, 0], spread: 0.16 },
    tele:   { knee: [0.36, 0.42], hip: [0.0, 0.82], sh: [0.1, 1.38], head: [0.13, 1.6], hand: [0.68, 1.28], hand2: [-0.52, 1.22], knee2: [-0.4, 0.26], foot2: [-0.55, 0.02], spread: 0 },
    two:    { knee: [0.38, 0.38], hip: [-0.05, 0.62], sh: [0.32, 1.1], head: [0.44, 1.3], hand: [0.62, 0.82], hand2: [0.5, 0.86], knee2: [0.38, 0.38], foot2: [0, 0], spread: 0 },
    crash:  { knee: [0.4, 0.16], hip: [0.82, 0.2], sh: [1.4, 0.28], head: [1.62, 0.32], hand: [1.15, 0.65], hand2: [0.6, 0.55], knee2: [0.5, 0.3], foot2: [0.1, 0.1], spread: 0.7 },
    wave:   { knee: [0.12, 0.5], hip: [0, 0.95], sh: [0.07, 1.5], head: [0.1, 1.72], hand: [0.35, 2.05], hand2: [-0.2, 2.0], knee2: [0.12, 0.5], foot2: [0, 0], spread: 0 }
  };
})();

/** Deterministischer Hash einer Ganzzahl → [0,1) (für weltfeste Details). */
function hsh(i) {
  let x = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b);
  x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

const Renderer = {
  colY: new Float32Array(SCR.NW),  // Bodenhöhe (Bildschirm, nativ) je Spalte
  colX: new Float32Array(SCR.NW),  // Welt-x je Spalte

  /* Koordinaten: nativ (1280x960) */
  sx(x, cam) { return (x - cam.x) * cam.ppm * SCR.Z + SCR.CX; },
  sy(y, cam) { return SCR.CY - (y - cam.y) * cam.ppm * SCR.Z; },
  /* Koordinaten: logisch (640x480, für HUD/Kamera) */
  lsx(x, cam) { return (x - cam.x) * cam.ppm + SCR.LCX; },
  lsy(y, cam) { return 240 - (y - cam.y) * cam.ppm; },

  /** Führt fn in nativen Bildschirmkoordinaten aus (ohne die 2x-UI-Skalierung). */
  _n(ctx, fn) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    try { fn(); } finally { ctx.restore(); }
  },

  /** Pixelgenaue Linie (Bresenham) mit quadratischem Pinsel. Zusammenhängende
      Pixel einer Zeile bzw. Spalte werden zu einem Rechteck zusammengefasst. */
  line(ctx, x0, y0, x1, y1, size = 1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    const o = size >> 1, horiz = dx >= -dy;
    let err = dx + dy, guard = 0;
    let rx = x0, ry = y0, len = 0;          // aktueller Lauf
    const put = this._batch ? (a, b, c, d) => ctx.rect(a, b, c, d) : (a, b, c, d) => ctx.fillRect(a, b, c, d);
    const flush = () => {
      if (!len) return;
      if (horiz) put(Math.min(rx, rx + (len - 1) * sx) - o, ry - o, len + size - 1, size);
      else put(rx - o, Math.min(ry, ry + (len - 1) * sy) - o, size, len + size - 1);
    };
    while (guard++ < 4000) {
      if (len && (horiz ? y0 !== ry : x0 !== rx)) { flush(); rx = x0; ry = y0; len = 0; }
      if (!len) { rx = x0; ry = y0; }
      len++;
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    flush();
  },
  /** Stapelbetrieb: line()/rect sammeln Pfadteile und werden mit endBatch() in einem Rutsch gefüllt. */
  beginBatch(ctx) { this._batch = true; ctx.beginPath(); },
  endBatch(ctx) { ctx.fill(); this._batch = false; },
  disc(ctx, cx, cy, r) {
    for (let y = -r; y <= r; y++) {
      const w = Math.floor(Math.sqrt(r * r - y * y));
      ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    }
  },
  /** Füllt den Streifen zwischen A[sx]+a und B[sx]+b für Spalten x0..x1 als ein Polygon
      mit achsenparallelen Stufen (pixelscharf und deutlich schneller als viele Rechtecke). */
  band(ctx, x0, x1, A, a, B, b) {
    if (x1 <= x0) return;
    ctx.beginPath();
    ctx.moveTo(x0, A[x0] + a);
    for (let sx = x0; sx < x1; sx++) { const y = A[sx] + a; ctx.lineTo(sx, y); ctx.lineTo(sx + 1, y); }
    for (let sx = x1 - 1; sx >= x0; sx--) { const y = B[sx] + b; ctx.lineTo(sx + 1, y); ctx.lineTo(sx, y); }
    ctx.closePath(); ctx.fill();
  },
  /** Kleines Wiederholungsmuster (z. B. Dithering) als Füllstil. */
  pattern(ctx, key, w, hgt, color, test) {
    this._pat = this._pat || {};
    const k = key + color;
    if (!this._pat[k]) {
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      const g = c.getContext('2d'); g.fillStyle = color;
      for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) if (test(x, y)) g.fillRect(x, y, 1, 1);
      this._pat[k] = ctx.createPattern(c, 'repeat');
    }
    return this._pat[k];
  },
  /** Gefüllte Ellipse (pixelgenau). */
  ellipse(ctx, cx, cy, rx, ry) {
    for (let y = -ry; y <= ry; y++) {
      const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
      ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    }
  },
  /** Gerasterte Scheibe (nur jedes zweite Pixel) für Glow-Effekte. */
  ditherDisc(ctx, cx, cy, r) {
    for (let y = -r; y <= r; y++) {
      const w = Math.floor(Math.sqrt(r * r - y * y));
      for (let x = -w; x <= w; x++) if (((x + y) & 1) === 0) ctx.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1);
    }
  },

  /* ================================================================ */
  /* Vorberechnung pro Schanze                                         */
  /* ================================================================ */
  prepare(h) {
    if (h.gfx) return h.gfx;
    const rng = U.rng(h.decoSeed * 13 + 5);
    const g = h.gfx = {};
    g.sky = this._makeSky(h, rng);
    g.mtn = [0, 1, 2].map(i => this._makeMountains(h, rng, i));
    g.trees = this._makeTrees(h, rng);
    g.refY = h.groundY(h.kX);
    g.stars = [];
    if (h.pal.stars) for (let i = 0; i < 240; i++) g.stars.push({ x: rng() * SCR.NW, y: rng() * 620, p: rng() * 6.28, b: rng(), big: rng() < 0.08 });
    // Zuschauer
    g.crowd = [];
    const cx0 = h.flatX + 6, cx1 = h.flatX + 72;
    for (let r = 0; r < 6; r++) {
      for (let x = cx0 + rng() * 1.2; x < cx1; x += 0.55 + rng() * 0.75) {
        if (rng() < 0.1) continue;
        g.crowd.push({
          x, r, c: U.pick(rng, h.pal.crowd), c2: U.pick(rng, h.pal.crowd),
          skin: rng() < 0.85 ? '#f0c8a0' : '#8a5a3c', ph: rng() * 6.28,
          hat: rng() < 0.5 ? U.pick(rng, h.pal.crowd) : null, flag: rng() < 0.08 ? U.pick(rng, h.pal.crowd) : null
        });
      }
    }
    g.flags = [0.35, 0.7, 1.0, h.HS / h.K].map(f => Hills.xAtArc(h, h.K * f));
    g.judgeX = Hills.xAtArc(h, h.K * 0.5);
    g.lights = h.pal.light ? [0.15, 0.5, 0.85, 1.2].map(f => Hills.xAtArc(h, h.K * f)).concat([h.topX * 0.5]) : [];
    g.pillars = [];
    for (let x = h.topX + 4; x < -h.table - 4; x += 9 + rng() * 3) g.pillars.push(x);
    g.treeSalt = Math.floor(rng() * 100000);
    g.flagCol = [U.pick(rng, h.pal.crowd), '#ffffff'];
    // Leben am Hang: Trainer, Kameraleute, Helfer mit Rechen (Positionen als Bogenlänge)
    const jackets = ['#d03030', '#2050d0', '#20a050', '#ffd23c', '#f0f0f0', '#e07020'];
    g.people = [
      { d: h.K * 0.22, kind: 'coach', col: U.pick(rng, jackets), off: 0 }, { d: h.K * 0.24, kind: 'coach', col: U.pick(rng, jackets), off: 0.8 },
      { d: h.K * 0.26, kind: 'flag', col: '#d03030', off: 0.3 },
      { d: h.K * 0.55, kind: 'camera', col: '#30343c', off: 0.5 },
      { d: h.K * 0.82, kind: 'rake', col: '#e07020', off: 0.2 }, { d: h.K * 1.02, kind: 'rake', col: '#e07020', off: 0.6 },
      { d: h.HS + 6, kind: 'rake', col: '#e07020', off: 0.4 }
    ].map(p => Object.assign(p, { x: Hills.xAtArc(h, p.d), ph: rng() * 6.28 }));
    g.people.push({ x: h.flatX + 2, kind: 'camera', col: '#30343c', off: 0.3, ph: 0 }, { x: h.flatX - 6, kind: 'coach', col: '#2050d0', off: 0.5, ph: 1 });
    return g;
  },

  /* ---------- Himmel: Farbverlauf mit 4x4-Bayer-Dithering ---------- */
  _makeSky(h, rng) {
    const W = SCR.NW, H = SCR.NH;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const P = h.pal;
    const stops = [0, 300, 520, 690];
    const cols = P.sky.map(U.hex2rgb);
    const grad = y => {
      if (y >= stops[3]) return cols[3];
      let i = 0;
      while (i < 2 && y > stops[i + 1]) i++;
      const t = (y - stops[i]) / (stops[i + 1] - stops[i]);
      return [0, 1, 2].map(k => cols[i][k] + (cols[i + 1][k] - cols[i][k]) * t);
    };
    const LV = 26, levels = [];
    for (let i = 0; i < LV; i++) levels.push(grad(i / (LV - 1) * stops[3]));
    const img = g.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) {
      const f = Math.min(LV - 1, y / stops[3] * (LV - 1));
      for (let x = 0; x < W; x++) {
        const i = Math.min(LV - 1, Math.floor(f + BAYER[(y & 3) * 4 + (x & 3)] - 0.5 + 0.5));
        const col = levels[Math.max(0, i)], o = (y * W + x) * 4;
        d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);

    // Sonne bzw. Mond
    const bx = Math.round(P.bodyX * W), by = Math.round(P.bodyY * H);
    const skyAt = U.rgb2hex(...grad(by));
    if (P.body === 'sun') {
      const big = h.tod !== 'tag';
      const R = big ? 34 : 26;
      g.fillStyle = U.mix(skyAt, P.bodyCol, 0.25); this.ditherDisc(g, bx, by, R + 34);
      g.fillStyle = U.mix(skyAt, P.bodyCol, 0.18); this.disc(g, bx, by, R + 20);
      g.fillStyle = U.mix(skyAt, P.bodyCol, 0.38); this.disc(g, bx, by, R + 10);
      g.fillStyle = P.bodyCol; this.disc(g, bx, by, R);
      g.fillStyle = U.shade(P.bodyCol, 0.5); this.disc(g, bx - Math.round(R * 0.3), by - Math.round(R * 0.3), Math.round(R * 0.45));
    } else {
      g.fillStyle = U.mix(skyAt, P.bodyCol, 0.08); this.ditherDisc(g, bx, by, 52);
      g.fillStyle = U.mix(skyAt, P.bodyCol, 0.12); this.disc(g, bx, by, 34);
      g.fillStyle = P.bodyCol; this.disc(g, bx, by, 22);
      g.fillStyle = U.shade(P.bodyCol, -0.14);
      [[-8, -6, 6], [7, 4, 5], [-2, 10, 3], [9, -9, 3], [-11, 5, 2]].forEach(([x, y, r]) => this.disc(g, bx + x, by + y, r));
      g.fillStyle = U.shade(P.bodyCol, -0.3);
      this.disc(g, bx + 13, by + 2, 2);
    }

    // Wolken: Schattenseite, Körper, Lichtkante
    const n = P.stars ? 4 : 8;
    const main = P.stars ? U.mix(P.sky[1], P.sky[2], 0.6) : U.mix(P.sky[2], '#ffffff', 0.55);
    const shadow = P.stars ? U.shade(P.sky[1], -0.2) : U.mix(main, P.sky[1], 0.45);
    const light = P.stars ? U.mix(main, P.bodyCol, 0.25) : U.mix(main, P.body === 'sun' ? P.bodyCol : '#ffffff', 0.55);
    for (let i = 0; i < n; i++) {
      const cx = rng() * W, cy = 90 + rng() * 380, w = 90 + rng() * 170, s = 0.6 + rng() * 0.6;
      const puffs = [];
      for (let k = 0; k < 6; k++) {
        const t = k / 5;
        puffs.push([cx - w / 2 + t * w, cy - Math.sin(t * Math.PI) * 14 * s - rng() * 10, Math.round((10 + rng() * 16) * s * (0.7 + Math.sin(t * Math.PI) * 0.6))]);
      }
      g.fillStyle = shadow;
      puffs.forEach(([x, y, r]) => this.ellipse(g, x, y + 5, Math.round(r * 1.9), Math.round(r * 0.75)));
      g.fillStyle = main;
      puffs.forEach(([x, y, r]) => this.ellipse(g, x, y, Math.round(r * 1.8), Math.round(r * 0.7)));
      g.fillStyle = light;
      puffs.forEach(([x, y, r]) => this.ellipse(g, x - Math.round(r * 0.4), y - Math.round(r * 0.3), Math.round(r * 1.0), Math.max(1, Math.round(r * 0.3))));
      g.fillStyle = shadow;   // flache Unterseite
      g.fillRect(Math.round(cx - w / 2 - 10), Math.round(cy + 4 * s), Math.round(w + 20), Math.max(2, Math.round(4 * s)));
    }
    return c;
  },

  /* ---------- Berge: Fels, Schnee, Rinnen, Wald – per Pixel ---------- */
  _makeMountains(h, rng, layer) {
    const W = 1536, H = SCR.NH;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const P = h.pal;
    const base = [660, 740, 830][layer], minH = [80, 50, 24][layer], range = [330, 230, 110][layer];
    const amps = [], phs = [];
    for (let k = 1; k <= 8; k++) { amps.push((0.3 + rng()) / Math.pow(k, 1.05)); phs.push(rng() * 6.28); }
    const jag = [], jph = [];
    for (let k = 9; k <= 40; k++) { jag.push((0.15 + rng() * 0.85) / Math.pow(k, 1.25)); jph.push(rng() * 6.28); }
    const raw = new Float32Array(W);
    let mn = 1e9, mx = -1e9;
    for (let x = 0; x < W; x++) {
      let v = 0;
      for (let k = 0; k < 8; k++) v += amps[k] * Math.sin(2 * Math.PI * (k + 1) * x / W + phs[k]);
      if (layer < 2) for (let k = 0; k < jag.length; k++) v += jag[k] * 1.6 * Math.abs(Math.sin(Math.PI * (k + 9) * x / W + jph[k]));
      raw[x] = v; mn = Math.min(mn, v); mx = Math.max(mx, v);
    }
    const top = new Int16Array(W);
    // Clamp verhindert NaN durch Float32-Rundung (sonst einzelne Spalten bis zum oberen Rand)
    for (let x = 0; x < W; x++) top[x] = Math.round(base - minH - Math.pow(U.clamp((raw[x] - mn) / (mx - mn), 0, 1), 1.3) * range);

    const rgb = U.hex2rgb;
    const haze = rgb(P.sky[3]), hz = [0.42, 0.22, 0.08][layer];
    const mixH = col => col.map((v, i) => Math.round(v + (haze[i] - v) * hz));
    const rockBase = layer === 2 ? U.mix(P.mtn[2], P.forest, 0.6) : P.mtn[layer];
    const C = {
      rockL: mixH(rgb(U.shade(rockBase, 0.12))), rock: mixH(rgb(rockBase)), rockD: mixH(rgb(U.shade(rockBase, -0.18))),
      strata: mixH(rgb(U.shade(rockBase, -0.3))),
      snowL: mixH(rgb(P.mtnSnow)), snowD: mixH(rgb(U.shade(P.mtnSnow, -0.16))),
      forL: mixH(rgb(U.shade(P.forest, 0.12))), forD: mixH(rgb(U.shade(P.forest, -0.15))), for: mixH(rgb(P.forest)),
      treeSnow: mixH(rgb(U.mix(P.mtnSnow, P.forest, 0.25)))
    };
    const img = g.createImageData(W, H), d = img.data;
    const put = (o, col) => { d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; };
    const ph1 = rng() * 6.28, ph2 = rng() * 6.28, ph3 = rng() * 6.28;
    for (let x = 0; x < W; x++) {
      const t0 = top[x];
      const slope = top[(x + 3) % W] - top[(x + W - 3) % W];      // < 0: Hang zeigt nach links (Licht)
      const lit = slope < 0;
      const steep = Math.abs(slope) > 7;
      const snowLine = minH + range * 0.5 + Math.sin(x * 0.013 + ph1) * range * 0.08;
      const gully = Math.max(0, Math.sin(x * 0.07 + ph2) * Math.sin(x * 0.019 + ph3)) * range * 0.35;
      const treeLine = minH + range * 0.2 + Math.sin(x * 0.031 + ph2) * range * 0.05;
      for (let y = Math.max(0, t0); y < H; y++) {
        const o = (y * W + x) * 4, hgt = base - y, depth = y - t0;
        let col;
        if (layer === 2) {
          // nahe Waldhügel: Baumkronen-Struktur
          const cell = Math.floor(x / 9), lx = x % 9, crown = hsh(cell * 7 + layer) * 6;
          const tri = depth < 14 + crown ? Math.abs(lx - 4) <= (depth - crown) * 0.45 : true;
          if (!tri) continue;
          if (depth < crown + 2 && hsh(cell) < 0.6) col = C.treeSnow;
          else col = lx < 4 ? C.forL : ((y + lx) % 7 === 0 ? C.forD : C.for);
          if (depth > 40) col = (x + y) & 1 ? C.for : C.forD;
        } else if (hgt > snowLine - gully && !(steep && depth > 3 && hsh(x * 31 + y) > 0.25)) {
          col = lit ? C.snowL : C.snowD;
          if (depth > 2 && hsh(x * 13 + y * 7) < 0.02) col = C.rockD;
        } else if (layer === 1 && hgt < treeLine) {
          col = ((x * 3 + y) % 5 === 0) ? C.forD : (lit ? C.forL : C.for);
        } else {
          col = lit ? C.rockL : C.rock;
          const sl = (y + Math.floor(x * 0.3 + Math.sin(x * 0.05) * 6)) % 14;
          if (sl === 0 && hsh((x >> 4) * 131 + (y >> 4)) < 0.65) col = C.strata;
          else if (hsh(x * 7 + y * 131) < 0.04) col = C.rockD;
          else if (!lit && depth < 6) col = C.rockD;
        }
        if (depth < 2 && layer < 2) col = lit ? C.snowL : C.rockL;   // helle Gratkante
        put(o, col);
      }
    }
    g.putImageData(img, 0, 0);
    // untere Füllfarbe für Verschiebungen nach oben
    const fill = layer === 2 ? C.for : (layer === 1 ? C.for : C.rock);
    let minTop = H; for (let x = 0; x < W; x++) minTop = Math.min(minTop, top[x]);
    minTop = Math.max(0, minTop - 20);   // Baumspitzen/Grate liegen knapp darüber
    return { canvas: c, w: W, top: minTop, color: U.rgb2hex(...fill), f: [0.24, 0.5, 1.0][layer], v: [0.24, 0.5, 0.9][layer] };
  },

  /* ---------- Bäume: 4 Arten, 2 Detailstufen, mit Schnee ---------- */
  _makeTrees(h, rng) {
    const P = h.pal;
    const lit = U.shade(P.forest, 0.22), mid = P.forest, dark = U.shade(P.forest, -0.28);
    const trunk = U.mix('#4a3324', P.forest, 0.3), snow = P.snow, snowD = P.snowMid;
    const types = [
      { h: 14, w: 0.36, tiers: 7, kind: 'spruce' },
      { h: 17, w: 0.26, tiers: 9, kind: 'spruce' },
      { h: 11, w: 0.5, tiers: 5, kind: 'spruce' },
      { h: 13, w: 0.42, tiers: 0, kind: 'pine' }
    ];
    const lods = {};
    for (const pxm of [6, 14]) {
      lods[pxm] = types.map(T => {
        const Hp = Math.round(T.h * pxm), Wp = Math.round(T.h * T.w * pxm * 2) + 4;
        const c = document.createElement('canvas'); c.width = Wp; c.height = Hp;
        const g = c.getContext('2d');
        const cx = Wp / 2;
        if (T.kind === 'spruce') {
          const tw = Math.max(1, Math.round(0.35 * pxm)), th = Math.round(1.6 * pxm);
          g.fillStyle = trunk; g.fillRect(Math.round(cx - tw / 2), Hp - th, tw, th);
          const crownH = Hp - Math.round(1.0 * pxm);
          for (let y = 0; y < crownH; y++) {
            const rel = y / crownH;
            const tf = (rel * T.tiers) % 1;
            const half = Math.max(0.5, (rel * T.w * T.h * pxm) * (0.55 + 0.45 * tf));
            const l = Math.round(cx - half), r = Math.round(cx + half);
            g.fillStyle = lit; g.fillRect(l, y, Math.round(cx) - l, 1);
            g.fillStyle = dark; g.fillRect(Math.round(cx), y, r - Math.round(cx), 1);
            g.fillStyle = mid; g.fillRect(l, y, 1, 1); g.fillRect(r - 1, y, 1, 1);
            if (tf < 0.16 && y > 2) {          // Schnee auf den Ästen
              g.fillStyle = snow; g.fillRect(l + 1, y, Math.max(1, Math.round((r - l) * 0.55)), 1);
              g.fillStyle = snowD; g.fillRect(Math.round(cx), y, Math.max(1, Math.round((r - l) * 0.25)), 1);
            }
          }
          g.fillStyle = snow; g.fillRect(Math.round(cx) - 1, 0, 2, 2);
        } else {
          const tw = Math.max(1, Math.round(0.45 * pxm)), th = Math.round(T.h * 0.55 * pxm);
          g.fillStyle = trunk; g.fillRect(Math.round(cx - tw / 2), Hp - th, tw, th);
          g.fillStyle = U.shade(trunk, -0.3); g.fillRect(Math.round(cx), Hp - th, Math.max(1, tw >> 1), th);
          const crownH = Math.round(T.h * 0.5 * pxm);
          for (let i = 0; i < 4; i++) {
            const py = Math.round(crownH * (0.18 + i * 0.22)), rx = Math.round(T.h * pxm * (0.13 + i * 0.035) + rng() * pxm), ry = Math.max(2, Math.round(T.h * pxm * 0.055));
            const px = Math.round(cx + (rng() - 0.5) * pxm * 1.5);
            g.fillStyle = dark; this.ellipse(g, px + 1, py + 2, rx, ry);
            g.fillStyle = mid; this.ellipse(g, px, py, rx, ry);
            g.fillStyle = lit; this.ellipse(g, px - Math.round(rx * 0.3), py - Math.round(ry * 0.3), Math.round(rx * 0.55), Math.max(1, Math.round(ry * 0.5)));
            g.fillStyle = snow; g.fillRect(px - Math.round(rx * 0.7), py - ry, Math.round(rx * 1.1), Math.max(1, Math.round(pxm * 0.25)));
          }
        }
        return { c, w: Wp, h: Hp, pxm };
      });
    }
    return lods;
  },

  /* ================================================================ */
  /* Hintergrund                                                       */
  /* ================================================================ */
  drawBackground(ctx, h, cam, time) {
    this._n(ctx, () => {
      const g = this.prepare(h), q = SCR.Z / 2;     // q = 0,5 in der Grafikstufe NIEDRIG
      ctx.drawImage(g.sky, 0, 0, SCR.W, SCR.H);
      for (const s of g.stars) {
        const tw = 0.5 + 0.5 * Math.sin(time * 2 + s.p);
        ctx.fillStyle = tw * s.b > 0.45 ? '#ffffff' : '#7880b8';
        const x = Math.round(s.x * q), y = Math.round(s.y * q);
        ctx.fillRect(x, y, 1, 1);
        if (s.big && tw > 0.6) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
      }
      for (const m of g.mtn) {
        const offY = Math.round(U.clamp((cam.y - g.refY) * m.v, -160, 440));
        let offX = -((cam.x * m.f) % m.w); if (offX > 0) offX -= m.w;
        offX = Math.round(offX);
        const hgt = SCR.NH - m.top - Math.max(0, offY);
        if (hgt > 0) for (let x = offX; x < SCR.NW; x += m.w) ctx.drawImage(m.canvas, 0, m.top, m.w, hgt, Math.round(x * q), Math.round((offY + m.top) * q), Math.round(m.w * q), Math.round(hgt * q));
        if (offY < 0) { ctx.fillStyle = m.color; ctx.fillRect(0, Math.floor((SCR.NH + offY) * q), SCR.W, Math.ceil(-offY * q) + 1); }
      }
    });
  },

  /* ================================================================ */
  /* Schanze und Umgebung                                              */
  /* ================================================================ */
  drawWorld(ctx, h, cam, time, st = {}) {
    this._n(ctx, () => this._world(ctx, h, cam, time, st));
  },
  _world(ctx, h, cam, time, st) {
    const g = this.prepare(h), P = h.pal, ppm = cam.ppm * SCR.Z, W = SCR.W, H = SCR.H;
    const colY = this.colY, colX = this.colX;
    for (let sx = 0; sx < W; sx++) {
      const wx = cam.x + (sx + 0.5 - SCR.CX) / ppm;
      colX[sx] = wx;
      colY[sx] = Math.round(this.sy(h.groundY(wx), cam));
    }
    // 1) dichter Waldsaum hinter dem Hang
    const FT = this.forTop || (this.forTop = new Float32Array(W));
    for (let sx = 0; sx < W; sx++) {
      const wx = colX[sx];
      const band = 3.5 + 1.5 * Math.sin(wx * 0.05 + g.treeSalt) + 1 * Math.sin(wx * 0.17);
      const ti = Math.floor((wx + g.treeSalt) / 1.6), lo = (wx + g.treeSalt) / 1.6 - ti;
      const tip = (2 + hsh(ti) * 3) * (1 - Math.abs(2 * lo - 1));
      FT[sx] = Math.round(this.sy(h.groundY(wx) + band + tip, cam));
    }
    ctx.fillStyle = U.shade(P.forest, -0.12);
    this.band(ctx, 0, W, FT, 0, colY, 1);
    // 2) Baumreihen (hinten dunstig, vorne kräftig)
    this._drawTrees(ctx, h, cam, g, 0);
    this._drawTrees(ctx, h, cam, g, 1);

    // 3) Bauten hinter dem Hang
    this._drawLightMasts(ctx, h, cam, g, false);
    this._drawJudgeTower(ctx, h, cam, g);

    // 4) Schnee mit Schattierung, Präparierlinien und Glitzern
    ctx.fillStyle = P.snow;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let sx = 0; sx < W; sx++) { ctx.lineTo(sx, colY[sx]); ctx.lineTo(sx + 1, colY[sx]); }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // Oberflächenlicht, Dither-Schattierung und Präparierlinien als Polygon-Streifen
    ctx.fillStyle = '#ffffff'; this.band(ctx, 0, W, colY, 0, colY, 2);
    ctx.fillStyle = P.snowMid; this.band(ctx, 0, W, colY, 6, colY, 7);
    ctx.fillStyle = this.pattern(ctx, 'chk', 2, 2, P.snowMid, (x, y) => ((x + y) & 1) === 0);
    this.band(ctx, 0, W, colY, 16, colY, 22);
    ctx.fillStyle = this.pattern(ctx, 'd2', 2, 1, P.snowMid, x => x === 0);
    this.band(ctx, 0, W, colY, 34, colY, 35);
    ctx.fillStyle = this.pattern(ctx, 'd4', 4, 1, P.snowMid, x => x === 0);
    this.band(ctx, 0, W, colY, 64, colY, 65);
    ctx.fillStyle = this.pattern(ctx, 'd8', 8, 1, P.snowMid, x => x === 0);
    this.band(ctx, 0, W, colY, 110, colY, 111);
    ctx.fillStyle = P.snowDark;
    ctx.beginPath();
    for (let sx = 0; sx < W; sx++) {
      const q = Math.floor(colX[sx] * 3);
      const r = hsh(q + 77);
      if (r < 0.05) ctx.rect(sx, colY[sx] + 24 + Math.floor(hsh(q) * 120), 2, 1);
    }
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    for (let sx = 0; sx < W; sx += 2) {
      const q = Math.floor(colX[sx] * 4);
      if (hsh(q * 3 + 11) < 0.035) {
        const y = colY[sx] + 4 + Math.floor(hsh(q) * 60);
        if (Math.sin(time * 3 + q) > 0.2) { ctx.rect(sx, y, 1, 1); ctx.rect(sx - 1, y + 1, 3, 1); ctx.rect(sx, y + 2, 1, 1); }
        else ctx.rect(sx, y + 1, 1, 1);
      }
    }
    ctx.fill();

    // 5) Markierungen, Anlaufturm, Fahnen, Zuschauer, Licht
    this._drawMarkers(ctx, h, cam, st);
    this._drawPeople(ctx, h, cam, g, time);
    this._drawInrun(ctx, h, cam, g, time, st);
    this._drawFlags(ctx, h, cam, g, time, st.wind || 0);
    this._drawCrowd(ctx, h, cam, g, time, st.cheer || 0);
    this._drawLightMasts(ctx, h, cam, g, true);
  },

  _drawTrees(ctx, h, cam, g, row) {
    const ppm = cam.ppm * SCR.Z;
    const lod = ppm > 9 ? 14 : 6;
    const sprites = g.trees[lod];
    const step = row === 0 ? 3.4 : 4.6;
    const x0 = cam.x - (SCR.CX + 200) / ppm, x1 = cam.x + (SCR.CX + 200) / ppm;
    const i0 = Math.floor(x0 / step), i1 = Math.ceil(x1 / step);
    if (row === 0) ctx.globalAlpha = 0.82;
    for (let i = i0; i <= i1; i++) {
      const salt = i * 5 + row * 7919 + g.treeSalt;
      const x = i * step + hsh(salt) * step * 0.8;
      // auf der Anlaufspur bzw. im Landebereich vorne keine Bäume
      if (row === 1 && x > -h.table * 2 && x < h.hsX + 15) continue;
      const ti = hsh(salt + 1);
      const sp = sprites[ti < 0.12 ? 3 : Math.floor(ti * 3) % 3];
      const size = (0.7 + hsh(salt + 2) * 0.45) * (row === 0 ? 0.62 : 0.9);
      const off = row === 0 ? 3.5 + hsh(salt + 3) * 2.5 : 0.8 + hsh(salt + 3) * 1.4;
      const sc = ppm / sp.pxm * size;
      const w = Math.round(sp.w * sc), hh = Math.round(sp.h * sc);
      const bx = Math.round(this.sx(x, cam) - w / 2), by = Math.round(this.sy(h.groundY(x) + off, cam));
      if (bx > SCR.W || bx + w < 0 || by - hh > SCR.H) continue;
      ctx.drawImage(sp.c, bx, by - hh + Math.round(0.8 * ppm), w, hh);
    }
    ctx.globalAlpha = 1;
  },

  /** Kleine Pixel-Figuren am Hang (seitlich neben der Spur, leicht nach hinten versetzt). */
  _drawPeople(ctx, h, cam, g, time) {
    const ppm = cam.ppm * SCR.Z;
    if (ppm < 3) return;
    for (const p of g.people) {
      const sx = Math.round(this.sx(p.x, cam));
      if (sx < -60 || sx > SCR.W + 60) continue;
      const gy = Math.round(this.sy(h.groundY(p.x) + p.off, cam));
      const u = Math.max(1, ppm * 0.09);                          // ein Figuren-Pixel
      const R = (x, y, w, hh) => ctx.fillRect(Math.round(sx + x * u), Math.round(gy - y * u), Math.max(1, Math.round(w * u)), Math.max(1, Math.round(hh * u)));
      // Beine, Körper, Kopf mit Mütze
      ctx.fillStyle = '#20232c'; R(-2, 8, 2, 8); R(1, 8, 2, 8);
      ctx.fillStyle = p.col; R(-3, 16, 7, 9);
      ctx.fillStyle = U.shade(p.col, -0.3); R(1, 16, 3, 9);
      ctx.fillStyle = '#f0c8a0'; R(-1, 19, 4, 3);
      ctx.fillStyle = p.kind === 'rake' ? '#e07020' : '#20232c'; R(-2, 20, 6, 2);
      const t = time + p.ph;
      if (p.kind === 'rake') {                                       // Rechen hin und her
        const sw = Math.sin(t * 2.2) * 5;
        ctx.fillStyle = '#8a6a40'; this.line(ctx, sx + 3 * u, gy - 13 * u, sx + (8 + sw) * u, gy + 1 * u, Math.max(1, Math.round(u * 0.8)));
        ctx.fillStyle = '#c0c4cc'; R(5 + sw, 1, 6, 1.5);
      } else if (p.kind === 'camera') {                              // Kamera auf Stativ
        ctx.fillStyle = '#20232c';
        this.line(ctx, sx - 8 * u, gy, sx - 6 * u, gy - 12 * u, Math.max(1, Math.round(u * 0.7)));
        this.line(ctx, sx - 4 * u, gy, sx - 6 * u, gy - 12 * u, Math.max(1, Math.round(u * 0.7)));
        R(-11, 16, 8, 5); ctx.fillStyle = '#7fe6ff'; R(-12, 15, 2, 2);
        if (Math.floor(t * 2) % 2) { ctx.fillStyle = '#ff3030'; R(-5, 16, 1, 1); }
      } else if (p.kind === 'flag') {                                // Funktionär mit Fahne
        const wv = Math.sin(t * 6) * 1.5;
        ctx.fillStyle = '#c8ccd4'; R(4, 26, 1, 12);
        ctx.fillStyle = '#ffffff'; R(5, 26 + wv, 6, 2); ctx.fillStyle = '#d03030'; R(5, 24 + wv, 6, 2);
      } else {                                                       // Trainer mit erhobenem Arm
        const up = Math.sin(t * 1.3) > 0.4;
        ctx.fillStyle = p.col; R(4, up ? 22 : 15, 2, up ? 7 : 6);
      }
    }
  },

  _drawJudgeTower(ctx, h, cam, g) {
    const x = g.judgeX, gy = h.groundY(x), ppm = cam.ppm * SCR.Z, P = h.pal;
    const cx = Math.round(this.sx(x, cam));
    const w = Math.max(10, Math.round(10 * ppm)), ht = 19;
    if (cx + w < 0 || cx - w > SCR.W) return;
    const L = Math.round(cx - w / 2);
    const Y = m => Math.round(this.sy(gy + m, cam));
    const conc = U.mix(P.struct, '#8a8f9a', P.light ? 0.25 : 0.5);
    // Sockel und Geschosse
    ctx.fillStyle = conc; ctx.fillRect(L + Math.round(w * 0.1), Y(9), Math.round(w * 0.8), Y(-4) - Y(9));
    ctx.fillStyle = U.shade(conc, -0.2); ctx.fillRect(L + Math.round(w * 0.55), Y(9), Math.round(w * 0.35), Y(-4) - Y(9));
    ctx.fillStyle = P.struct; ctx.fillRect(L, Y(ht), w, Y(9) - Y(ht));
    // Fensterband der Kampfrichter
    const glass = P.light ? '#ffe39a' : U.mix(P.sky[2], '#ffffff', 0.45);
    const wy = Y(ht - 1.2), wh = Y(ht - 4.2) - wy;
    ctx.fillStyle = glass; ctx.fillRect(L + 2, wy, w - 4, wh);
    ctx.fillStyle = U.shade(glass, -0.15); ctx.fillRect(L + 2, wy + Math.round(wh * 0.6), w - 4, wh - Math.round(wh * 0.6));
    // Kampfrichter (5 Köpfe)
    if (ppm >= 8) {
      for (let i = 0; i < 5; i++) {
        const hx = L + Math.round(w * (0.14 + i * 0.18)), hy = wy + Math.round(wh * 0.35);
        const hs = Math.max(2, Math.round(ppm * 0.3));
        ctx.fillStyle = '#2a2a33'; ctx.fillRect(hx, hy + hs, hs + 2, wh - Math.round(wh * 0.35) - hs);
        ctx.fillStyle = '#e8c09a'; ctx.fillRect(hx + 1, hy, hs, hs);
      }
    }
    ctx.fillStyle = P.struct;
    for (let i = 1; i < 5; i++) ctx.fillRect(L + Math.round(w * i / 5), wy, Math.max(1, Math.round(ppm * 0.15)), wh);
    // weitere Geschosse mit Fenstern
    for (let f = 0; f < 2; f++) {
      const fy = Y(ht - 6.5 - f * 3.5), fh = Math.max(2, Math.round(1.4 * ppm));
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = P.light && (i + f) % 2 ? '#ffd27a' : U.shade(glass, -0.35);
        ctx.fillRect(L + Math.round(w * (0.12 + i * 0.3)), fy, Math.round(w * 0.18), fh);
      }
    }
    // Dach mit Schnee, Antenne
    ctx.fillStyle = U.shade(P.struct, 0.1); ctx.fillRect(L - Math.round(0.8 * ppm), Y(ht + 0.6), w + Math.round(1.6 * ppm), Math.max(2, Math.round(0.6 * ppm)));
    ctx.fillStyle = P.snow; ctx.fillRect(L - Math.round(0.8 * ppm), Y(ht + 0.9), w + Math.round(1.6 * ppm), Math.max(2, Math.round(0.35 * ppm)));
    ctx.fillStyle = P.struct; ctx.fillRect(L + Math.round(w * 0.8), Y(ht + 5), Math.max(1, Math.round(0.15 * ppm)), Y(ht + 0.6) - Y(ht + 5));
    ctx.fillStyle = '#ff3030'; ctx.fillRect(L + Math.round(w * 0.8) - 1, Y(ht + 5) - 1, 3, 3);
    // Außentreppe
    if (ppm >= 6) {
      ctx.fillStyle = U.shade(P.struct, 0.25);
      const sx0 = L + w;
      for (let s = 0; s < 9; s++) {
        const yy = Y(s * 1.0), xx = sx0 + Math.round(((s % 2) ? 1.2 : 0.2) * ppm);
        ctx.fillRect(xx, yy, Math.round(1.0 * ppm), Math.max(1, Math.round(0.15 * ppm)));
      }
      this.line(ctx, sx0, Y(0), sx0 + Math.round(1.4 * ppm), Y(9), 1);
    }
  },

  _drawLightMasts(ctx, h, cam, g, front) {
    if (!g.lights.length) return;
    const ppm = cam.ppm * SCR.Z;
    for (const x of g.lights) {
      const sx = Math.round(this.sx(x, cam));
      if (sx < -400 || sx > SCR.W + 400) continue;
      const gy = h.groundY(x), topY = Math.round(this.sy(gy + 30, cam)), baseY = Math.round(this.sy(gy, cam));
      if (!front) {
        const mw = Math.max(2, Math.round(0.5 * ppm));
        ctx.fillStyle = '#0c0f1c';
        ctx.fillRect(sx, topY, mw, baseY - topY);
        for (let yy = topY + 6; yy < baseY; yy += Math.max(6, Math.round(2 * ppm))) this.line(ctx, sx - 2, yy, sx + mw + 2, yy + Math.round(ppm), 1);
        ctx.fillStyle = '#1a2036'; ctx.fillRect(sx - Math.round(2 * ppm), topY - Math.round(1.6 * ppm), Math.round(4 * ppm) + mw, Math.round(1.6 * ppm));
        ctx.fillStyle = '#fff6c8';
        for (let i = 0; i < 4; i++) ctx.fillRect(sx - Math.round(1.8 * ppm) + Math.round(i * ppm * 1.1), topY - Math.round(1.3 * ppm), Math.max(2, Math.round(0.8 * ppm)), Math.max(2, Math.round(0.9 * ppm)));
      } else {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.06;
        ctx.fillStyle = '#ffeebb';
        ctx.beginPath();
        ctx.moveTo(sx, topY);
        ctx.lineTo(this.sx(x - 24, cam), this.sy(h.groundY(x - 24), cam));
        ctx.lineTo(this.sx(x + 24, cam), this.sy(h.groundY(x + 24), cam));
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 0.05;
        ctx.beginPath();
        ctx.moveTo(sx, topY);
        ctx.lineTo(this.sx(x - 10, cam), this.sy(h.groundY(x - 10), cam));
        ctx.lineTo(this.sx(x + 10, cam), this.sy(h.groundY(x + 10), cam));
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  },

  _drawMarkers(ctx, h, cam, st) {
    const ppm = cam.ppm * SCR.Z;
    const mark = (dist, color, label) => {
      const x = Hills.xAtArc(h, dist), sx = Math.round(this.sx(x, cam));
      if (sx < -40 || sx > SCR.W + 40) return;
      const y = Math.round(this.sy(h.groundY(x), cam));
      const len = Math.max(8, Math.round(1.2 * ppm));
      ctx.fillStyle = color;
      ctx.fillRect(sx - 2, y - len, 4, len + 6);
      ctx.fillStyle = U.shade(color, -0.35); ctx.fillRect(sx + 1, y - len, 1, len + 6);
      if (label && ppm >= 5) {
        const by = y - Math.max(14 * SCR.Z, Math.round(3.4 * ppm));
        ctx.fillStyle = '#30343c'; ctx.fillRect(sx, by + 8 * SCR.Z, SCR.Z, y - by - 8 * SCR.Z);
        ctx.fillStyle = color;
        ctx.fillRect(sx - 4 * SCR.Z, by - SCR.Z, Font.width(label, SCR.Z) + 3 * SCR.Z, 9 * SCR.Z);
        Font.draw(ctx, label, sx - 5 * SCR.Z / 2, by, '#ffffff', SCR.Z);
      }
    };
    if (ppm >= 4.4) {
      const d0 = Math.ceil(h.K * 0.45 / 10) * 10;
      for (let d = d0 - 5; d <= h.HS + 10; d += 5) {
        const x = Hills.xAtArc(h, d), sx = Math.round(this.sx(x, cam));
        if (sx < -40 || sx > SCR.W + 40) continue;
        const y = Math.round(this.sy(h.groundY(x), cam));
        ctx.fillStyle = '#20232c';
        const major = d % 10 === 0;
        ctx.fillRect(sx, y - (major ? 18 : 8), 2, major ? 18 : 8);
        if (major && ppm >= 7) {
          const Z = SCR.Z, t = String(d), w = Font.width(t, Z) + 2 * Z;
          ctx.fillStyle = '#20232c'; ctx.fillRect(sx - (w >> 1) - Z, y - 20 * Z, w + 2 * Z, 11 * Z);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - (w >> 1), y - 19 * Z, w, 9 * Z);
          Font.draw(ctx, t, sx - (w >> 1) + Z, y - 18 * Z, '#20232c', Z);
        }
      }
    }
    mark(h.K, '#e02828', 'K');
    mark(h.HS, '#ff9a1a', 'HS');
    if (st.toBeat) {
      // TV-typische grüne Laserlinie quer über den Aufsprunghang
      const x = Hills.xAtArc(h, st.toBeat), sx = Math.round(this.sx(x, cam));
      if (sx > -60 && sx < SCR.W + 60) {
        const y = Math.round(this.sy(h.groundY(x), cam)), lw = Math.max(3, Math.round(0.35 * ppm));
        ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = '#2bff6a';
        this.line(ctx, sx - Math.round(2.2 * ppm), y - Math.round(1.6 * ppm), sx + Math.round(2.2 * ppm), y + Math.round(1.6 * ppm), lw);
        ctx.restore();
        if (ppm >= 5) {
          const Z = SCR.Z, t = U.fmtDist(st.toBeat) + ' M', tw = Font.width(t, Z) + 4 * Z;
          ctx.fillStyle = '#1a8a3a'; ctx.fillRect(sx - (tw >> 1), y + Math.round(2 * ppm), tw, 10 * Z);
          Font.draw(ctx, t, sx - (tw >> 1) + 2 * Z, y + Math.round(2 * ppm) + 1.5 * Z, '#ffffff', Z);
        }
      }
    }
    const rec = Records.get(h.id);
    if (rec && st.showRecord !== false) mark(rec.d, '#2ec84a', 'R');
  },

  _drawInrun(ctx, h, cam, g, time, st = {}) {
    const ppm = cam.ppm * SCR.Z, P = h.pal, W = SCR.W;
    const x0 = Math.max(0, Math.floor(this.sx(h.topX, cam))), x1 = Math.min(W, Math.ceil(this.sx(0, cam)));
    const thick = Math.max(5, Math.round(1.1 * ppm));
    const steelF = P.struct, steelB = U.mix(P.struct, P.sky[2], 0.35), steelL = U.mix(P.struct, '#9aa6c0', 0.35);
    const conc = U.mix(P.struct, '#8f949e', P.light ? 0.25 : 0.55);
    const TY = x => Math.round(this.sy(h.inrunYAt(x), cam));

    // --- Fachwerk unter dem Anlauf (hinten heller, vorne dunkel) ---
    const pillars = g.pillars;
    const lw = ppm >= 12 ? 2 : 1;
    for (let pass = 0; pass < 2; pass++) {
      const off = pass === 0 ? Math.round(0.6 * ppm) : 0;     // hintere Ebene leicht versetzt
      ctx.fillStyle = pass === 0 ? steelB : steelF;
      this.beginBatch(ctx);
      for (let i = 0; i < pillars.length; i++) {
        const x = pillars[i], sx = Math.round(this.sx(x, cam)) + off;
        const ty = TY(x) + thick - off, by = Math.round(this.sy(h.groundY(x), cam));
        const pw = Math.max(2, Math.round(0.55 * ppm));
        if (sx > -60 && sx < W + 60 && by > ty) ctx.rect(sx - (pw >> 1), ty, pw, by - ty);
        if (i + 1 < pillars.length) {
          const xn = pillars[i + 1], sxn = Math.round(this.sx(xn, cam)) + off;
          if (Math.max(sx, sxn) < -40 || Math.min(sx, sxn) > W + 40) continue;
          const tyn = TY(xn) + thick - off, byn = Math.round(this.sy(h.groundY(xn), cam));
          // Ebenen alle ~7 m, Diagonalen kreuzweise
          const levels = Math.max(1, Math.round(Math.min(by - ty, byn - tyn) / (7 * ppm)));
          for (let l = 0; l <= levels; l++) {
            const f = l / levels, fa = (l + 1) / levels;
            const ya = U.lerp(ty, Math.min(by, ty + (by - ty)), f), yb = U.lerp(tyn, Math.min(byn, tyn + (byn - tyn)), f);
            this.line(ctx, sx, ya, sxn, yb, lw);
            if (l < levels && pass === 1) {
              const ya2 = U.lerp(ty, by, fa), yb2 = U.lerp(tyn, byn, fa);
              this.line(ctx, sx, ya, sxn, yb2, 1);
              this.line(ctx, sx, ya2, sxn, yb, 1);
            }
          }
        }
      }
      this.endBatch(ctx);
    }
    // Betonfundamente
    for (const x of pillars) {
      const sx = Math.round(this.sx(x, cam)), by = Math.round(this.sy(h.groundY(x), cam));
      if (sx < -60 || sx > W + 60) continue;
      const fw = Math.max(6, Math.round(1.8 * ppm)), fh = Math.max(4, Math.round(1.0 * ppm));
      ctx.fillStyle = conc; ctx.fillRect(sx - (fw >> 1), by - fh, fw, fh + 4);
      ctx.fillStyle = U.shade(conc, 0.2); ctx.fillRect(sx - (fw >> 1), by - fh, fw, 2);
      ctx.fillStyle = P.snow; ctx.fillRect(sx - (fw >> 1) - 1, by - fh - 2, fw + 2, 2);
    }

    if (x1 > x0) {
      const colX = this.colX;
      const IY = this.inY || (this.inY = new Int16Array(SCR.W));
      for (let sx = x0; sx < x1; sx++) IY[sx] = TY(colX[sx]);
      // --- massiver Schanzentisch aus Beton ---
      let tx0 = x0;
      while (tx0 < x1 && colX[tx0] < -h.table * 1.4) tx0++;
      const TB = this.inYb || (this.inYb = new Int16Array(SCR.W));
      for (let sx = x0; sx < x1; sx++) TB[sx] = Math.max(IY[sx] + thick, this.colY[sx]);
      ctx.fillStyle = conc; this.band(ctx, tx0, x1, IY, thick, TB, 0);
      ctx.fillStyle = U.shade(conc, -0.18);
      ctx.beginPath();
      for (let sx = tx0; sx < x1; sx++) {
        const wx = colX[sx];
        if (Math.floor(wx / 2) !== Math.floor((wx - 1 / ppm) / 2) || wx > -h.table * 0.5 && (sx & 1)) {
          const y = IY[sx] + thick; ctx.rect(sx, y, 1, Math.max(0, TB[sx] - y));
        }
      }
      ctx.fill();
      // --- Fahrbahn: Träger, Deck ---
      ctx.fillStyle = steelF; this.band(ctx, x0, x1, IY, 0, IY, thick);
      ctx.fillStyle = steelL;
      this.band(ctx, x0, x1, IY, thick - 2, IY, thick - 1);
      this.band(ctx, x0, x1, IY, Math.round(thick * 0.45), IY, Math.round(thick * 0.45) + 1);
      // Querträger-Nieten
      ctx.fillStyle = U.shade(steelL, 0.2);
      ctx.beginPath();
      for (let sx = x0; sx < x1; sx++) {
        const wx = colX[sx];
        if (Math.floor(wx / 1.5) !== Math.floor((wx - 1 / ppm) / 1.5)) ctx.rect(sx, IY[sx] + 2, 1, thick - 4);
      }
      ctx.fill();
      // Eisspur mit zwei Rillen
      const ice = U.mix('#dff1ff', P.snow, 0.3), groove = U.mix('#7fa8d8', P.struct, 0.2);
      ctx.fillStyle = ice; this.band(ctx, x0, x1, IY, -3, IY, 0);
      ctx.fillStyle = groove; this.band(ctx, x0, x1, IY, -2, IY, -1);
      // rot-weiße Markierung an der Kante
      const ex = Math.round(this.sx(0, cam));
      if (ex > -20 && ex < W + 20) {
        const ey = TY(-0.01);
        ctx.fillStyle = '#e02828'; ctx.fillRect(ex - Math.max(3, Math.round(0.6 * ppm)), ey - 3, Math.max(3, Math.round(0.6 * ppm)), thick + 3);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(ex - Math.max(3, Math.round(0.6 * ppm)), ey + Math.round(thick * 0.4), Math.max(3, Math.round(0.6 * ppm)), 2);
      }
      // --- Geländer ---
      const rh = Math.round(1.0 * ppm);
      if (ppm >= 6) {
        ctx.fillStyle = steelL;
        let rx1 = x0;
        while (rx1 < x1 && colX[rx1] <= -h.table) rx1++;
        this.band(ctx, x0, rx1, IY, -3 - rh, IY, -3 - rh + (ppm >= 12 ? 2 : 1));
        if (ppm >= 14) {
          ctx.fillStyle = this.pattern(ctx, 'd2', 2, 1, steelL, x => x === 0);
          this.band(ctx, x0, rx1, IY, -3 - Math.round(rh * 0.5), IY, -2 - Math.round(rh * 0.5));
          ctx.fillStyle = steelL;
        }
        for (let sx = x0; sx < rx1; sx++) {
          const wx = colX[sx];

        }

        for (let sx = x0; sx < x1; sx++) {
          const wx = colX[sx];

    // --- Anlaufluken: Querbalken mit Nummern, gewählte Luke gelb ---

        const q = h.inrunAt(Hills.gateS(h, gi));

        if (gx < -40 || gx > W + 40 || gy < -60 || gy > SCR.H + 60) continue;
        const sel = st.gate === gi, bw = Math.max(2, Math.round(0.18 * ppm)), bh = Math.round(1.3 * ppm);
        ctx.fillStyle = sel ? '#ffd23c' : (gi === GATE.STD ? '#e8e8f0' : U.mix(steelL, '#ffffff', 0.3));
        ctx.fillRect(gx - (bw >> 1), gy - bh - 3, bw, bh);
        if (sel || (ppm >= 12 && gi % 5 === 0)) {
          const Z = SCR.Z, t = String(gi), tw = Font.width(t, Z) + 2 * Z;
          ctx.fillStyle = sel ? '#ffd23c' : '#20232c'; ctx.fillRect(gx - (tw >> 1), gy - bh - 12 * Z, tw, 9 * Z);
          Font.draw(ctx, t, gx - (tw >> 1) + Z, gy - bh - 11 * Z, sel ? '#1a1a1a' : '#ffffff', Z);
        }
      }
    }
    // --- Starthaus ---
    this._drawStartHut(ctx, h, cam, g, time);
  },

  _drawStartHut(ctx, h, cam, g, time) {
    const ppm = cam.ppm * SCR.Z, P = h.pal;
    const cx = this.sx(h.topX - 2.5, cam), baseY = this.sy(h.topY - 0.3, cam);
    const w = Math.round(7.5 * ppm), ht = Math.round(5 * ppm);
    if (cx + w < -40 || cx - w > SCR.W + 40 || baseY - ht > SCR.H + ht) return;
    const L = Math.round(cx - w / 2), T = Math.round(baseY - ht - 2 * ppm);
    const wood = U.mix('#6a4a32', P.struct, 0.45), woodD = U.shade(wood, -0.25);
    // Plattform und Unterbau
    ctx.fillStyle = U.mix(P.struct, '#8f949e', P.light ? 0.2 : 0.45);
    ctx.fillRect(L - Math.round(ppm), Math.round(baseY - 2 * ppm), w + Math.round(2 * ppm), Math.round(1.2 * ppm));
    // Stützen bis zum Gelände (Stahl, mit Querstreben und Betonfüßen)
    const legs = [-0.45, -0.05, 0.4].map(f => {
      const lx = L + Math.round(w * (0.5 + f)), wx = (lx - SCR.CX) / ppm + cam.x;
      return { lx, ty: Math.round(baseY - 0.8 * ppm), by: Math.round(this.sy(h.groundY(wx), cam)) };
    });
    const lw2 = Math.max(2, Math.round(0.5 * ppm));
    ctx.fillStyle = P.struct;
    legs.forEach(l => { if (l.by > l.ty) ctx.fillRect(l.lx, l.ty, lw2, l.by - l.ty); });
    for (let i = 0; i + 1 < legs.length; i++) {
      const a = legs[i], b = legs[i + 1];
      const span = Math.min(a.by, b.by) - a.ty;
      const lv = Math.max(1, Math.round(span / (5 * ppm)));
      for (let l = 0; l < lv; l++) {
        const y0 = a.ty + span * l / lv, y1 = a.ty + span * (l + 1) / lv;
        this.line(ctx, a.lx, y0, b.lx + lw2, y1, 1);
        this.line(ctx, a.lx, y1, b.lx + lw2, y0, 1);
      }
    }
    const conc = U.mix(P.struct, '#8f949e', P.light ? 0.25 : 0.55);
    legs.forEach(l => {
      const fw = Math.max(6, Math.round(1.4 * ppm)), fh = Math.max(4, Math.round(0.8 * ppm));
      ctx.fillStyle = conc; ctx.fillRect(l.lx + (lw2 >> 1) - (fw >> 1), l.by - fh, fw, fh + 4);
      ctx.fillStyle = P.snow; ctx.fillRect(l.lx + (lw2 >> 1) - (fw >> 1) - 1, l.by - fh - 2, fw + 2, 2);
    });
    // Wand mit Bretterfugen
    ctx.fillStyle = wood; ctx.fillRect(L, T, w, ht);
    ctx.fillStyle = woodD;
    for (let y = T + Math.round(ppm * 0.5); y < T + ht; y += Math.max(3, Math.round(ppm * 0.5))) ctx.fillRect(L, y, w, 1);
    ctx.fillRect(L + w - Math.max(2, Math.round(ppm * 0.6)), T, Math.max(2, Math.round(ppm * 0.6)), ht);
    // Fenster mit Rahmen und Licht
    const fw = Math.round(1.6 * ppm), fh = Math.round(1.4 * ppm);
    for (let i = 0; i < 2; i++) {
      const fx = L + Math.round(w * (0.18 + i * 0.4)), fy = T + Math.round(ht * 0.25);
      ctx.fillStyle = woodD; ctx.fillRect(fx - 2, fy - 2, fw + 4, fh + 4);
      ctx.fillStyle = P.light || h.tod === 'abend' ? '#ffd27a' : U.mix(P.sky[2], '#ffffff', 0.3);
      ctx.fillRect(fx, fy, fw, fh);
      ctx.fillStyle = woodD; ctx.fillRect(fx + (fw >> 1), fy, 1, fh); ctx.fillRect(fx, fy + (fh >> 1), fw, 1);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(fx + 1, fy + 1, 2, 1);
    }
    // Tür
    ctx.fillStyle = woodD; ctx.fillRect(L + Math.round(w * 0.42), T + Math.round(ht * 0.45), Math.round(1.1 * ppm), Math.round(ht * 0.55));
    // Dach: zwei Seiten, Schnee obenauf, Kamin
    const rh = Math.round(2.4 * ppm), ov = Math.round(0.9 * ppm);
    const roof = U.mix(P.struct, '#b02020', 0.6), roofD = U.shade(roof, -0.3);
    for (let y = 0; y < rh; y++) {
      const half = Math.round((w / 2 + ov) * (y / rh));
      ctx.fillStyle = roof; ctx.fillRect(Math.round(cx - half), T - rh + y, half, 1);
      ctx.fillStyle = roofD; ctx.fillRect(Math.round(cx), T - rh + y, half, 1);
    }
    ctx.fillStyle = P.snow;
    for (let y = 0; y < Math.round(rh * 0.45); y++) {
      const half = Math.round((w / 2 + ov) * (y / rh));
      ctx.fillRect(Math.round(cx - half), T - rh + y - 1, half * 2, 1);
    }
    ctx.fillStyle = woodD; ctx.fillRect(Math.round(cx + w * 0.22), T - Math.round(rh * 0.9), Math.round(0.7 * ppm), Math.round(rh * 0.6));
    // Fahne am Mast
    const px = L - Math.round(0.6 * ppm), pt = T - Math.round(5 * ppm);
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(px, pt, Math.max(1, Math.round(0.15 * ppm)), Math.round(baseY - pt));
    const fl = Math.round(2.2 * ppm), fhh = Math.round(1.3 * ppm);
    for (let i = 0; i < fl; i++) {
      const wv = Math.round(Math.sin(time * 6 - i * 0.25) * ppm * 0.18 * (i / fl));
      ctx.fillStyle = g.flagCol[0]; ctx.fillRect(px + 1 + i, pt + wv, 1, Math.round(fhh / 2));
      ctx.fillStyle = g.flagCol[1]; ctx.fillRect(px + 1 + i, pt + wv + Math.round(fhh / 2), 1, Math.round(fhh / 2));
    }
  },

  _drawFlags(ctx, h, cam, g, time, wind) {
    const ppm = cam.ppm * SCR.Z, dir = wind >= 0 ? -1 : 1, mag = Math.abs(wind);
    const len = Math.max(6, Math.round((0.9 + 0.55 * mag) * ppm)), fh = Math.max(4, Math.round(0.8 * ppm));
    const col = wind >= 0.2 ? '#2ec84a' : (wind <= -0.2 ? '#e83030' : '#f0f0f0');
    const colD = U.shade(col, -0.3);
    for (const x of g.flags) {
      const sx = Math.round(this.sx(x, cam));
      if (sx < -80 || sx > SCR.W + 80) continue;
      const gy = this.sy(h.groundY(x), cam), top = Math.round(gy - 5.5 * ppm);
      ctx.fillStyle = '#30343c';
      ctx.fillRect(sx, top, 2, Math.round(gy - top));
      ctx.fillStyle = '#d0d4dc'; ctx.fillRect(sx, top - 2, 2, 2);
      for (let i = 0; i < len; i++) {
        const droop = mag < 0.3 ? i * 0.6 : 0;
        const wave = Math.sin(time * (5 + mag * 3) - i * 0.35) * Math.min(4, 0.8 + mag) * (i / len);
        ctx.fillStyle = wave > 0 ? colD : col;
        ctx.fillRect(sx + dir * (i + 2), top + Math.round(wave + droop), 1, fh);
      }
    }
  },

  _drawCrowd(ctx, h, cam, g, time, cheer) {
    const ppm = cam.ppm * SCR.Z;
    const p = ppm >= 14 ? 3 : (ppm >= 8 ? 2 : 1);
    const x0 = h.flatX - 4, x1 = h.flatX + 78;
    if (this.sx(x1, cam) < -20 || this.sx(x0, cam) > SCR.W + 20) return;
    // Tribüne
    const stand = U.mix(h.pal.struct, h.pal.snow, 0.35);
    for (let r = 0; r < 6; r++) {
      const a = Math.max(0, Math.round(this.sx(x0 + 4, cam))), b = Math.min(SCR.W, Math.round(this.sx(x1, cam)));
      if (b <= a) break;
      ctx.fillStyle = r % 2 ? stand : U.shade(stand, -0.1);
      const off = Math.round((1.0 + r * 0.85) * ppm);
      this.band(ctx, a, b, this.colY, -off, this.colY, -off + Math.max(1, Math.round(0.3 * ppm)));
    }
    // je Farbe ein Pfad (statt tausender Einzelaufrufe)
    const paths = new Map();
    const P = (col, x, y, w, hh) => { let pa = paths.get(col); if (!pa) { pa = new Path2D(); paths.set(col, pa); } pa.rect(x, y, w, hh); };
    for (const c of g.crowd) {
      const sx = Math.round(this.sx(c.x, cam));
      if (sx < -8 || sx > SCR.W + 8) continue;
      const jump = cheer > 0 ? Math.round(Math.abs(Math.sin(time * 9 + c.ph)) * cheer * 3 * p) : 0;
      const by = Math.round(this.sy(h.groundY(c.x) + 1.1 + c.r * 0.85, cam)) - jump;
      P(c.c, sx, by - 3 * p, 2 * p, 3 * p);
      P(c.c2, sx, by - 3 * p, 2 * p, p);              // Schal
      P(c.skin, sx, by - 5 * p, 2 * p, 2 * p);
      if (c.hat) P(c.hat, sx, by - 6 * p, 2 * p, p + (p > 1 ? 1 : 0));
      if (c.flag) {
        P('#c8b090', sx + 2 * p, by - 9 * p, 1, 6 * p);
        const wv = Math.round(Math.sin(time * 7 + c.ph) * p);
        P(c.flag, sx + 2 * p + 1, by - 9 * p + wv, 4 * p, 2 * p);
      } else if (cheer > 0.5 && ((c.ph * 10) | 0) % 3 === 0) {
        P(c.skin, sx + 2 * p, by - 6 * p, p, p); P(c.skin, sx - p, by - 6 * p, p, p);
      }
    }
    // Reihenfolge: Körper, Schals, Haut, Mützen – Mützen/Fahnen zuletzt
    for (const [col, pa] of paths) { ctx.fillStyle = col; ctx.fill(pa); }
    // Werbebande
    const bh = Math.max(4, Math.round(1.0 * ppm));
    for (let x = x0, i = 0; x < x1; x += 8, i++) {
      const a = Math.round(this.sx(x, cam)), b = Math.round(this.sx(Math.min(x1, x + 8), cam));
      if (b < 0 || a > SCR.W) continue;
      ctx.fillStyle = h.pal.banner[i & 1];
      this.band(ctx, Math.max(0, a), Math.min(SCR.W, b), this.colY, -bh, this.colY, 0);
      if (ppm >= 8) {   // angedeuteter Schriftzug
        ctx.fillStyle = '#ffffff';
        for (let sx = Math.max(0, a + 4); sx < Math.min(SCR.W, b - 4); sx += 3) if (hsh(i * 97 + sx - a) < 0.6) ctx.fillRect(sx, this.colY[sx] - Math.round(bh * 0.65), 2, Math.max(2, Math.round(bh * 0.3)));
      }
      ctx.fillStyle = U.shade(h.pal.banner[i & 1], -0.4);
      for (let sx = Math.max(0, a); sx < Math.min(SCR.W, b); sx++) ctx.fillRect(sx, this.colY[sx] - bh, 1, 1);
    }
  },

  /* ================================================================ */
  /* Springer                                                          */
  /* ================================================================ */
  /** j: { x, y, rot, pose, pose2, blend, wob, scale } ; col: { suit, suit2, helmet, ski } */
  drawJumper(ctx, cam, j, col, time = 0) {
    this._n(ctx, () => this._jumper(ctx, cam, j, col, time));
  },
  _jumper(ctx, cam, j, col, time) {
    const A = POSES[j.pose] || POSES.stand, B = POSES[j.pose2 || j.pose] || A, t = j.blend === undefined ? 1 : j.blend;
    const L = k => [A[k][0] + (B[k][0] - A[k][0]) * t, A[k][1] + (B[k][1] - A[k][1]) * t];
    const spread = A.spread + (B.spread - A.spread) * t;
    const s = j.scale || Math.max(1.6, 10 / cam.ppm);
    const rot = j.rot + (j.wob ? Math.sin(time * 26) * 0.09 * j.wob : 0);
    const c = Math.cos(rot), sn = Math.sin(rot), ppm = cam.ppm * SCR.Z;
    const P = a => [
      (j.x + (c * a[0] - sn * a[1]) * s - cam.x) * ppm + SCR.CX,
      SCR.CY - (j.y + (sn * a[0] + c * a[1]) * s - cam.y) * ppm
    ];
    const k = ppm * s;                                   // native Pixel pro lokalem Meter
    const wl = Math.max(2, Math.round(k * 0.13));        // Beine
    const wt = Math.max(3, Math.round(k * 0.2));         // Rumpf
    const wa = Math.max(1, Math.round(k * 0.08));        // Arme
    const ws = Math.max(2, Math.round(k * 0.065));       // Ski
    const line = (p, q, size) => this.line(ctx, p[0], p[1], q[0], q[1], size);
    const shadeLimb = (p, q, w, base, hl) => {
      ctx.fillStyle = base; line(p, q, w);
      if (hl && w >= 3) { ctx.fillStyle = hl; line([p[0] - 1, p[1] - 1], [q[0] - 1, q[1] - 1], w - 2); }
    };
    // Tiefenversatz der abgewandten Seite (leichter 3D-Effekt)
    const dz = Math.max(1, k * 0.11);
    const depth = (p, f) => [p[0] + dz * 0.7 * f, p[1] - dz * f];
    const foot = [0, 0], knee = L('knee'), hip = L('hip'), sh = L('sh'), head = L('head');
    const hand = L('hand'), hand2 = L('hand2'), knee2 = L('knee2'), foot2 = L('foot2');
    const suit = col.suit, suitD = U.shade(col.suit, -0.32), suitL = U.shade(col.suit, 0.28);
    const far = col.suit2, farL = U.shade(col.suit2, 0.15);
    const boot = '#1c1d24', glove = U.shade(col.suit2, -0.3);

    // Ski: Lauffläche, Oberkante, Schaufel, Dekor, Bindung
    const vOpen = spread * 22;
    const drawSki = (ox, isFar) => {
      const pts = [[ox - 1.05, -0.04], [ox + 1.6, -0.04], [ox + 1.74, 0.1]].map(p => {
        const sp = P(p), open = vOpen * Math.max(0, p[0] - ox + 0.3) / 2;
        return isFar ? depth(sp, 1 + open) : depth(sp, -0.45 * open);
      });
      const base = isFar ? U.shade(col.ski, -0.45) : col.ski;
      ctx.fillStyle = U.shade(base, -0.4); line([pts[0][0], pts[0][1] + 1], [pts[1][0], pts[1][1] + 1], ws);
      ctx.fillStyle = base; line(pts[0], pts[1], ws); line(pts[1], pts[2], ws);
      if (ws >= 3) { ctx.fillStyle = U.shade(base, 0.4); line([pts[0][0], pts[0][1] - 1], [pts[1][0], pts[1][1] - 1], 1); }
      // Dekorstreifen nahe der Spitze
      const a = U.lerp(pts[0][0], pts[1][0], 0.72), b = U.lerp(pts[0][1], pts[1][1], 0.72);
      const a2 = U.lerp(pts[0][0], pts[1][0], 0.86), b2 = U.lerp(pts[0][1], pts[1][1], 0.86);
      ctx.fillStyle = isFar ? far : suit; line([a, b], [a2, b2], Math.max(1, ws - 1));
      // Bindung
      const bp = isFar ? depth(P([ox + 0.05, 0.02]), 1) : P([ox + 0.05, 0.02]);
      ctx.fillStyle = '#2a2c34'; ctx.fillRect(Math.round(bp[0] - ws), Math.round(bp[1] - ws), ws * 2 + 1, ws + 1);
    };

    // 1) abgewandte Seite
    drawSki(foot2[0], true);
    const f2 = depth(P(foot2), 1), k2 = depth(P(knee2), 0.8), h2 = depth(P(hip), 0.5);
    shadeLimb(f2, k2, wl, far, farL); shadeLimb(k2, h2, wl, far, farL);
    ctx.fillStyle = boot; ctx.fillRect(Math.round(f2[0] - wl / 2), Math.round(f2[1] - wl), wl + 1, wl + 1);
    const s2 = depth(P(sh), 0.6), a2 = depth(P(hand2), 0.9);
    shadeLimb(s2, a2, wa, far, null);
    ctx.fillStyle = glove; ctx.fillRect(Math.round(a2[0] - wa), Math.round(a2[1] - wa), wa * 2, wa * 2);

    // 2) Rumpf mit Startnummer
    const pH = P(hip), pS = P(sh);
    shadeLimb(pH, pS, wt, suitD, suit);
    if (wt >= 5) {
      const b0 = [U.lerp(pH[0], pS[0], 0.22), U.lerp(pH[1], pS[1], 0.22)], b1 = [U.lerp(pH[0], pS[0], 0.8), U.lerp(pH[1], pS[1], 0.8)];
      ctx.fillStyle = col.bib || '#f4f4f4'; line(b0, b1, wt - 1);
      if (wt >= 7) {
        ctx.fillStyle = '#1a1a1a';
        const m = [U.lerp(b0[0], b1[0], 0.4), U.lerp(b0[1], b1[1], 0.4)], m2 = [U.lerp(b0[0], b1[0], 0.62), U.lerp(b0[1], b1[1], 0.62)];
        line(m, m2, 2);
      }
    }

    // 3) zugewandte Seite
    drawSki(0, false);
    const pF = P(foot), pK = P(knee);
    shadeLimb(pF, pK, wl, suitD, suitL);
    shadeLimb(pK, pH, wl, suitD, suitL);
    ctx.fillStyle = boot; ctx.fillRect(Math.round(pF[0] - wl / 2), Math.round(pF[1] - wl), wl + 2, wl + 1);
    const pA = P(hand);
    shadeLimb(pS, pA, wa + 1, suit, wa >= 2 ? suitL : null);
    ctx.fillStyle = glove; ctx.fillRect(Math.round(pA[0] - wa), Math.round(pA[1] - wa), wa * 2 + 1, wa * 2 + 1);

    // 4) Kopf: Helm, Glanzlicht, Brille, Kinn
    const hp = P(head), r = Math.max(2, Math.round(k * 0.12));
    ctx.fillStyle = U.shade(col.helmet, -0.3); this.disc(ctx, hp[0] + 1, hp[1] + 1, r);
    ctx.fillStyle = col.helmet; this.disc(ctx, hp[0], hp[1], r);
    if (r >= 3) { ctx.fillStyle = U.shade(col.helmet, 0.6); ctx.fillRect(Math.round(hp[0] - r * 0.5), Math.round(hp[1] - r * 0.6), Math.max(1, Math.round(r * 0.5)), Math.max(1, Math.round(r * 0.3))); }
    // Blickrichtung = lokale +x-Achse
    const fx = c, fy = -sn;
    const gx = hp[0] + fx * r * 0.55, gy = hp[1] + fy * r * 0.55 + r * 0.15;
    const gw = Math.max(2, Math.round(r * 0.9)), gh = Math.max(1, Math.round(r * 0.55));
    ctx.fillStyle = '#16181f'; ctx.fillRect(Math.round(gx - gw / 2), Math.round(gy - gh / 2), gw, gh);
    if (gw >= 3) { ctx.fillStyle = '#7fe6ff'; ctx.fillRect(Math.round(gx - gw / 2) + 1, Math.round(gy - gh / 2), Math.max(1, gw - 2), 1); }
    if (r >= 3) { ctx.fillStyle = '#f0c8a0'; ctx.fillRect(Math.round(gx - 1 + fx), Math.round(gy + gh / 2), Math.max(1, Math.round(r * 0.5)), Math.max(1, Math.round(r * 0.35))); }
  },

  /** Schatten des Springers auf dem Schnee (verstärkt den Raumeindruck). */
  drawShadow(ctx, cam, h, x, y) {
    this._n(ctx, () => {
      const gy = h.groundY(x), hgt = y - gy;
      if (hgt < 0.2 || hgt > 30) return;
      const a = 0.38 * (1 - hgt / 30), ppm = cam.ppm * SCR.Z;
      const half = Math.max(5, Math.round(1.4 * ppm * Math.max(1.6, 10 / cam.ppm) * (1 - hgt / 60)));
      const sx = this.sx(x, cam), th = h.slopeAt(x);
      ctx.fillStyle = `rgba(30,40,90,${a.toFixed(3)})`;
      for (let i = -half; i <= half; i++) {
        const wx = x + i / ppm;
        const yy = Math.round(this.sy(h.groundY(wx), cam)) + 2;
        const thick = Math.abs(i) < half * 0.6 ? 3 : 2;
        ctx.fillRect(Math.round(sx + i), yy, 1, thick);
      }
      if (!th) return;
    });
  },

  /* ================================================================ */
  /* Vorschau-Profil (Menüs) – Eingabe in logischen Koordinaten        */
  /* ================================================================ */
  drawPreview(ctx, h, lbx, lby, lbw, lbh) {
    const T = ctx.getTransform();
    this._n(ctx, () => {
      const Z = SCR.Z, bx = Math.round(lbx * Z + T.e), by = Math.round(lby * Z + T.f), bw = lbw * Z, bh = lbh * Z;
      const P = h.pal;
      for (let y = 0; y < bh; y++) {
        const f = y / bh * 3.99, i = Math.floor(f), tt = f - i;
        const thr = BAYER[(y & 3) * 4];
        ctx.fillStyle = tt > thr && i < 3 ? P.sky[i + 1] : P.sky[i];
        ctx.fillRect(bx, by + y, bw, 1);
      }
      const xMin = h.topX - 8, xMax = h.flatX + 40, yMax = h.topY + 10, yMin = h.groundY(h.flatX) - 6;
      const sc = Math.min(bw / (xMax - xMin), bh / (yMax - yMin));
      const ox = bx + (bw - (xMax - xMin) * sc) / 2, oy = by + (bh - (yMax - yMin) * sc) / 2;
      const X = x => ox + (x - xMin) * sc, Y = y => oy + (yMax - y) * sc;
      const WX = i => xMin + (bx + i + 0.5 - ox) / sc;
      // Bergsilhouetten
      [[P.mtn[0], 0.42, 0.12], [P.mtn[1], 0.55, 0.09]].forEach(([colr, lvl, amp], li) => {
        ctx.fillStyle = colr;
        for (let i = 0; i < bw; i++) {
          const yy = by + bh * lvl + Math.sin(i * 0.021 + h.decoSeed + li) * bh * amp + Math.abs(Math.sin(i * 0.09 + li * 3)) * bh * 0.03;
          ctx.fillRect(bx + i, Math.round(yy), 1, by + bh - Math.round(yy));
        }
      });
      // Wald und Schnee
      ctx.fillStyle = P.forest;
      for (let i = 0; i < bw; i++) {
        const wx = WX(i), y = Math.round(Y(h.groundY(wx) + 4 + Math.abs(Math.sin(i * 0.5)) * 3));
        if (y < by + bh) ctx.fillRect(bx + i, Math.max(by, y), 1, by + bh - Math.max(by, y));
      }
      ctx.fillStyle = P.snow;
      ctx.beginPath();
      for (let i = 0; i < bw; i++) {
        const y = Math.round(Y(h.groundY(WX(i))));
        if (y < by + bh) ctx.rect(bx + i, Math.max(by, y), 1, by + bh - Math.max(by, y));
      }
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < bw; i++) { const y = Math.round(Y(h.groundY(WX(i)))); if (y >= by && y < by + bh) ctx.fillRect(bx + i, y, 1, 1); }
      // Anlauf mit Stützen
      ctx.fillStyle = P.struct;
      ctx.beginPath();
      for (let i = 0; i < bw; i++) {
        const wx = WX(i);
        if (wx < h.topX || wx > 0) continue;
        const y = Math.round(Y(h.inrunYAt(wx))), gy = Math.round(Y(h.groundY(wx)));
        ctx.rect(bx + i, y, 1, 3);
        if (wx > -h.table * 1.3 || Math.floor(wx / 10) !== Math.floor(WX(i - 1) / 10)) ctx.rect(bx + i, y, 1, gy - y);
      }
      ctx.fill();
      ctx.fillRect(Math.round(X(h.topX - 4)), Math.round(Y(h.topY + 5)), Math.max(4, Math.round(6 * sc)), Math.max(4, Math.round(5 * sc)));
      const mk = (d, color) => {
        const x = Hills.xAtArc(h, d);
        const px = Math.round(X(x)), py = Math.round(Y(h.groundY(x)));
        ctx.fillStyle = color; ctx.fillRect(px - 2, py - 12, 4, 16);
      };
      mk(h.K, '#e02828'); mk(h.HS, '#ff9a1a');
      const rec = Records.get(h.id);
      if (rec) mk(rec.d, '#2ec84a');
      ctx.fillStyle = '#000';
      ctx.fillRect(bx, by, bw, 2); ctx.fillRect(bx, by + bh - 2, bw, 2); ctx.fillRect(bx, by, 2, bh); ctx.fillRect(bx + bw - 2, by, 2, bh);
    });
  }
};

/** Weltpartikel (Schneespray, Windfetzen). */
class Particles {
  constructor() { this.list = []; }
  add(p) { if (this.list.length < 600) this.list.push(p); }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
      p.vy -= (p.g || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  draw(ctx, cam) {
    Renderer._n(ctx, () => {
      const Z = SCR.Z;
      for (const p of this.list) {
        const sx = Math.round(Renderer.sx(p.x, cam)), sy = Math.round(Renderer.sy(p.y, cam));
        if (sx < -16 || sx > SCR.W + 16 || sy < -16 || sy > SCR.H + 16) continue;
        ctx.fillStyle = p.c;
        if (p.streak) ctx.fillRect(sx, sy, p.streak * Z, 1);
        else ctx.fillRect(sx, sy, (p.s || 1) * Z, (p.s || 1) * Z);
      }
    });
  }
  clear() { this.list.length = 0; }
}

/** Schneefall im Bildschirmraum (nativ) mit Tiefenstaffelung. */
class SnowField {
  constructor(n) {
    this.flakes = [];
    const cnt = Math.round(n * 1.6);
    for (let i = 0; i < cnt; i++) this.flakes.push({ x: Math.random() * SCR.NW, y: Math.random() * SCR.NH, d: 0.3 + Math.random() * 0.7, p: Math.random() * 6.28 });
    this.last = null;
  }
  update(dt, cam, wind) {
    const ppm = cam.ppm * SCR.Z;
    const dx = this.last ? (cam.x - this.last.x) * ppm : 0;
    const dy = this.last ? (cam.y - this.last.y) * ppm : 0;
    this.last = { x: cam.x, y: cam.y };
    const W = SCR.NW, H = SCR.NH;
    for (const f of this.flakes) {
      f.x += (-wind * 28 * f.d + Math.sin(f.p += dt * 1.7) * 12) * dt - dx * f.d * 0.6;
      f.y += (36 + 56 * f.d) * dt + dy * f.d * 0.6;
      if (f.x < -8) f.x += W + 16; else if (f.x > W + 8) f.x -= W + 16;
      if (f.y > H + 8) f.y -= H + 16; else if (f.y < -8) f.y += H + 16;
    }
  }
  draw(ctx) {
    Renderer._n(ctx, () => {
      const q = SCR.Z / 2;
      for (const f of this.flakes) {
        const s = Math.max(1, Math.round((f.d > 0.85 ? 3 : (f.d > 0.55 ? 2 : 1)) * q));
        ctx.fillStyle = f.d > 0.7 ? '#ffffff' : '#dfe8f8';
        ctx.fillRect(Math.round(f.x * q), Math.round(f.y * q), s, s);
      }
    });
  }
}

/* ------------------------------------------------------------------ */
/* Ragdoll – Sturzanimation mit Verlet-Physik                           */
/* ------------------------------------------------------------------ */
/* Der Körper besteht aus Punktmassen (Kopf, Schulter, Hüfte, Knie, Füße,
   Hände, Skienden), verbunden durch Längen-Constraints. Die Ski hängen
   zunächst an den Füßen und lösen sich nach kurzer Zeit aus der Bindung.
   Bodenkontakt folgt dem Hangprofil mit Reibung und leichtem Rückprall. */
const RAG_NAMES = ['head', 'sh', 'hip', 'knee', 'foot', 'knee2', 'foot2', 'hand', 'hand2', 's1a', 's1b', 's2a', 's2b'];
const RAG_I = {}; RAG_NAMES.forEach((n, i) => { RAG_I[n] = i; });

class Ragdoll {
  /** j: Springer-Darstellung (Pose, Rotation), vx/vy: Geschwindigkeit, s: Zeichenmaßstab */
  constructor(hill, j, vx, vy, s, rng) {
    this.h = hill; this.s = s;
    const A = POSES[j.pose] || POSES.stand, B = POSES[j.pose2 || j.pose] || A, t = j.blend === undefined ? 1 : j.blend;
    const L = k => [A[k][0] + (B[k][0] - A[k][0]) * t, A[k][1] + (B[k][1] - A[k][1]) * t];
    const c = Math.cos(j.rot), sn = Math.sin(j.rot);
    const W = p => [j.x + (c * p[0] - sn * p[1]) * s, j.y + (sn * p[0] + c * p[1]) * s];
    const f2 = L('foot2');
    const local = {
      head: L('head'), sh: L('sh'), hip: L('hip'), knee: L('knee'), foot: [0, 0], knee2: L('knee2'), foot2: f2,
      hand: L('hand'), hand2: L('hand2'),
      s1a: [-1.05, -0.04], s1b: [1.6, -0.04], s2a: [f2[0] - 1.05, -0.04], s2b: [f2[0] + 1.6, -0.04]
    };
    const n = RAG_NAMES.length, dt = PHYS.DT;
    this.x = new Float32Array(n); this.y = new Float32Array(n);
    this.px = new Float32Array(n); this.py = new Float32Array(n);
    RAG_NAMES.forEach((nm, i) => { const p = W(local[nm]); this.x[i] = p[0]; this.y[i] = p[1]; });
    // Startgeschwindigkeit plus Drehimpuls um die Hüfte
    const hi = RAG_I.hip, w = (rng() < 0.5 ? -1 : 1) * (2.5 + rng() * 3);
    for (let i = 0; i < n; i++) {
      const rx = this.x[i] - this.x[hi], ry = this.y[i] - this.y[hi];
      const ivx = vx - w * ry + (rng() - 0.5) * 0.8, ivy = vy + w * rx + (rng() - 0.5) * 0.8;
      this.px[i] = this.x[i] - ivx * dt; this.py[i] = this.y[i] - ivy * dt;
    }
    const C = this.cons = [];
    const add = (a, b, stiff = 1, release = Infinity) => {
      const ia = RAG_I[a], ib = RAG_I[b];
      C.push({ a: ia, b: ib, len: Math.hypot(this.x[ia] - this.x[ib], this.y[ia] - this.y[ib]), stiff, release });
    };
    // Körper
    [['head', 'sh'], ['sh', 'hip'], ['hip', 'knee'], ['knee', 'foot'], ['hip', 'knee2'], ['knee2', 'foot2'],
     ['sh', 'hand'], ['sh', 'hand2']].forEach(([a, b]) => add(a, b));
    add('head', 'hip', 1);                 // Rumpf bleibt gestreckt
    add('knee', 'knee2', 0.15);            // Beine nicht beliebig weit auseinander
    add('hand', 'hip', 0.05); add('hand2', 'hip', 0.05);
    // Ski starr, Bindungen lösen sich nach kurzer Zeit
    add('s1a', 's1b'); add('s2a', 's2b');
    const r1 = 0.15 + rng() * 0.5, r2 = 0.2 + rng() * 0.7;
    add('foot', 's1a', 1, r1); add('foot', 's1b', 1, r1);
    add('foot2', 's2a', 1, r2); add('foot2', 's2b', 1, r2);
    this.t = 0; this.impact = 0;
  }
  step(dt) {
    const n = RAG_NAMES.length, g = PHYS.G * dt * dt, h = this.h;
    this.t += dt;
    for (let i = 0; i < n; i++) {
      const vx = (this.x[i] - this.px[i]) * 0.998, vy = (this.y[i] - this.py[i]) * 0.998;
      this.px[i] = this.x[i]; this.py[i] = this.y[i];
      this.x[i] += vx; this.y[i] += vy - g;
    }
    let maxHit = 0;
    for (let it = 0; it < 8; it++) {
      for (const c of this.cons) {
        if (this.t > c.release) continue;
        const dx = this.x[c.b] - this.x[c.a], dy = this.y[c.b] - this.y[c.a];
        const d = Math.hypot(dx, dy) || 1e-6;
        const k = (d - c.len) / d * 0.5 * c.stiff;
        this.x[c.a] += dx * k; this.y[c.a] += dy * k;
        this.x[c.b] -= dx * k; this.y[c.b] -= dy * k;
      }
      // Bodenkontakt entlang des Hangprofils
      for (let i = 0; i < n; i++) {
        const r = i >= RAG_I.s1a ? 0.03 : 0.1;
        const gy = h.groundY(this.x[i]) + r;
        if (this.y[i] < gy) {
          const th = h.slopeAt(this.x[i]);
          const tx = Math.cos(th), ty = -Math.sin(th), nx = Math.sin(th), ny = Math.cos(th);
          let vx = this.x[i] - this.px[i], vy = this.y[i] - this.py[i];
          let vt = vx * tx + vy * ty, vn = vx * nx + vy * ny;
          if (it === 0) maxHit = Math.max(maxHit, -vn / dt);
          if (vn < 0) vn = -vn * 0.25;
          vt *= i >= RAG_I.s1a ? 0.996 : 0.985;      // Ski gleiten weiter als der Körper
          this.y[i] = gy;
          this.px[i] = this.x[i] - (vt * tx + vn * nx);
          this.py[i] = this.y[i] - (vt * ty + vn * ny);
        }
      }
    }
    this.impact = maxHit;   // stärkster Aufprall in diesem Schritt (m/s)
  }
  hip() { const i = RAG_I.hip; return [this.x[i], this.y[i]]; }
  vel() { const i = RAG_I.hip; return [(this.x[i] - this.px[i]) / PHYS.DT, (this.y[i] - this.py[i]) / PHYS.DT]; }
  onGround() { const i = RAG_I.hip; return this.y[i] - this.h.groundY(this.x[i]) < 0.25; }
  /** Kompakter Zustand für das Replay. */
  snapshot() {
    const n = RAG_NAMES.length, a = new Float32Array(n * 2 + 1);
    for (let i = 0; i < n; i++) { a[i * 2] = this.x[i]; a[i * 2 + 1] = this.y[i]; }
    a[n * 2] = this.s;
    return a;
  }
}

/** Zeichnet einen Ragdoll-Zustand (Snapshot) im Stil des Springers. */
Renderer.drawRagdoll = function (ctx, cam, snap, col) {
  this._n(ctx, () => {
    const n = RAG_NAMES.length, ppm = cam.ppm * SCR.Z, s = snap[n * 2];
    const P = i => [(snap[i * 2] - cam.x) * ppm + SCR.CX, SCR.CY - (snap[i * 2 + 1] - cam.y) * ppm];
    const k = ppm * s;
    const wl = Math.max(2, Math.round(k * 0.13)), wt = Math.max(3, Math.round(k * 0.2)), wa = Math.max(1, Math.round(k * 0.08)), ws = Math.max(2, Math.round(k * 0.065));
    const line = (p, q, size) => this.line(ctx, p[0], p[1], q[0], q[1], size);
    const limb = (a, b, w, base, hl) => {
      const p = P(RAG_I[a]), q = P(RAG_I[b]);
      ctx.fillStyle = base; line(p, q, w);
      if (hl && w >= 3) { ctx.fillStyle = hl; line([p[0] - 1, p[1] - 1], [q[0] - 1, q[1] - 1], w - 2); }
    };
    const ski = (a, b, color) => {
      const p = P(RAG_I[a]), q = P(RAG_I[b]);
      ctx.fillStyle = U.shade(color, -0.4); line([p[0], p[1] + 1], [q[0], q[1] + 1], ws);
      ctx.fillStyle = color; line(p, q, ws);
      const tip = [q[0] + (q[0] - p[0]) * 0.05, q[1] + (q[1] - p[1]) * 0.05 - ws];
      line(q, tip, ws);
    };
    const suit = col.suit, suitD = U.shade(suit, -0.32), suitL = U.shade(suit, 0.28), far = col.suit2, farL = U.shade(far, 0.15);
    ski('s2a', 's2b', U.shade(col.ski, -0.45));
    limb('hip', 'knee2', wl, far, farL); limb('knee2', 'foot2', wl, far, farL); limb('sh', 'hand2', wa, far, null);
    limb('hip', 'sh', wt, suitD, suit);
    ski('s1a', 's1b', col.ski);
    limb('hip', 'knee', wl, suitD, suitL); limb('knee', 'foot', wl, suitD, suitL);
    limb('sh', 'hand', wa + 1, suit, wa >= 2 ? suitL : null);
    ctx.fillStyle = '#1c1d24';
    [RAG_I.foot, RAG_I.foot2].forEach(i => { const p = P(i); ctx.fillRect(Math.round(p[0] - wl / 2), Math.round(p[1] - wl / 2), wl + 1, wl + 1); });
    const hp = P(RAG_I.head), r = Math.max(2, Math.round(k * 0.12));
    ctx.fillStyle = U.shade(col.helmet, -0.3); this.disc(ctx, hp[0] + 1, hp[1] + 1, r);
    ctx.fillStyle = col.helmet; this.disc(ctx, hp[0], hp[1], r);
    const sp = P(RAG_I.sh), dx = hp[0] - sp[0], dy = hp[1] - sp[1], d = Math.hypot(dx, dy) || 1;
    ctx.fillStyle = '#16181f';
    ctx.fillRect(Math.round(hp[0] + dx / d * r * 0.3 - r * 0.4), Math.round(hp[1] + dy / d * r * 0.3 - r * 0.25), Math.max(2, Math.round(r * 0.8)), Math.max(1, Math.round(r * 0.5)));
  });
};

// Kamera-Zoom (logische px/m, nativ x2). v1.5: +20 %, v1.6: weitere +30 % → 1,56-fach

const CAM_ZOOM = 1.2 * 1.3;
const CAM = { gate: 10, inrun: 10 * CAM_ZOOM, flight: 10 * CAM_ZOOM, flightMin: 4 * CAM_ZOOM, flightK: 310 * CAM_ZOOM, ground: 9 * CAM_ZOOM };

const COL = {
  bg: '#0a1433', panel: '#101e4a', border: '#7fa8ff', text: '#ffffff', dim: '#8fa3d6',

};
const UI = {

  },
  hit(list, x, y) { return list.find(b => U.pointIn(x, y, b)) || null; },
  back: { x: 8, y: 8, w: 84, h: 17, label: '◄ ZURÜCK', id: 'back' },
  drawBack(ctx, mx, my) { this.button(ctx, this.back, U.pointIn(mx, my, this.back)); },
  title(ctx, text, y = 14) { Font.draw(ctx, text, 320, y, COL.hi, 2, 'center', '#000000'); },
  /** Pixel-Pfeil für Windanzeige. */
  arrow(ctx, x, y, dir, len, color) {
    ctx.fillStyle = color;

  }
};

/** Animierter Hintergrund für alle Menüs (Berge, Schanze, Schneefall). */
const MenuBG = {
  t: 0, snow: new SnowField(110), cam: { x: 0, y: 0, ppm: 2.6 },
  update(dt) {
    this.t += dt;
    const h = Game.hill();
    const a = h.topX - 20, b = h.flatX + 60;
    this.cam.ppm = 2.6;
    this.cam.x = a + (0.5 - 0.5 * Math.cos(this.t * 0.045)) * (b - a);
    const target = h.groundY(this.cam.x) + 55;
    this.cam.y = this.t < 0.1 ? target : U.lerp(this.cam.y, target, Math.min(1, dt * 1.5));
    this.snow.update(dt, this.cam, 0.6);
  },
  draw(ctx, dim = 0.45) {
    const h = Game.hill(), w = Quality.begin(ctx);
    Renderer.drawBackground(w, h, this.cam, this.t);
    Renderer.drawWorld(w, h, this.cam, this.t, { wind: 0.6 + Math.sin(this.t * 0.3) });
    this.snow.draw(w);
    Quality.end(ctx);
    ctx.save();
    ctx.setTransform(SCR.Z, 0, 0, SCR.Z, 0, 0);
    ctx.fillStyle = `rgba(4,8,30,${dim})`;
    ctx.fillRect(0, 0, SCR.LW, SCR.LH);
    ctx.restore();
  }
};

class MenuScene {
  get centered() { return true; }
  constructor() {
    this.items = ['SCHANZE WÄHLEN', 'ZUFALLSSCHANZE GENERIEREN', 'TUTORIAL', 'TRAINING', 'WETTKAMPF', 'WELTCUP', 'MEHRSPIELER', 'HIGHSCORES', 'EINSTELLUNGEN', 'BEENDEN'];
    this.sel = 0;
    this.rects = this.items.map((it, i) => ({ x: 170, y: 146 + i * 26, w: 300, h: 23 }));
    this.fsBtn = { x: 640 + SCR.UIX - 112, y: 8, w: 104, h: 20, label: '[F] VOLLBILD', id: 'fs' };
  }
  enter() { Sound.playSong('menu'); }
  update(dt) { MenuBG.update(dt); }
  activate(i) {
    Sound.sfx('select');
    const h = Game.hill();
    switch (i) {
      case 0: Game.setScene(new HillSelectScene()); break;
      case 1: Game.setScene(new RandomScene()); break;
      case 2: Game.setScene(new TutorialScene()); break;
      case 3: Game.startTraining(h); break;
      case 4: Game.setScene(new CompetitionScene(h)); break;
      case 5: Game.setScene(new CupScene()); break;
      case 6: Game.setScene(new MultiScene()); break;
      case 7: Game.setScene(new HighscoreScene()); break;
      case 8: Game.setScene(new SettingsScene()); break;
      case 9: Game.setScene(new QuitScene()); break;
    }
  }
  onKey(code, key, repeat) {
    const n = this.items.length;
    if (code === 'ArrowUp') { this.sel = (this.sel + n - 1) % n; Sound.sfx('blip'); }
    else if (code === 'ArrowDown') { this.sel = (this.sel + 1) % n; Sound.sfx('blip'); }
    else if ((code === 'Enter' || code === 'Space') && !repeat) this.activate(this.sel);
    else if (code === 'Escape' && !repeat) { this.sel = n - 1; Sound.sfx('blip'); }
    else if (/^Digit[1-9]$/.test(code) && !repeat) this.activate(+code.slice(5) - 1);
    else if (code === 'Digit0' && !repeat) this.activate(9);
  }
  onMove(x, y) {
    const i = this.rects.findIndex(r => U.pointIn(x, y, r));
    if (i >= 0 && i !== this.sel) { this.sel = i; Sound.sfx('tick'); }
  }
  onClick(x, y) {
    if (U.pointIn(x, y, this.fsBtn)) { Game.fullscreen(); return; }
    const i = this.rects.findIndex(r => U.pointIn(x, y, r));
    if (i >= 0) this.activate(i);
  }
  render(ctx) {
    MenuBG.draw(ctx, 0.35);
    const t = MenuBG.t;
    // Titel
    const bob = Math.round(Math.sin(t * 2) * 2);
    Font.draw(ctx, 'ALPINE SKI JUMP', 320, 40 + bob, '#ffffff', 5, 'center', '#1a2a6a');
    const cols = ['#ffd23c', '#ffb02c', '#ff8a2c', '#ffb02c'];
    const w = Font.width('DELUXE', 6);
    let x = 320 - w / 2;
    'DELUXE'.split('').forEach((ch, i) => {
      const yy = 92 + bob + Math.round(Math.sin(t * 4 + i * 0.7) * 3);
      Font.draw(ctx, ch, x, yy, cols[(i + Math.floor(t * 6)) % 4], 6, 'left', '#5a1a00');
      x += 36;
    });
    // Menüpunkte
    this.items.forEach((it, i) => {
      const r = this.rects[i], on = i === this.sel;
      if (on) {
        ctx.fillStyle = 'rgba(255,210,60,0.18)'; ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = COL.hi; ctx.fillRect(r.x, r.y, 3, r.h); ctx.fillRect(r.x + r.w - 3, r.y, 3, r.h);
        Font.draw(ctx, '►', r.x + 14 + Math.round(Math.sin(t * 8) * 2), r.y + 4, COL.hi, 2);
      }
      Font.draw(ctx, ((i + 1) % 10) + '. ' + it, 320, r.y + 5, on ? COL.hi : '#ffffff', 2, 'center', '#000000');
    });
    if (!Ach.data.n.jumps && Math.floor(t * 2) % 2) Font.draw(ctx, '◄ NEU HIER?', 410, this.rects[2].y + 9, COL.hi, 1, 'left', '#000');
    const h = Game.hill();
    const rec = Records.get(h.id);
    Font.draw(ctx, 'SCHANZE: ' + h.title + (rec ? '   REKORD ' + U.fmtDist(rec.d) + ' M' : ''), 320, 418, COL.cyan, 1, 'center', '#000');
    Font.draw(ctx, '↑↓ AUSWÄHLEN   ENTER OK   ESC ZURÜCK   M MUSIK', 320, 440, COL.dim, 1, 'center', '#000');
    Font.draw(ctx, 'V' + VERSION + '  ·  ALLES PROZEDURAL ERZEUGT', 320, 458, '#5a6a9a', 1, 'center');
    UI.button(ctx, this.fsBtn, false);
  }
}

function hillInfoLines(h) {
  const rec = Records.get(h.id);
  return [
    ['K-PUNKT', h.K + ' M'], ['HILL SIZE', 'HS ' + h.HS],
    ['ANLAUFLÄNGE', Math.round(h.inrunLen) + ' M'], ['ANLAUFNEIGUNG', U.fmt1(h.gamma) + '°'],
    ['TISCHWINKEL', U.fmt1(h.alpha) + '°'], ['AUFSPRUNG', U.fmt1(h.beta) + '° / R ' + Math.round(h.r2) + ' M'],
    ['TEMPO (LUKE ' + GATE.STD + ')', U.fmt1(h.gateKmh[GATE.STD]) + ' KM/H' + (h.weatherDef.mu ? ' (SCHNEE)' : '')], ['WIND', h.windDef.label],
