<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Claude Rallye</title>
<!--
  CLAUDE RALLYE – Top-Down-Arcade-Rennspiel
  Eine einzige Datei: HTML5 + Canvas + JavaScript, keine externen Abhängigkeiten außer Google Fonts.

  ARCHITEKTUR (Kurzüberblick)
  ---------------------------------------------------------------
  1  Grundlagen       Konstanten, Mathe-Helfer, Zufall, Speicher (localStorage)
  2  Oberflächen      Asphalt, Gras, Sand, Kies, Schnee, Eis, Wasser, Boxengasse, Curbs
  3  Streckenmodell   Raster (320x200 Zellen à 4 px) + Objekte + Checkpoints + KI-Linie
                      + Startplätze + Boxengasse; JSON-Export/Import (RLE-kodiert)
  4  Auto-Werkzeuge   Checkpoints, KI-Linie, Startplätze automatisch berechnen
  5  Beispielstrecken 5 prozedural erzeugte Kurse (Oval, Stadt, Wüste, Schnee, Technisch)
  6  Strecken-Grafik  Bodenpixel mit Rauschen, Markierungen, Objekte, Baumkronen-Ebene
  7  Audio            WebAudio-Synthese (Motoren, Quietschen, Crash, Countdown)
  8  Eingabe          Tastatur für 4 Spieler + Gamepad API
  9  Fahrzeuge        3 Klassen, Arcade-Physik mit Drift, Kollisionen, Schaden/Sprit/Reifen
  10 KI               Ideallinie + Geschwindigkeitsprofil, 4 Stufen, Ausweichen, Boxenstopps
  11 Rennen           Countdown, Checkpoints (Anti-Cheat), Positionen nach Renndistanz,
                      Boxendienst, Ziel, Ergebnis, Bestenliste, Ghost-Car
  12 Darstellung      Autos, Partikel, Bremsspuren, Seitenleiste mit HUD
  13 Menüs            Hauptmenü, Rennsetup, Zeitfahren, Championship, Optionen, Bestenliste
  14 Streckeneditor   Paint-Stil: Malen, Füllen, Objekte, Checkpoints, KI-Linie, Box, Start
  15 Hauptschleife    Feste Physikschritte (120 Hz), Darstellung per requestAnimationFrame
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1118; --panel:#151b26; --panel2:#1d2533; --panel3:#253044; --line:#2e3a50;
  --text:#e9eef6; --muted:#8a97ad; --accent:#ff6a2b; --accent2:#38c4ff;
  --good:#47d48a; --bad:#ff4d5e; --warn:#ffc83d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07090d;color:var(--text);
  font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1540px;height:800px;transform-origin:0 0;overflow:hidden;background:#000}
#game{position:absolute;left:0;top:0;width:1540px;height:800px;display:block}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ---------- Bildschirme ---------- */
.screen{position:absolute;inset:0;display:none;z-index:10}
.screen.on{display:block}
.dim{position:absolute;inset:0;background:linear-gradient(120deg,rgba(7,9,13,.92),rgba(7,9,13,.7) 55%,rgba(7,9,13,.88))}
.wrap{position:absolute;inset:0;padding:34px 44px}

/* Hauptmenü */
#scr-main .logo{position:absolute;left:80px;top:40px}
.logo h1{font-family:'Russo One',sans-serif;font-size:92px;line-height:.9;margin:0;letter-spacing:2px;
  color:#fff;text-shadow:0 6px 0 #b8401a,0 10px 30px rgba(255,106,43,.35)}
.logo h1 span{color:var(--accent)}
.logo .sub{margin-top:14px;font-size:20px;color:var(--muted);letter-spacing:6px;text-transform:uppercase}
.mainmenu{position:absolute;left:80px;top:250px;display:flex;flex-direction:column;gap:5px;width:380px}
.mbtn{display:flex;align-items:center;gap:14px;background:rgba(21,27,38,.85);border:1px solid var(--line);
  color:var(--text);font-size:19px;font-weight:600;padding:6px 18px;border-radius:10px;text-align:left;
  transition:transform .08s,background .12s,border-color .12s}
.mbtn:hover,.mbtn:focus{background:var(--panel3);border-color:var(--accent);transform:translateX(6px);outline:none}
.mbtn .ico{width:28px;text-align:center;color:var(--accent);font-size:20px}
.mbtn small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.version{position:absolute;right:20px;bottom:14px;color:var(--muted);font-size:13px}
.hint{position:absolute;left:80px;bottom:14px;color:var(--muted);font-size:14px}

/* Setup & allgemeine Panels */
.head{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.head h2{font-family:'Russo One',sans-serif;font-size:36px;margin:0;font-weight:400}
.head .spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:8px;font-size:16px;font-weight:600}
.btn:hover{border-color:var(--accent2);background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d05}
.btn.primary:hover{filter:brightness(1.1)}
.btn.big{font-size:22px;padding:13px 30px}
.btn.small{font-size:13px;padding:5px 10px}
.btn.danger{border-color:#6b2a33;color:#ff9aa5}
.btn:disabled{opacity:.4;cursor:default}
.cols{display:flex;gap:22px;height:640px}
.col{background:rgba(21,27,38,.92);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto}
.col h3{margin:0 0 12px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;min-height:34px}
.row label.l{width:130px;color:var(--muted);font-size:15px;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:none;color:var(--muted);padding:6px 11px;font-size:14px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent2);color:#04121a}
.seg.small button{padding:5px 8px;font-size:13px}
.selbox{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;line-height:1}
.stepper span{min-width:36px;text-align:center;font-size:18px;font-weight:700}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.titem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:15px}
.titem:hover{border-color:var(--accent2)}
.titem.on{border-color:var(--accent);background:#2a2320}
.titem .tag{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.titem input{accent-color:var(--accent)}
canvas.car3d{width:150px;height:75px;border-radius:6px;border:1px solid var(--line);flex:none}
.clsrow{display:flex;gap:10px;align-items:center}
canvas.preview{width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin-top:12px;background:#000}
.tog{position:relative;width:46px;height:24px;border-radius:12px;background:#3a4559;border:none;flex:none}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#cfd6e2;transition:left .12s}
.tog.on{background:var(--good)}
.tog.on::after{left:25px}
input[type=range]{accent-color:var(--accent);width:140px}
.pct{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.prow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.prow .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prow .badge{font-weight:700;font-size:13px;padding:2px 8px;border-radius:6px;color:#000}
.prow input.name{background:#0f141d;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px;font-size:15px;width:150px}
.prow .keys{margin-left:auto;font-size:12px;color:var(--muted)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.clsdesc{font-size:12px;color:var(--muted);margin-top:4px}
.startbar{position:absolute;right:44px;bottom:26px;display:flex;gap:12px;align-items:center}
.note{font-size:13px;color:var(--muted)}

/* Tabellen */
table.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid #222c3d;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:rgba(255,106,43,.08)}
.tbl .pos{font-family:'Russo One',sans-serif;font-size:18px;width:40px}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.laps{font-size:12px;color:var(--muted);max-width:420px}
.laps b{color:var(--good);font-weight:600}

/* Pause */
#scr-pause .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;background:rgba(21,27,38,.96);
  border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:10px}
#scr-pause h2{font-family:'Russo One',sans-serif;margin:0 0 10px;text-align:center;font-weight:400;font-size:34px}

/* Editor-Seitenleiste */
#editor-ui{position:absolute;left:1280px;top:0;width:260px;height:800px;background:#121823;border-left:1px solid var(--line);
  display:none;z-index:5;overflow-y:auto;padding:10px 10px 30px;font-size:13px}
#editor-ui.on{display:block}
#editor-ui h4{margin:12px 0 6px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
#editor-ui .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#editor-ui .tools button,#editor-ui .grid2 button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:6px 2px;font-size:12px;font-weight:600}
#editor-ui .tools button.on{background:var(--accent);color:#1a0d05;border-color:var(--accent)}
#editor-ui .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#editor-ui .grid2 button:hover,#editor-ui .tools button:hover{border-color:var(--accent2)}
#editor-ui .surfs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#editor-ui .surfs button{border:2px solid transparent;border-radius:6px;padding:6px 2px;font-size:11px;font-weight:700;color:#111}
#editor-ui .surfs button.on{border-color:#fff;box-shadow:0 0 0 1px #000 inset}
#editor-ui input[type=text],#editor-ui select{width:100%;background:#0f141d;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 6px;font-size:13px}
#editor-ui input[type=range]{width:100%}
#editor-ui .info{color:var(--muted);font-size:12px;line-height:1.4;margin-top:6px}
#editor-status{position:absolute;left:0;top:0;width:1280px;padding:6px 12px;background:rgba(10,13,19,.78);color:#dfe6f2;
  font-size:14px;display:none;z-index:5;pointer-events:none}
#editor-status.on{display:block}

/* Toast */
#toast{position:absolute;left:640px;top:60px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toastmsg{background:rgba(15,20,29,.95);border:1px solid var(--accent);color:#fff;padding:9px 18px;border-radius:9px;font-size:16px;font-weight:600;
  animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Dialog */
#dialog{position:absolute;inset:0;z-index:60;display:none;background:rgba(0,0,0,.55)}
#dialog.on{display:block}
#dialog .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:420px;max-width:620px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:22px}
#dialog .box p{margin:0 0 18px;font-size:16px;line-height:1.45;white-space:pre-line}
#dialog .acts{display:flex;justify-content:flex-end;gap:10px}
.keytbl td{padding:4px 10px 4px 0;font-size:14px}
.keytbl td:first-child{color:var(--muted)}
kbd{background:#0f141d;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:inherit;font-size:12px}

/* Karriere */
.moneybox{font-family:'Russo One',sans-serif;font-size:24px;color:#ffd23e;background:rgba(255,210,62,.08);border:1px solid rgba(255,210,62,.35);border-radius:8px;padding:4px 14px}
.lcard{background:rgba(21,27,38,.85);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.lcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lcard.locked{opacity:.55}
.lcard .lhead b{font-size:17px;margin-right:8px}
.lcard .evs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lcard .ev{font-size:12px;background:#0f141d;border:1px solid var(--line);border-radius:5px;padding:3px 7px;color:#c4ccd9}
.lcard .ev i{color:var(--accent);font-style:normal}
.lcard .ev.done{border-color:#2e6b4b;color:#8fe0b0}
.lcard .lact{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.gcar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(15,20,29,.8);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin-bottom:6px}
.gcar.on{border-color:var(--accent)}
.gcar.locked{opacity:.5}
.gcar .note{font-size:12px}
.gcar .btn{white-space:nowrap}
#scr-career .col{overflow-y:auto}
.tag.on{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.careermsg{background:rgba(255,210,62,.08);border:1px solid rgba(255,210,62,.3);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Touch-Steuerung */
#touch{position:absolute;left:0;top:0;width:1280px;height:800px;display:none;z-index:20;pointer-events:none;touch-action:none}
#touch.on{display:block}
#touch .tz{position:absolute;bottom:18px;height:230px;display:flex;gap:14px;pointer-events:auto;touch-action:none}
#tz-steer{left:18px;width:420px}
#tz-pedal{right:18px;width:440px}
#touch .tb{flex:1;border-radius:22px;background:rgba(10,14,20,.16);border:2px solid rgba(255,255,255,.22);color:rgba(255,255,255,.75);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 54px 'Chakra Petch',sans-serif;user-select:none;-webkit-user-select:none}
#tz-pedal .tb{font-size:30px;letter-spacing:2px}
#tz-pedal .tb small{font-size:13px;font-weight:500;opacity:.7;letter-spacing:0;margin-top:4px}
#touch .tb.gas{flex:1.3;border-color:rgba(70,214,138,.5)}
#touch .tb.on{background:rgba(255,106,43,.45);border-color:#ff6a2b;color:#fff}
#touch .tsmall{position:absolute;left:18px;width:84px;height:84px;border-radius:50%;pointer-events:auto;touch-action:none;background:rgba(10,14,20,.45);
  border:2px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;font:700 36px 'Chakra Petch',sans-serif;user-select:none;-webkit-user-select:none}
#t-pause{top:150px}
#t-reset{top:250px}
#t-cp{top:350px}
#t-item{top:auto;bottom:250px;left:auto;right:18px;display:none}#touch.pu #t-item{display:flex}
#touch .tsmall.on{background:rgba(255,106,43,.6)}
#stage,#game{touch-action:none}
#rotate{display:none}
@media (orientation: portrait) and (pointer: coarse){
  #rotate{display:flex;position:fixed;inset:0;z-index:100;background:#07090d;color:#e9eef6;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:600 22px 'Chakra Petch',sans-serif;text-align:center;padding:30px}
  #rotate b{font-size:64px}
}
.fsbtn{position:absolute;right:24px;top:20px}
.seg.small{flex-wrap:wrap}
</style>
</head>

<div id="rotate"><b>⟳</b>Bitte das Gerät quer halten.</div>
<div id="stage">
  <canvas id="game" width="1540" height="800"></canvas>
  <div id="editor-status"></div>
  <div id="editor-ui"></div>
  <div class="screen" id="scr-main"></div>
  <div class="screen" id="scr-setup"></div>
  <div class="screen" id="scr-results"></div>
  <div class="screen" id="scr-champ"></div>
  <div class="screen" id="scr-options"></div>
  <div class="screen" id="scr-board"></div>
  <div class="screen" id="scr-pause"></div>
  <div class="screen" id="scr-career"></div>
  <div id="toast"></div>
  <div id="dialog"><div class="box"><p id="dlg-text"></p><div class="acts" id="dlg-acts"></div></div></div>
  <input type="file" id="file-import" accept=".json,application/json" style="display:none">
</div>
<script>
'use strict';
/* =====================================================================
   1  GRUNDLAGEN
   ===================================================================== */
const VERSION = '1.7.2';
const W = 1280, H = 800;              // Weltgröße in Pixeln (eine Strecke = ein Bildschirm)
const PANEL = 260;                    // Breite der Seitenleiste
const CW = W + PANEL;                 // Canvas-Gesamtbreite
const CELL = 4;                       // Rasterzelle in Pixeln
const GW = W / CELL, GH = H / CELL;   // Rastergröße 320 x 200
const DT = 1 / 120;                   // fester Physikschritt
const LINE_STEP = 6;                  // Punktabstand der KI-Linie
const PIT_LIMIT = 95;                 // Tempolimit Boxengasse (px/s)
const LAT = 620;                      // Grundwert Seitenhaftung (px/s²)
const MAX_CARS = 8;
let RK = 1;                            // Zeichenauflösung der Bühne (wird in resize() gesetzt)

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
function wrapAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

/** Deterministischer Zufallsgenerator (für reproduzierbare Strecken). */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/** Ganzzahl-Hash → [0,1) für Bodentexturen. */
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
/** Weiches Wertrauschen für großflächige Farbvariationen. */
function vnoise(x, y, s) {
  const fx = x / s, fy = y / s, ix = Math.floor(fx), iy = Math.floor(fy);
  const tx = fx - ix, ty = fy - iy;
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
}
/** Zeitformat m:ss.mmm */
function fmtTime(sec) {
  if (sec == null || !isFinite(sec)) return '–:––.–––';
  const m = Math.floor(sec / 60), s = sec - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
}
/** Prüft, ob sich Strecke AB und CD schneiden. */
function segIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1x = bx - ax, d1y = by - ay, d2x = dx - cx, d2y = dy - cy;
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-9) return false;
  const t = ((cx - ax) * d2y - (cy - ay) * d2x) / den;
  const u = ((cx - ax) * d1y - (cy - ay) * d1x) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
/** Kleiner Wrapper um localStorage mit Fehlertoleranz. */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignorieren */ } }
};
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =====================================================================
   2  OBERFLÄCHEN
   ===================================================================== */

/** Oberflächenfamilie: Fahrbahn (0), Wasser (-1) oder eigene Familie. */
const surfFamily = s => isTrackSurf(s) ? 0 : (SURF[s].oob ? -1 : 10 + s);

function raycastEdge(t, x, y, dx, dy, fam, maxD = 150) {
  let last = 0, gap = 0;
  for (let d = 0; d <= maxD; d += 2) {
    const s = cellAt(t, x + dx * d, y + dy * d);
    if (SURF[s].oob && fam !== -1) break;
    if (surfFamily(s) === fam) { last = d; gap = 0; }
    else { gap += 2; if (gap > 24) break; }
  }

/** Checkpoint quer zur Linie an Index i. */
function checkpointAt(t, line, i) {
  const p = line[i], tg = tangentAt(line, i, true), nx = -tg.y, ny = tg.x;
  const fam = surfFamily(cellAt(t, p.x, p.y));
  const a = raycastEdge(t, p.x, p.y, nx, ny, fam), b = raycastEdge(t, p.x, p.y, -nx, -ny, fam);

/** Richtet eine gezeichnete Start-/Ziellinie quer zur KI-Linie aus und zieht sie über die volle Fahrbahnbreite. */

  if (dist(t.aiLine[i].x, t.aiLine[i].y, (c.x1 + c.x2) / 2, (c.y1 + c.y2) / 2) > 120) return;

  else snapStartLine(t);
  alignLineToStart(t);

  const n = clamp(Math.round(L / 260), 6, 24);

    let i = Math.round(k * N / n) % N;

  const mids = t.checkpoints.map(c => ({ x: (c.x1 + c.x2) / 2, y: (c.y1 + c.y2) / 2 }));

/** Startplätze hinter der Startlinie erzeugen (2 versetzte Reihen). */
function autoStart(t) {

  if (t.aiLine.length < 20) { const e = autoAiLine(t); if (e) return 'Für die Fahrtrichtung wird eine KI-Linie benötigt.'; }
  const c = t.checkpoints[0];
  const mx = (c.x1 + c.x2) / 2, my = (c.y1 + c.y2) / 2;
  const i0 = nearestIndex(t.aiLine, mx, my), tg = tangentAt(t.aiLine, i0, true);
  const nx = -tg.y, ny = tg.x;
  const half = Math.hypot(c.x2 - c.x1, c.y2 - c.y1) / 2;
  const lat = clamp(half * 0.45, 9, 18);
  const a = Math.atan2(tg.y, tg.x);

  for (let i = 0; i < MAX_CARS; i++) {
    const row = Math.floor(i / 2), side = (i % 2) ? 1 : -1;
    const back = 26 + row * 36 + (i % 2) * 18;

    if (acc <= L * 0.3) i0 = i;
    if (acc <= L * 0.7) i1 = i + 1;
    acc += d;
  }
  const a = path[i0], b = path[i1];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, w: Math.max(40, dist(a.x, a.y, b.x, b.y)), h: 22, a: Math.atan2(b.y - a.y, b.x - a.x) };

/** Prüft die Strecke auf Renntauglichkeit. Liefert Liste von Problemen. */
function validateTrack(t) {
  const p = [];
  if (!t.checkpoints.length) p.push('Start-/Ziellinie fehlt.');
  if (t.aiLine.length < 20 && t.checkpoints.length < 3) p.push('KI-Linie fehlt (zeichnen oder aus Checkpoints berechnen).');
  if (t.checkpoints.length < 3 && t.aiLine.length < 20) p.push('Mindestens 3 Checkpoints nötig.');
  // Jeder Checkpoint muss die KI-Linie kreuzen, sonst ist er für die KI unerreichbar
  if (t.aiLine.length >= 20) {
    const L = t.aiLine, n = L.length;
    t.checkpoints.forEach((c, k) => {
      let hit = false;
      for (let i = 0; i < n && !hit; i++) { const a = L[i], b = L[(i + 1) % n]; hit = segIntersect(a.x, a.y, b.x, b.y, c.x1, c.y1, c.x2, c.y2); }
      if (!hit) p.push((k === 0 ? 'Start-/Ziellinie' : 'Checkpoint ' + k) + ' kreuzt die KI-Linie nicht.');
    });
  }
  return p;

/** Ergänzt fehlende Automatik-Daten vor einem Rennen. */
function completeTrack(t) {
  if (t.aiLine.length < 20 && t.checkpoints.length >= 3) autoAiLine(t);
  if (t.checkpoints.length < 3 && t.aiLine.length >= 20) autoCheckpoints(t);
  if (t.start.length < MAX_CARS && t.checkpoints.length) {
    // Manuell gesetzte Startplätze behalten, fehlende automatisch ergänzen
    const manual = t.start.slice();
    if (!autoStart(t)) {
      const autos = t.start;
      t.start = manual.slice();
      for (const s of autos) {
        if (t.start.length >= MAX_CARS) break;
        if (t.start.every(m => dist(m.x, m.y, s.x, s.y) > 20)) t.start.push(s);
      }
    } else t.start = manual;
  }
}

    c.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 40; i++) c.fillRect(rng() * W, hz - 12 + rng() * 14, 6 + rng() * 12, 1);

  punk:   { kick: [0, 4, 8, 12], snare: [2, 6, 10, 14], hat: [0, 2, 4, 6, 8, 10, 12, 14], open: [], bass: [[0, 0, 1], [1, 0, 1], [2, 0, 1], [3, 0, 1], [4, 0, 1], [5, 0, 1], [6, 0, 1], [7, 0, 1], [8, 0, 1], [9, 0, 1], [10, 0, 1], [11, 0, 1], [12, 0, 1], [13, 0, 1], [14, 0, 1], [15, 0, 1]], lead: 0.55, arp: false, leadWave: 'sawtooth', pad: false, swing: 0 }

/** Ablauf in 8-Takt-Blöcken; nach dem Intro wird ab Index 1 wiederholt. */
const FORM = ['intro', 'A', 'B', 'A', 'break', 'B'];
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

const Music = {
  song: null, timer: null, step: 0, nextT: 0, pending: null, duck: 1, motif: null, delay: null,

  /** Stück für ein Rennen wählen (Derby eigenes Stück, sonst nach Umgebung mit etwas Zufall). */
  forRace(cfg, theme) {
    if (cfg.mode === 'derby') return 'derby';
    const byTheme = { snow: 'frost', desert: 'gravel', city: 'neon', meadow: 'drive', volcano: 'derby', beach: 'neon', quarry: 'gravel', alpine: 'frost' }[theme] || 'drive';
    if (Math.random() < 0.35) { const r = ['drive', 'neon', 'gravel', 'frost']; return r[Math.floor(Math.random() * r.length)]; }
    return byTheme;
  },
  play(id) {
    const o = Options.data;
    if (!Sound.ctx) { this.pending = id; return; }
    if (this.song && this.song.id === id && this.timer) return;
    this.stop();
    if (!o.music) { this.pending = id; return; }
    const S0 = SONGS.find(s => s.id === id) || SONGS[0];
    this.song = S0; this.pending = null;
    this.st = STYLES[S0.style]; this.scale = SCALES[S0.scale];
    this.spb = 60 / S0.bpm / 4;                       // Sekunden je Sechzehntel
    this.step = 0; this.nextT = Sound.now() + 0.12;
    this.makeMotif();
    if (!this.delay) {
      const ac = Sound.ctx;
      this.delay = ac.createDelay(1); this.fb = ac.createGain(); this.wet = ac.createGain();
      this.delay.connect(this.fb); this.fb.connect(this.delay); this.delay.connect(this.wet); this.wet.connect(Sound.musicBus);
      this.fb.gain.value = 0.32; this.wet.gain.value = 0.35;
    }
    this.delay.delayTime.value = this.spb * 3;
    this.timer = setInterval(() => this.tick(), 25);
    Sound.applyVolume();
  },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.song = null; },
  /** Nach Ein-/Ausschalten in den Optionen. */
  refresh() { if (!Options.data.music) { const id = this.song ? this.song.id : this.pending; this.stop(); this.pending = id; } else if (this.pending) this.play(this.pending); Sound.applyVolume(); },
  setDuck(d) { this.duck = d; Sound.applyVolume(); },
  makeMotif() {
    // Zwei Takte Melodie: Rhythmus und Akkordton-Index (folgt später den Akkorden)
    const rng = mulberry32(this.song.seed * 977), dens = this.st.lead, m = [];
    let idx = 2;
    for (let s = 0; s < 32; s++) {
      const strong = s % 4 === 0, p = strong ? dens + 0.25 : s % 2 === 0 ? dens : dens * 0.35;
      if (rng() < p) {

        m.push({ s, idx, len, pass: !strong && rng() < 0.25 });

  },
  /** Ton aus der Tonleiter: Stufe deg (beliebig groß), Basisnote root. */
  note(deg) { const sc = this.scale, o = Math.floor(deg / 7), d = ((deg % 7) + 7) % 7; return this.song.root + o * 12 + sc[d]; },
  tick() {

      this.step++;
      const sw = this.st.swing || 0;
      this.nextT += this.spb * (1 + (this.step % 2 === 1 ? sw : -sw));     // Swing: lang-kurz

  playStep(step, t) {

  out() { return Sound.musicBus; },
  env(g, t, a, peak, d, end = 0.0001) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(end, t + a + d); },
  kick(t, v) {

  },
  hat(t, v, open) {
    const ac = Sound.ctx, n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = Sound.noiseBuf; f.type = 'highpass'; f.frequency.value = 7200;

  },
  bass(t, m, dur) {
    const ac = Sound.ctx, o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = midiHz(m); o2.frequency.value = midiHz(m - 12);
    f.type = 'lowpass'; f.Q.value = 6; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(220, t + Math.min(0.25, dur));
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.005); g.gain.setValueAtTime(0.2, t + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.out()); o.start(t); o2.start(t); o.stop(t + dur + 0.06); o2.stop(t + dur + 0.06);
  },
  pad(t, notes, dur, v) {
    const ac = Sound.ctx, f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.4); g.gain.setValueAtTime(v, t + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
    f.connect(g); g.connect(this.out());
    for (const m of notes) for (const dt of [-8, 8]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midiHz(m); o.detune.value = dt; o.connect(f); o.start(t); o.stop(t + dur + 0.3); }
  },
  power(t, m, dur) {
    // Verzerrter Powerchord (Rock/Punk)
    const ac = Sound.ctx, f = ac.createBiquadFilter(), g = ac.createGain(), sh = ac.createWaveShaper();
    sh.curve = Sound.shaperCurve(4); f.type = 'lowpass'; f.frequency.value = 2200;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.01); g.gain.setValueAtTime(0.045, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    sh.connect(f); f.connect(g); g.connect(this.out());
    for (const k of [0, 7, 12]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midiHz(m + k); o.detune.value = (Math.random() - 0.5) * 12; o.connect(sh); o.start(t); o.stop(t + dur + 0.05); }
  },
  pluck(t, m, v) {
    const ac = Sound.ctx, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = midiHz(m); f.type = 'lowpass'; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.12);
    this.env(g, t, 0.003, v, 0.14); o.connect(f); f.connect(g); g.connect(this.out()); g.connect(this.delay); o.start(t); o.stop(t + 0.2);
  },
  lead(t, m, dur) {
    const ac = Sound.ctx, wave = this.st.leadWave, f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = wave === 'triangle' ? 3000 : 2400; f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.01); g.gain.setValueAtTime(0.05, t + Math.max(0.02, dur - 0.03)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);
    f.connect(g); g.connect(this.out()); g.connect(this.delay);
    for (const dt of [-6, 6]) {
      const o = ac.createOscillator(); o.type = wave; o.frequency.value = midiHz(m); o.detune.value = dt;
      const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 5.5; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(dur > 0.25 ? 7 : 0, t + dur);
      vib.connect(vg); vg.connect(o.detune);
      o.connect(f); o.start(t); vib.start(t); o.stop(t + dur + 0.1); vib.stop(t + dur + 0.1);
    }
  }
};

   ===================================================================== */
const Speaker = {
  last: {}, voice: null, busyT: 0,
  ok() { return typeof speechSynthesis !== 'undefined' && Options.data.commentary === true && Options.data.sound; },
  /** Deutsche Stimmen, männliche und natürliche zuerst. */
  voices() {
    if (typeof speechSynthesis === 'undefined') return [];
    const MALE = /conrad|killian|florian|jonas|stefan|markus|yannick|viktor|martin|hans|klaus|thomas|ralf|bernd|male|mann/i;
    const FEMALE = /katja|amala|seraphina|ingrid|hedda|anna|petra|helena|marlene|vicki|female|frau|google deutsch/i;
    const vs = (speechSynthesis.getVoices() || []).filter(v => /^de/i.test(v.lang));
    const score = v => (MALE.test(v.name) ? 100 : FEMALE.test(v.name) ? 0 : 40) + (/natural|online|neural|premium|enhanced/i.test(v.name) ? 20 : 0) + (/de-(DE|AT)/i.test(v.lang) ? 3 : 0);
    return vs.map(v => ({ v, male: MALE.test(v.name), female: FEMALE.test(v.name), score: score(v) })).sort((a, b) => b.score - a.score);
  },
  pickVoice() {
    if (this.voice) return this.voice;
    const list = this.voices(), want = Options.data.voiceName;
    const hit = want && list.find(x => x.v.name === want);
    const best = hit || list[0];
    this.voice = best ? best.v : null;
    this.female = best ? !best.male && (best.female || !hit) && !best.male : false;
    return this.voice;
  },
  /** Ansage; key + gap verhindern Wiederholungen, prio 2 unterbricht laufende Ansagen. */
  say(text, key = text, gap = 5, prio = 1) {
    if (!this.ok()) return;
    const now = performance.now() / 1000;
    if (this.last[key] && now - this.last[key] < gap) return;
    if (prio < 2 && speechSynthesis.speaking && now < this.busyT) return;
    this.last[key] = now;
    try {
      if (prio >= 2) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; const v = this.pickVoice(); if (v) u.voice = v;
      u.rate = 1.12; u.pitch = this.female ? 0.72 : 0.95;      // keine männliche Stimme vorhanden → tiefer sprechen u.volume = Math.min(1, (Options.data.volume || 70) / 100 + 0.2);
      speechSynthesis.speak(u); this.busyT = now + 2.2;
    } catch (e) { /* Sprachausgabe nicht verfügbar */ }
  },
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  stop() { try { if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel(); } catch (e) { /* egal */ } }
};
if (typeof speechSynthesis !== 'undefined') try { speechSynthesis.onvoiceschanged = () => { Speaker.voice = null; Speaker.pickVoice(); if (typeof UI !== 'undefined' && UI.current === 'scr-options') UI.options(); }; } catch (e) { /* egal */ }
/* =====================================================================
   8b  TOUCH-STEUERUNG (Handy/Tablet)
   Links: Lenken (Finger links/rechts der Mitte), rechts: Bremse | Gas. Mehrere Finger gleichzeitig.
   Oben links: Pause, darunter Reset. Nur für Spieler 1.
   ===================================================================== */
const Touch = {
  active: false, el: null, state: { up: false, down: false, left: false, right: false, reset: false, cp: false, item: false }, ptr: new Map(),
  /** Touch-Gerät erkannt? */
  detect() { try { return (navigator.maxTouchPoints || 0) > 0 || matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } },
  /** Einstellung: 0 = automatisch, 1 = immer an, 2 = aus */
  enabled() { const m = Options.data.touch || 0; return m === 1 || (m === 0 && this.detect()); },
  init() {
    const el = document.createElement('div'); el.id = 'touch';
    el.innerHTML = `<div class="tz" id="tz-steer"><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div>
      <div class="tz" id="tz-pedal"><div class="tb" data-k="down">BREMSE<small>Box: Tanken</small></div><div class="tb gas" data-k="up">GAS</div></div>
      <div class="tsmall" id="t-pause">Ⅱ</div><div class="tsmall" id="t-reset">↺</div><div class="tsmall" id="t-cp">⚑</div><div class="tsmall" id="t-item">⚡</div>`;
    $('stage').appendChild(el); this.el = el;
    // Zonen: welcher Knopf liegt unter dem Finger? (Finger dürfen zwischen Knöpfen gleiten)
    const zoneKey = (zone, e) => {
      const r = zone.getBoundingClientRect(), u = (e.clientX - r.left) / r.width;
      return zone.id === 'tz-steer' ? (u < 0.5 ? 'left' : 'right') : (u < 0.45 ? 'down' : 'up');
    };
    for (const zone of el.querySelectorAll('.tz')) {
      const down = e => { e.preventDefault(); Sound.init(); try { zone.setPointerCapture(e.pointerId); } catch (er) { /* ohne Capture weiter */ } this.ptr.set(e.pointerId, zoneKey(zone, e)); this.sync(); };
      const move = e => { if (!this.ptr.has(e.pointerId)) return; e.preventDefault(); this.ptr.set(e.pointerId, zoneKey(zone, e)); this.sync(); };
      const up = e => { this.ptr.delete(e.pointerId); this.sync(); };
      zone.addEventListener('pointerdown', down); zone.addEventListener('pointermove', move);
      zone.addEventListener('pointerup', up); zone.addEventListener('pointercancel', up); zone.addEventListener('lostpointercapture', up);
    }
    $('t-pause').addEventListener('pointerdown', e => { e.preventDefault(); if (Game.paused) Game.resume(); else Game.pause(); });
    const cpb = $('t-cp');
    cpb.addEventListener('pointerdown', e => { e.preventDefault(); this.state.cp = true; cpb.classList.add('on'); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) cpb.addEventListener(ev, () => { this.state.cp = false; cpb.classList.remove('on'); });
    const itb = $('t-item');
    itb.addEventListener('pointerdown', e => { e.preventDefault(); this.state.item = true; itb.classList.add('on'); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) itb.addEventListener(ev, () => { this.state.item = false; itb.classList.remove('on'); });
    const rs = $('t-reset');
    rs.addEventListener('pointerdown', e => { e.preventDefault(); this.state.reset = true; rs.classList.add('on'); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) rs.addEventListener(ev, () => { this.state.reset = false; rs.classList.remove('on'); });
  },
  sync() {
    const k = new Set(this.ptr.values()), s = this.state;
    s.up = k.has('up'); s.down = k.has('down'); s.left = k.has('left'); s.right = k.has('right');
    for (const b of this.el.querySelectorAll('.tb')) b.classList.toggle('on', k.has(b.dataset.k));
  },
  /** Jedes Bild: Overlay nur im laufenden Rennen mit Spieler zeigen. */
  update() {
    if (!this.el) return;
    const show = this.enabled() && Game.state === 'race' && !!Game.race && Game.race.cars.some(c => c.human === 0) && !Game.paused;
    if (show !== this.active) {
      this.active = show; this.el.classList.toggle('on', show); this.el.classList.toggle('pu', show && !!Game.race.powerups);
      if (!show) { this.ptr.clear(); this.sync(); this.state.reset = false; }
    }
  }
};

/** Rand, auf dem ein Randpunkt liegt, als Richtung nach außen. */
function edgeDir(p) { return p[0] <= 0 ? [-1, 0] : p[0] >= W ? [1, 0] : p[1] <= 0 ? [0, -1] : [0, 1]; }

  const x0 = -RALLY_M, y0 = -RALLY_M, x1 = W + RALLY_M, y1 = H + RALLY_M, w = x1 - x0, h = y1 - y0;
  const dl = x - x0, dr = x1 - x, dt = y - y0, db = y1 - y, m = Math.min(dl, dr, dt, db);

function getRallySection(stage, k) {
  const key = stage.id + '_' + k;

  const sec = stage.sections[k];

  };

    }).join('');

    const board = top.map((r, i) => `<tr class="${r === rec ? 'me' : ''}"><td class="pos">${i + 1}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.cls)}</td><td>${fmtTime(r.time)}</td><td class="note">${r.date}</td></tr>`).join('');

      <div class="cols"><div class="col" style="flex:1;height:560px"><h3>Deine Fahrt</h3><table class="tbl"><tr><th></th><th>Abschnitt</th><th>Zeit</th><th>zur Bestzeit</th></tr>${rows}</table></div>

      <div class="startbar"><button class="btn" data-act="menu">Hauptmenü</button><button class="btn" data-act="setup">Andere Etappe</button><button class="btn primary big" data-act="again">Nochmal fahren ▶</button></div></div>`;

  /* ---------- Auswahl-Bildschirm ---------- */

  uiAct(act, v) {

    if (act === 'back') { Options.save(); UI.mode = 'quick'; UI.main(); return; }

    if (act === 'rstage') this.sel = +v;
    else if (act === 'cls0') p.cls = +v;
    else if (act === 'color0') p.color = +v;
    else if (act === 'rwx') st.rallyWx = +v;

/* =====================================================================
   11  RENNEN: Countdown, Checkpoints, Positionen, Boxendienst, Ziel, Rekorde, Ghost
   ===================================================================== */
let race = null;
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];

/** Bestenliste je Strecke (Top 10 Runden). Gibt Platz (1-basiert) oder 0 zurück. */
function addRecord(trackId, rec) {
  const k = 'cr_lb_' + trackId, list = store.get(k, []);
  list.push(rec); list.sort((a, b) => a.time - b.time);
  const top = list.slice(0, 10); store.set(k, top);
  const i = top.indexOf(rec);
  return i >= 0 ? i + 1 : 0;
}
const getRecords = id => store.get('cr_lb_' + id, []);
/** Zoomstufe der Kamera laut Optionen (1 = aus). */
const CAM_ZOOM = [1, 1.55, 2.1];
const camZoom = () => CAM_ZOOM[Options.data.camera != null ? Options.data.camera : 1] || 1;
/** Auflösung der vorberechneten Szene: so fein, dass sie auf dem Bildschirm (Bühnen-Skalierung × Pixeldichte × Zoom) scharf bleibt. */
function sceneRes(solo, demo) {
  const z = solo && !demo && camZoom() > 1 ? camZoom() : 1;
  const max = demo ? 2 : Touch.detect() ? 2 : 3;
  return clamp(Math.ceil(RK * z - 0.2), 1, max);
}
/** Szene neu in höherer Auflösung bauen, falls die aktuelle nicht mehr reicht (Zoom/Fenstergröße geändert). */
function cycleCameraRes(race) {
  const need = sceneRes(race.cars.filter(c => c.human >= 0).length === 1, race.mode === 'demo');
  if (need <= race.layers.rs) return;
  const old = race.skid;
  const flags = race.layers.dyn.filter(o => o.t === 'cpflag');
  race.layers = buildScene(race.rt.src, race.rt, { checkpoints: Options.data.showCps && race.mode !== 'demo', rs: need }, race.weather);
  race.layers.dyn.push(...flags);
  race.skid = document.createElement('canvas'); race.skid.width = W * need; race.skid.height = H * need;
  race.skidCtx = race.skid.getContext('2d'); race.skidCtx.drawImage(old, 0, 0, W * need, H * need); race.skidCtx.setTransform(need, 0, 0, need, 0, 0);
}
/** Kamera im Rennen umschalten (Taste C / Pausenmenü); Szene bei Bedarf in hoher Auflösung neu bauen. */
function cycleCamera(race) {
  const o = Options.data; o.camera = ((o.camera != null ? o.camera : 1) + 1) % CAM_ZOOM.length; Options.save();
  if (race) { cycleCameraRes(race); race.cam = null; }
  toast('Kamera: ' + ['Ganze Strecke (Zoom aus)', 'Folgen', 'Nah'][o.camera]);
}

/**
 * Erzeugt ein neues Rennen.
 * cfg: { mode: 'quick'|'trial'|'champ'|'test'|'demo', trackId | track, laps, ai, diff, players:[{name,cls,color}], rules }
 */
function createRace(cfg) {
  const src = cfg.track || getTrack(cfg.trackId);
  const rt = prepareTrack(src);
  // Wetter und Tageszeit
  const wx = { sky: 'clear', time: 'day', ...(cfg.weather || {}) };
  wx.snow = wx.sky === 'rain' && rt.theme === 'snow';
  rt.weather = wx;
  if (wx.sky === 'rain' && !wx.snow) {
    const rng = mulberry32(rt.n * 7 + 3);
    rt.puddles = [];
    for (let k = 0; k < 40 && rt.puddles.length < 9; k++) {
      const i = Math.floor(rng() * rt.n);
      if (rt.lvl[i] || rt.cum[i] < 120) continue;
      const off = (rng() - 0.5) * 30, x = rt.lx[i] - rt.ty[i] * off, y = rt.ly[i] + rt.tx[i] * off;
      if (cellAt(rt.src, x, y) !== S.ASPHALT || rt.puddles.some(p => dist(p.x, p.y, x, y) < 120)) continue;
      rt.puddles.push({ x, y, r: 12 + rng() * 10, a: rng() * 3 });
    }
  }
  // Zoom-Kamera (nur allein): Szene in doppelter Auflösung, damit sie vergrößert scharf bleibt
  const rs = sceneRes(cfg.players.length === 1, cfg.mode === 'demo');
  const layers = buildScene(rt.src, rt, { checkpoints: Options.data.showCps && cfg.mode !== 'demo', rs }, wx);
  const skid = document.createElement('canvas'); skid.width = W * rs; skid.height = H * rs;
  const skidCtx = skid.getContext('2d'); skidCtx.setTransform(rs, 0, 0, rs, 0, 0);
  const R = {
    cfg, mode: cfg.mode, rt, layers, skid, skidCtx, rules: { ...cfg.rules }, laps: cfg.laps, weather: wx,
    trackId: src.id, trackName: src.name, cars: [], state: 'countdown', time: 0, cd: 3.99, lastBeep: 4, t: 0,
    firstFinishT: null, lastHumanFinishT: null, finishOrder: [], passLog: new Map(), audible: cfg.mode !== 'demo',
    endT: 0, results: null, ghost: null, banner: null
  };
  R.career = !!cfg.career;
  if (cfg.mode === 'derby') {
    // Demolition Derby: nur Schaden zählt, kein Sprit/Reifen/Boxen
    R.rules = { fuelOn: false, fuelPct: 100, tireOn: false, tirePct: 100, dmgOn: true, dmgPct: (cfg.rules && cfg.rules.dmgPct) || 100, pits: false };
    R.timeLimit = cfg.timeLimit || 180; R.laps = 1;
    R.arena = getArenaDef(src.id) || { cx: W / 2, cy: H / 2, rx: 500, ry: 300 };
    R.onCarHit = derbyHit;
  }
  if (!R.rules.pits || !rt.pit) R.rules.pits = false;
  // Fahrer anlegen
  const entries = [];
  cfg.players.forEach((p, i) => entries.push({ name: p.name, color: p.color, cls: CLASSES[p.cls], human: i }));
  const usedCols = new Set(cfg.players.map(p => p.color));
  const names = AI_NAMES.slice().sort(() => Math.random() - 0.5);
  const freeCols = COLORS.filter(c => !usedCols.has(c));
  for (let i = 0; i < cfg.ai; i++) {
    const diff = Array.isArray(cfg.diff) ? cfg.diff[i % cfg.diff.length] : cfg.diff;
    if (cfg.aiRoster && cfg.aiRoster[i]) {
      const a = cfg.aiRoster[i];
      entries.push({ name: a.name, color: a.color, cls: CLASSES[a.cls], human: -1, diff, ri: i });
      continue;
    }
    const cls = cfg.aiCls != null ? CLASSES[cfg.aiCls] : CLASSES[Math.floor(Math.random() * CLASSES.length)];
    entries.push({ name: names[i % names.length], color: freeCols[i % freeCols.length], cls, human: -1, diff, ri: i });
  }
  // Startaufstellung: Menschen hinten (fair für Einsteiger) außer im Zeitfahren, sonst gemischt
  const order = entries.slice().sort(() => Math.random() - 0.5);
  order.forEach((e, k) => {
    const c = makeCar({ id: k, name: e.name, color: e.color, cls: e.cls, human: e.human });
    c.ri = e.ri;
    const sp = rt.start[k % rt.start.length];
    const pr = projectLine(rt, sp.x, sp.y, null, 0);
    placeOnLine(c, rt, sp.x, sp.y, sp.a, pr.i);
    c.idx = pr.i; c.s = pr.s; c.lastValidS = pr.s;
    if (e.human < 0) c.ai = makeAI(c, e.diff);
    R.cars.push(c);
  });
  // Checkpoint-Fahnen (dynamisch, damit der nächste Checkpoint hervorgehoben werden kann)
  if (cfg.mode !== 'derby') rt.cps.forEach((c, k) => {
    if (k === 0) return;
    for (const [x, y] of [[c.x1, c.y1], [c.x2, c.y2]]) {
      if (SURF[cellAt(rt.src, x, y)].oob) continue;
      const o = { t: 'cpflag', x, y, a: 0, w: 4, h: 4, k, zb: terrainH(rt.src, x, y) };
      R.layers.dyn.push(o);
    }
  });
  if (cfg.mode === 'elim') { R.laps = Math.max(1, R.cars.length - 1); R.elimDone = 0; }
  R.outCount = 0;
  // Ghost laden (nur Zeitfahren)
  if (cfg.mode === 'trial') R.ghost = store.get('cr_ghost_' + src.id, null);
  // Power-ups: nur als Regel in Rennen/Ausscheidung/Championship, nie in der Karriere
  if (cfg.mode === 'rally') { R.trackName = Rally.cur ? Rally.cur.stage.name : src.name; R.secInfo = Rally.cur ? { k: Rally.cur.sec, n: Rally.cur.stage.sections.length } : null; }
  R.powerups = !!R.rules.powerups && !R.career && ['quick', 'elim', 'champ', 'test'].includes(cfg.mode);
  R.pads = []; R.boxes = []; R.slicks = [];
  if (R.powerups) PU.setup(R);
  Particles.clear();
  return R;
}

/** Fortschrittsschlüssel: (abgeschlossene Runden) + Anteil der aktuellen Runde, gedeckelt durch den nächsten Checkpoint. */
function progressKey(car, rt, race) {
  if (car.gaveUp) return -5000;
  if (car.out) return -1000 - car.outPlace;
  if (race && race.mode === 'derby') return car.finished ? 1e6 : 200 - car.damage;
  if (car.finished) return 1e6 - car.finishOrder;
  let frac = car.s / rt.L;
  if (car.nextCp === 0) { if (frac < 0.5) frac = 1; }
  else {
    if (car.nextCp === 1 && frac > 0.75) frac = 0;
    const cap = rt.cps[car.nextCp].frac + 0.01;
    if (frac > cap) frac = cap;
  }
  return (car.lap - 1) + frac;
}

/** Checkpoint k korrekt durchfahren. */
function passCheckpoint(car, k, race) {
  const rt = race.rt, n = rt.cps.length;
  const lapKey = car.lap;
  if (k === 0) {
    if (car.lap === 0) { car.lap = 1; car.lapStart = 0; car.fuelAtLap = car.fuel; }
    else completeLap(car, race);
  }
  if (car.finished) return;
  car.nextCp = (k + 1) % n;
  if (k > 0 && car.human >= 0 && race.audible) Sound.beep(1180, 0.06, 'triangle', 0.08);
  // Abstand zum Führenden über das Durchfahrts-Protokoll
  const key = (k === 0 ? car.lap : lapKey) + '_' + k;
  if (race.passLog.has(key)) car.lastPass = race.t - race.passLog.get(key);
  else { race.passLog.set(key, race.t); car.lastPass = 0; }
}
function completeLap(car, race) {
  const lt = race.t - car.lapStart;
  car.lapTimes.push(lt);
  const isBest = car.best == null || lt < car.best;
  if (isBest) car.best = lt;
  car.lapStart = race.t;
  const human = car.human >= 0;
  if (human && race.mode !== 'demo' && race.mode !== 'test') {
    const rank = addRecord(race.trackId, { name: car.name, time: lt, cls: car.cls.name, date: new Date().toLocaleDateString('de-AT'), mode: race.mode });
    if (rank === 1) { flashMsg(car, 'STRECKENREKORD!', '#ffd23e'); Speaker.say(Speaker.pick(['Neuer Streckenrekord!', 'Rekordrunde! Unglaublich!', 'Das ist ein neuer Streckenrekord!']), 'rec', 8, 2); }
    else if (isBest && car.lapTimes.length > 1) flashMsg(car, 'Persönliche Bestzeit', '#46d68a');
    Sound.lap(rank === 1 || isBest);
  }
  // Ghost speichern
  if (race.mode === 'trial' && human) {
    const fr = car.ghostFrames;
    if (fr.length > 10 && (!race.ghost || lt < race.ghost.time)) {
      race.ghost = { time: lt, color: car.color, cls: car.cls.id, frames: fr.slice(), z: (car.ghostZ || []).slice() };
      store.set('cr_ghost_' + race.trackId, race.ghost);
    }
  }
  // KI merkt sich den Spritverbrauch der letzten Runde (für die Boxenstrategie)
  if (car.ai && car.fuelAtLap != null && car.fuelAtLap > car.fuel) car.ai.fuelLap = car.fuelAtLap - car.fuel;
  car.fuelAtLap = car.fuel;
  car.ghostFrames = []; car.ghostZ = []; car.ghostAcc = 0;
  if (race.mode === 'elim') {
    car.lap++;
    // Der Erste, der diese Runde beendet, löst das Ausscheiden des Letzten aus
    if (car.lapTimes.length > race.elimDone) {
      race.elimDone = car.lapTimes.length;
      const act = race.cars.filter(c => !c.out && !c.finished);
      const last = act.filter(c => c !== car).sort((a, b) => a.key - b.key)[0];
      if (last) eliminate(last, race, 'AUSGESCHIEDEN');
      const rest = race.cars.filter(c => !c.out && !c.finished);
      if (rest.length === 1) finishCar(rest[0], race);
    }
    return;
  }
  if (car.lapTimes.length >= race.laps) finishCar(car, race);
  else car.lap++;
}
/** Auto scheidet aus (Ausscheidungsrennen) bzw. ist ein Wrack (Derby). */
function eliminate(car, race, why) {
  const active = race.cars.filter(c => !c.out && !c.finished).length;
  car.out = true; car.outPlace = active; car.finished = true; car.finishT = race.t; car.outT = race.t;
  race.outCount++;
  car.service = { q: [], cur: null, t: 0, dur: 0 };
  if (race.mode === 'derby') { car.wreck = true; car.thr = 0; car.damage = 100; }
  else car.alpha = 0.3;
  if (race.audible) Speaker.say(race.mode === 'derby' ? car.name + ' ist erledigt!' : car.name + ' ist ausgeschieden.', 'out' + car.id, 30, car.human >= 0 ? 2 : 1);
  if (car.human >= 0) {
    flashMsg(car, why + ' – Platz ' + active, '#ff8a3d');
    if (!car.wreck) car.ai = makeAI(car, 0);
  }
  if (race.audible) Sound.crash(0.6);
  Particles.sparks(car.x, car.y, 12, car.z);
}
/** Derby: Treffer zählen, Frontaufprall schont den Angreifer. */
function derbyHit(A, B, vn) {
  const race = this;
  for (const [me, other] of [[A, B], [B, A]]) {
    if (me.out) continue;
    const dx = other.x - me.x, dy = other.y - me.y, d = Math.hypot(dx, dy) || 1;
    const front = (Math.cos(me.a) * dx + Math.sin(me.a) * dy) / d;
    const imp = vn * 0.85 * other.cls.mass;
    if (imp < 45) continue;
    const dmg = (imp - 45) * 0.085 * 0.7 * me.cls.dmgMul * race.rules.dmgPct / 100;
    if (front > 0.55) {
      me.damage = Math.max(0, me.damage - dmg * 0.6);          // Frontpartie hält mehr aus
      if (!other.wreck && dmg > 1.5 && race.time - (me.lastHitT || 0) > 0.5) { me.hits = (me.hits || 0) + 1; me.lastHitT = race.time; }
    } else if (front < -0.2) me.damage = Math.min(100, me.damage + dmg * 0.3);   // Heck/Seite empfindlicher
  }
}
function finishCar(car, race) {
  car.finished = true; car.finishT = race.t; car.finishOrder = race.finishOrder.length; race.finishOrder.push(car);
  if (race.firstFinishT == null) race.firstFinishT = race.t;
  car.alpha = 0.55; car.service = { q: [], cur: null, t: 0, dur: 0 };
  if (car.human >= 0) {
    race.lastHumanFinishT = race.t;
    flashMsg(car, race.mode === 'rally' ? 'ZIEL!' : car.finishOrder === 0 ? 'SIEG!' : 'IM ZIEL – Platz ' + (car.finishOrder + 1), '#ffffff');
    if (race.mode !== 'trial' && race.mode !== 'rally') Speaker.say(car.finishOrder === 0 ? Speaker.pick(['Sieg für ' + car.name + '!', car.name + ' gewinnt! Was für ein Rennen!', 'Und der Sieger heißt ' + car.name + '!']) : car.name + Speaker.pick([' ist im Ziel, Platz ' + (car.finishOrder + 1) + '.', ' kommt als ' + (car.finishOrder + 1) + '. ins Ziel.']), 'fin' + car.id, 30, 2);
    Sound.finish();
    car.ai = makeAI(car, 1);
  }
}
function flashMsg(car, text, color) { car.msg = text; car.msgCol = color; car.msgT = 2.5; }

/** Ein Physik-Schritt des Rennens. */
function updateRace(race, dt) {
  const rt = race.rt;
  race.time += dt;
  if (race.state === 'countdown') {
    race.cd -= dt;
    const sec = Math.ceil(race.cd);
    if (sec < race.lastBeep && sec >= 1 && sec <= 3) { race.lastBeep = sec; if (race.audible) Sound.countdown(false); }
    if (race.cd <= 0) {
      race.state = 'running'; race.t = 0; race.goT = 1.2;
      if (race.audible && race.mode !== 'demo') Speaker.say(race.mode === 'derby' ? Speaker.pick(['Auf geht\'s, Blech verbiegen!', 'Die Arena bebt – und los!', 'Möge das stärkste Blech gewinnen!']) : Speaker.pick(['Und los geht\'s!', 'Grün! Das Feld setzt sich in Bewegung!', 'Die Ampel ist aus – los!', 'Start frei, und alle geben Vollgas!']), 'go', 3, 2);
      if (race.audible) Sound.countdown(true);
    }
  } else if (race.state === 'running' || race.state === 'ending') {
    race.t += dt;
    if (race.goT > 0) race.goT -= dt;
  }
  const running = race.state === 'running' || race.state === 'ending';

  updateDraft(race.cars);
  // --- Steuerung + Physik ---
  for (const car of race.cars) {
    let inp = { thr: 0, brk: 0, steer: 0, edge: {} };
    if (car.human >= 0 && !car.finished) {
      inp = Input.read(car.human);
      if (inp.pause && race.mode !== 'demo') Game.pause();
      if (inp.edge.reset && running) { resetCar(car, race); if (race.mode === 'derby') car.damage = Math.min(99, car.damage + 8); }
      else if (inp.edge.cp && running) { resetToCheckpoint(car, race); if (race.mode === 'derby') car.damage = Math.min(99, car.damage + 8); }
      if (inp.edge.item && running && race.powerups) PU.use(car, race);
    } else if (car.ai) inp = aiControl(car, race, dt);
    if (!running) { car.thr = inp.thr; inp = { thr: 0, brk: 0, steer: 0, edge: {} }; }

    // Boxendienst
    car.inBox = !!(race.rules.pits && rt.pit && inBoxRect(rt.pit.box, car.x, car.y));
    if (car.inBox && running && car.human >= 0 && !car.finished && Math.abs(fwdSpeed(car)) < 12) {
      if (inp.edge.left) queueService(car, 'repair', race);
      if (inp.edge.down) queueService(car, 'fuel', race);
      if (inp.edge.right) queueService(car, 'tires', race);
    }
    if (updateService(car, dt, race)) { car.prevX = car.x; car.prevY = car.y; car.thr = 0; continue; }

  }
  if (race.powerups) PU.update(race, dt);
  for (const car of race.cars) if (car.sink <= 0) collideObjects(car, race);
  collideCars(race.cars, race);

  // --- Rennlogik je Auto ---
  for (const car of race.cars) {
    // Checkpoints nur in der richtigen Reihenfolge und Richtung
    if (running && !car.finished && car.sink <= 0 && race.mode !== 'derby') {
      const cp = rt.cps[car.nextCp];
      const mx = car.x - car.prevX, my = car.y - car.prevY;
      if ((mx || my) && mx * cp.nx + my * cp.ny > 0 && segIntersect(car.prevX, car.prevY, car.x, car.y, cp.x1, cp.y1, cp.x2, cp.y2)) passCheckpoint(car, car.nextCp, race);

    const pr = projectLine(rt, car.x, car.y, car.idx, car.level);
    car.idx = pr.i; car.s = pr.s;
    if (!SURF[car.surf].oob && !car.air && pr.d < 60 && !car.wrong && car.sink <= 0 && (rt.lvl[pr.i] || 0) === car.level) car.lastValidS = car.s;

    car.wrong = car.wrongT > 1.0;
    car.key = progressKey(car, rt, race);
    // Checkpoint ausgelassen? (deutlich hinter dem nächsten Checkpoint, ohne ihn durchfahren zu haben)
    if (car.human >= 0 && running && !car.finished && car.nextCp > 0 && race.mode !== 'derby') {
      const f = car.s / rt.L, cf = rt.cps[car.nextCp].frac;
      const was = car.missedCp; car.missedCp = f > cf + 0.035 && f < cf + 0.5;
      if (car.missedCp && !was) { flashMsg(car, 'CHECKPOINT VERPASST – zurück!', '#ffcd32'); if (race.audible) Sound.beep(330, 0.25, 'square', 0.12); }
      // Nach 5 s automatisch vor den verpassten Checkpoint zurücksetzen
      if (car.missedCp && car.freeze <= 0 && car.sink <= 0) {
        const before = car.missedT || 0; car.missedT = before + dt;
        if (race.audible && Math.ceil(5 - car.missedT) < Math.ceil(5 - before) && car.missedT < 5) Sound.beep(520, 0.07, 'triangle', 0.07);
        if (car.missedT >= 5) {
          const k = car.nextCp; car.missedT = 0; car.missedCp = false;
          resetCar(car, race, rt.cps[k].frac * rt.L - 45);
          flashMsg(car, 'Zurück vor Checkpoint ' + k, '#8fd8ff');
        }
      } else if (!car.missedCp) car.missedT = 0;
    } else { car.missedCp = false; car.missedT = 0; }

    if (car.msgT > 0) car.msgT -= dt;

    if (race.mode === 'trial' && car.human >= 0 && car.lap >= 1 && running && !car.finished) {
      car.ghostAcc += dt;
      while (car.ghostAcc >= 1 / 30) { car.ghostAcc -= 1 / 30; car.ghostFrames.push(r1(car.x), r1(car.y), Math.round(car.a * 100) / 100); (car.ghostZ || (car.ghostZ = [])).push(r1(car.z)); }
    }

    trackEffects(car, race, dt);
  }

  if (race.mode === 'rally' && race.state === 'running') Rally.check(race);
  // --- Derby: Wracks, Rauch, Zeitlimit ---
  if (race.mode === 'derby') {
    for (const car of race.cars) {
      if (!car.out && running && car.damage >= 100) eliminate(car, race, 'WRACK');
      if (car.damage > 55 && Math.random() < dt * (car.wreck ? 9 : (car.damage - 50) / 10)) {
        const g = car.damage > 85 || car.wreck ? 70 : 140;
        Particles.add('puff', car.x - Math.cos(car.a) * 4, car.y - Math.sin(car.a) * 4, car.z + 8, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, 22 + Math.random() * 14, 1.4, 4, `${g},${g},${g + 6}`, 0, 9);
      }
    }

  sorted.forEach((c, i) => c.place = i + 1);
  const leader = sorted[0];
  // Kommentator: Führungswechsel, letzte Runde
  if (race.audible && race.mode !== 'demo' && race.mode !== 'trial' && race.mode !== 'rally' && race.state === 'running' && race.t > 4) {
    if (race.leaderId != null && race.leaderId !== leader.id && !leader.finished && (leader.human >= 0 || race.cars.find(c => c.id === race.leaderId).human >= 0))
      Speaker.say(leader.human >= 0 ? Speaker.pick([leader.name + ' übernimmt die Führung!', 'Wahnsinn, ' + leader.name + ' ist jetzt vorne!', leader.name + ' setzt sich an die Spitze!']) : Speaker.pick([leader.name + ' geht an die Spitze!', 'Führungswechsel! ' + leader.name + ' ist vorbei!', leader.name + ' schnappt sich Platz eins!']), 'lead', 6);

  }
  race.leaderId = leader.id;
  for (const c of sorted) {
    if (race.mode === 'derby') { c.gapText = c.wreck ? 'WRACK' : c.finished ? 'SIEGER' : Math.round(c.damage) + '%'; continue; }
    if (c.out) { c.gapText = 'RAUS'; continue; }
    if (c === leader) c.gapText = c.finished ? 'Ziel' : 'Runde ' + Math.max(1, c.lap);
    else if (c.finished) c.gapText = '+' + (c.finishT - leader.finishT).toFixed(2);
    else {
      const behind = Math.floor(leader.key - c.key);
      c.gapText = behind >= 1 ? '+' + behind + ' Rd' : (c.lastPass != null ? '+' + c.lastPass.toFixed(2) : '');
    }
  }

  // --- Rennende ---
  if (race.state === 'running' && (race.mode === 'derby' || race.mode === 'elim')) {
    const act = race.cars.filter(c => !c.out && !c.finished), humans = race.cars.filter(c => c.human >= 0);
    const humansOut = humans.length && humans.every(c => c.out);
    if (race.mode === 'derby' && act.length === 1) finishCar(act[0], race);
    if (race.mode === 'derby' && race.t >= race.timeLimit) { race.timeUp = true; }
    if (act.length <= 1 || race.timeUp) { race.state = 'ending'; race.endT = 2.4; }
    else if (humansOut) {
      race.humansOutT = (race.humansOutT || 0) + dt;
      if (race.humansOutT > 3) { race.state = 'ending'; race.endT = 0.5; }
    }
  } else if (race.state === 'running' && race.mode !== 'demo') {
    const humans = race.cars.filter(c => c.human >= 0);
    const allDone = race.cars.every(c => c.finished);
    const humansDone = humans.length && humans.every(c => c.finished);
    if (allDone || (race.firstFinishT != null && race.t - race.firstFinishT > 30) || (humansDone && race.t - race.lastHumanFinishT > 6)) {
      race.state = 'ending'; race.endT = 2.2;
    }
  } else if (race.state === 'running' && race.mode === 'demo' && race.firstFinishT != null) {
    race.state = 'ending'; race.endT = 2;
  }
  if (race.state === 'ending') {
    race.endT -= dt;
    if (race.endT <= 0) { race.state = 'done'; Game.onRaceDone(); }
  }
}

/** Ergebnisliste erstellen. */
function computeResults(race) {
  if (race.mode === 'derby' || race.mode === 'elim') {
    const derby = race.mode === 'derby';
    const sorted = race.cars.slice().sort((a, b) => b.key - a.key);
    return sorted.map((c, i) => {
      let gap;
      if (derby) gap = c.gaveUp ? 'aufgegeben' : c.wreck ? 'Wrack nach ' + fmtTime(c.outT).replace(/\.\d+$/, '') : i === 0 ? (race.timeUp ? 'Zeit um – am wenigsten Schaden' : 'letztes Auto') : 'überlebt';
      else gap = c.gaveUp ? 'aufgegeben' : c.out ? 'raus in Runde ' + (c.lapTimes.length + 1) : i === 0 ? (c.finished ? 'Sieger' : 'vorn bei Rennende') : 'noch im Rennen';
      return { pos: i + 1, name: c.name, color: c.color, cls: c.cls.name, human: c.human, finished: i === 0, total: derby ? null : (i === 0 && c.finished ? c.finishT : null),
        gap, best: derby ? null : c.best, laps: derby ? [] : c.lapTimes.slice(), points: POINTS[i] || 0, carId: c.id, ri: c.ri, damage: Math.round(c.damage), hits: c.hits || 0 };
    });
  }
  const sorted = race.cars.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.finishT - b.finishT;
    if (a.finished) return -1; if (b.finished) return 1;
    return b.key - a.key;
  });
  const win = sorted[0];
  return sorted.map((c, i) => {
    let gap = '';
    if (i === 0) gap = c.finished ? fmtTime(c.finishT) : '–';
    else if (c.finished && win.finished) gap = '+' + (c.finishT - win.finishT).toFixed(3);
    else if (c.gaveUp) gap = 'aufgegeben';
    else { const laps = (win.finished ? race.laps : win.lapTimes.length) - c.lapTimes.length; gap = laps > 0 ? '+' + laps + (laps === 1 ? ' Runde' : ' Runden') : 'nicht im Ziel'; }
    return { pos: i + 1, name: c.name, color: c.color, cls: c.cls.name, human: c.human, finished: c.finished, total: c.finished ? c.finishT : null,
      gap, best: c.best, laps: c.lapTimes.slice(), points: POINTS[i] || 0, carId: c.id, ri: c.ri };
  });
}

const DUST_RGB = { [S.ASH]: '70,64,64',  [S.GRASS]: '120,110,80', [S.SAND]: '226,200,150', [S.GRAVEL]: '170,164,152', [S.SNOW]: '245,248,255', [S.ICE]: '230,244,255', [S.DIRT]: '170,140,104' };
const Particles = {

  clear() { this.list.length = 0; },
  /** type: puff | chunk | spark | drop | ring; z/vz = Höhe; g = Schwerkraft; grow = Wachstum (puff); Boden = this.fl */

  },
  /** Kurzer heller Lichtblitz bei harten Einschlägen. */

  },
  splash(x, y) {

    }

/** Abstand zum Vorder- und Hintermann (Sekunden, geschätzt aus Streckenabstand und Tempo). */
function drawGaps(ctx, me, race, x, y) {
  const order = race.cars.filter(c => !c.out).sort((a, b) => a.place - b.place), i = order.indexOf(me);
  const v = Math.max(140, carSpeed(me), me.cls.maxSpeed * 0.7), L = race.rt.L;
  const rows = [];
  if (race.mode === 'derby') return y;
  if (i > 0) rows.push(['▲', order[i - 1], (order[i - 1].key - me.key) * L / v]);
  if (i >= 0 && i < order.length - 1) rows.push(['▼', order[i + 1], (me.key - order[i + 1].key) * L / v]);
  ctx.font = '600 12px "Chakra Petch",sans-serif'; ctx.textBaseline = 'alphabetic';
  for (const [arr, c, g] of rows) {
    if (c.finished && arr === '▼') continue;
    ctx.textAlign = 'left'; ctx.fillStyle = arr === '▲' ? '#ff8a3d' : '#47d48a'; ctx.fillText(arr, x, y + 12);
    ctx.fillStyle = c.color; ctx.fillRect(x + 16, y + 3, 8, 8);
    ctx.fillStyle = '#c4ccd9'; ctx.fillText(c.name.slice(0, 12), x + 30, y + 12);
    ctx.textAlign = 'right'; ctx.fillStyle = '#e9eef6';
    ctx.fillText(c.finished ? 'im Ziel' : g > 60 ? '+' + Math.floor(g / (L / v)) + ' Rd' : (arr === '▲' ? '+' : '−') + g.toFixed(1) + ' s', x + PANEL - 24, y + 12);
    y += 17;
  }
  ctx.textAlign = 'left';
  return y;
}
/** Minikarte (nur mit Zoom-Kamera): Strecke, Boxengasse, alle Autos, sichtbarer Ausschnitt. */
function drawMinimap(ctx, race, x, y, w, h) {
  const rt = race.rt, k = Math.min(w / W, h / H), ox = x + (w - W * k) / 2, oy = y + (h - H * k) / 2;
  ctx.fillStyle = '#18202c'; rr(ctx, x, y, w, h, 8); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, W * k, H * k); ctx.clip(); ctx.translate(ox, oy); ctx.scale(k, k);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (rt.pit) { ctx.strokeStyle = 'rgba(255,205,50,.5)'; ctx.lineWidth = 10; ctx.beginPath(); rt.pit.path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
  ctx.strokeStyle = '#5d6a80'; ctx.lineWidth = 26; ctx.beginPath();
  for (let i = 0; i <= rt.n; i++) { const j = i % rt.n; i ? ctx.lineTo(rt.lx[j], rt.ly[j]) : ctx.moveTo(rt.lx[j], rt.ly[j]); }
  ctx.stroke();
  const c0 = rt.cps[0]; ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(c0.x1, c0.y1); ctx.lineTo(c0.x2, c0.y2); ctx.stroke();
  for (const c of race.cars.slice().sort((a, b) => a.human - b.human)) {
    if (c.sink > 0) continue;
    ctx.globalAlpha = c.out ? 0.35 : 1;
    ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(c.x, c.y, c.human >= 0 ? 26 : 18, 0, 7); ctx.fill();
    if (c.human >= 0) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke(); }
  }
  ctx.globalAlpha = 1; ctx.restore();
}
/** Pfeile am Bildrand zu Gegnern außerhalb des Zoom-Ausschnitts (die drei nächsten auf der Strecke). */
function drawEdgeArrows(ctx, race, map, vw, vh) {
  const me = race.cars.find(c => c.human >= 0); if (!me) return;
  const L = race.rt.L;
  const near = race.cars.filter(c => c !== me && !c.out && !c.finished).map(c => [c, Math.abs(c.key - me.key) * L]).sort((a, b) => a[1] - b[1]).slice(0, 3);
  for (const [c, d] of near) {
    const [sx, sy] = map(...P(c.x, c.y, c.z));
    if (sx > 8 && sx < vw - 8 && sy > 8 && sy < vh - 8) continue;
    const cx = vw / 2, cy = vh / 2, dx = sx - cx, dy = sy - cy, t = Math.min((vw / 2 - 18) / Math.abs(dx || 1e-6), (vh / 2 - 18) / Math.abs(dy || 1e-6));
    const ax = cx + dx * t, ay = cy + dy * t, a = Math.atan2(dy, dx);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = c.color; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -7); ctx.lineTo(-3, 0); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.font = '600 9px "Chakra Petch",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(Math.round(d / 10) + ' m', ax - Math.cos(a) * 16, ay - Math.sin(a) * 16 + 3);
  }
}

/* ---------- Kleine UI-Helfer ---------- */
/** Vollbild an/aus (auf Handys zusätzlich Querformat sperren, falls erlaubt). */
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else {
      const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* nicht unterstützt */ } }).catch(() => toast('Vollbild wird hier nicht unterstützt.'));
    }
  } catch (e) { toast('Vollbild wird hier nicht unterstützt.'); }
}
function toast(msg, ms = 2200) {
  const el = document.createElement('div'); el.className = 'toastmsg'; el.textContent = msg;
  $('toast').appendChild(el); setTimeout(() => el.remove(), ms);
}
/** Dialog mit Knöpfen. buttons: [{label, value, primary}] → Promise(value) */
function dialog(text, buttons) {
  return new Promise(res => {
    $('dlg-text').textContent = text;
    const acts = $('dlg-acts'); acts.innerHTML = '';
    buttons.forEach(b => {
      const el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '');
      el.textContent = b.label;
      el.onclick = () => { $('dialog').classList.remove('on'); res(b.value); };
      acts.appendChild(el);
    });
    $('dialog').classList.add('on');
  });
}

  /** Setup-Animation: Autos fahren über die Streckenvorschau, Fahrzeuge drehen sich in 3D. */
  startSetupAnim(cv, trackId, humans) {
    const token = this.animTok = (this.animTok || 0) + 1;
    const st = Options.data.setup;
    let path = null, tsrc = null;
    if (cv && trackId) {
      tsrc = getTrack(trackId);
      if (tsrc && tsrc.aiLine && tsrc.aiLine.length > 4) {
        path = resample(tsrc.aiLine, 6, true);
        const c0 = tsrc.checkpoints && tsrc.checkpoints[0];
        if (c0) { const i0 = nearestIndex(path, (c0.x1 + c0.x2) / 2, (c0.y1 + c0.y2) / 2); path = path.slice(i0).concat(path.slice(0, i0)); }
      }
    }
    const pv = trackId ? trackPreview(trackId) : null;
    const runners = [];
    if (path) {
      const cols = [COLORS[st.players[0].color], ...COLORS.filter((c, k) => k !== st.players[0].color).slice(0, 2)];
      cols.forEach((col, k) => runners.push({ col, shape: CLASSES[k === 0 ? st.players[0].cls : (k * 3) % CLASSES.length].shape, off: k * 7, sp: 1 - k * 0.04 }));
    }
    const cars = [...document.querySelectorAll('#scr-setup canvas.car3d')];
    const t0 = performance.now();
    const step = now => {
      if (token !== this.animTok || !document.getElementById('scr-setup').classList.contains('on')) return;
      const t = (now - t0) / 1000;
      if (path && pv && cv.isConnected) {
        const g = cv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(pv, 0, 0);
        g.setTransform(448 / W, 0, 0, 280 / H, 0, 0);
        const n = path.length;
        const items = runners.map(r => {
          const f = (t * 32 * r.sp + n - r.off) % n, i = Math.floor(f), j = (i + 1) % n, u = f - i;
          const x = lerp(path[i].x, path[j].x, u), y = lerp(path[i].y, path[j].y, u);
          const k2 = (i + 3) % n, a = Math.atan2(path[k2].y - path[i].y, path[k2].x - path[i].x);
          const z = terrainH(tsrc, x, y);
          return { x, y, a, z, gz: z, color: r.col, shape: r.shape, steer: 0, damage: 0, alpha: 1, level: 0 };
        }).sort((p, q) => p.y - q.y);
        for (const o of items) drawCar3D(g, o);
        g.setTransform(1, 0, 0, 1, 0, 0);
      }
      for (const c of cars) {
        if (!c.isConnected) continue;
        const i = +c.dataset.i, p = st.players[i], g = c.getContext('2d');
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
        const grd = g.createRadialGradient(150, 100, 10, 150, 100, 140); grd.addColorStop(0, '#2a3445'); grd.addColorStop(1, '#141a24');
        g.fillStyle = grd; g.fillRect(0, 0, c.width, c.height);
        g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(150, 104, 78, 20, 0, 0, Math.PI * 2); g.fill();
        const [px, py] = P(W / 2, H / 2, 0), k = 5;
        g.setTransform(k, 0, 0, k, 150 - px * k, 100 - py * k);
        drawCar3D(g, { x: W / 2, y: H / 2, a: t * 0.9 + i, z: 0, gz: 0, color: COLORS[p.color], shape: CLASSES[p.cls].shape, steer: Math.sin(t * 1.3) * 0.6, damage: 0, alpha: 1, level: 0 });
        g.setTransform(1, 0, 0, 1, 0, 0);
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  setupAct(act, v, el) {
    const st = Options.data.setup, trial = this.mode === 'trial', rules = trial ? st.trialRules : st.rules;
    const usedColors = (except) => st.players.slice(0, trial ? 1 : st.humans).map((p, i) => i === except ? -1 : p.color);
    if (act === 'back') { Options.save(); this.main(); return; }
    if (act === 'start') { Options.save(); Game.startFromSetup(this.mode); return; }
    const derby = this.mode === 'quick' && QMODES[st.qmode || 0][0] === 'derby';
    if (act === 'track') { if (derby) st.derbyTrack = v; else if (trial) st.trialTrack = v; else st.trackId = v; }
    else if (act === 'qmode') st.qmode = +v;
    else if (act === 'derbyTime') st.derbyTime = +v;
    else if (act === 'champTrack') {
      const i = st.champTracks.indexOf(v);
      if (i >= 0) st.champTracks.splice(i, 1); else st.champTracks.push(v);
      const order = allTrackInfos().map(t => t.id); st.champTracks.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    }
    else if (act === 'laps') { if (trial) st.trialLaps = clamp(st.trialLaps + +v, 1, 50); else st.laps = clamp(st.laps + +v, 1, 50); }
    else if (act === 'ai') st.ai = clamp(Math.min(st.ai, MAX_CARS - st.humans) + +v, 0, MAX_CARS - st.humans);
    else if (act === 'diff') st.diff = +v;
    else if (act === 'aiCls') { st.aiCls = +el.value - 1; Options.save(); return; }
    else if (act === 'weather') st.weather = +v;
    else if (act === 'time') st.time = +v;
    else if (act === 'humans') {
      st.humans = +v + 1; st.ai = Math.min(st.ai, MAX_CARS - st.humans);
      // doppelte Farben auflösen
      for (let i = 1; i < st.humans; i++) while (usedColors(i).includes(st.players[i].color)) st.players[i].color = (st.players[i].color + 1) % COLORS.length;
    }
    else if (act === 'rule') rules[v] = !rules[v];
    else if (act === 'pct') { rules[v] = +el.value; el.nextElementSibling.textContent = el.value + '%'; return; }
    else if (act.startsWith('cls')) st.players[+act.slice(3)].cls = +v;
    else if (act.startsWith('color')) {
      const i = +act.slice(5);
      if (usedColors(i).includes(+v)) { toast('Diese Farbe fährt schon ein anderer Spieler.'); return; }
      st.players[i].color = +v;
    }
    else return;
    Sound.click();
    this.setup();
  },

/* ---------- Ereignis-Verteilung für alle Bildschirme ---------- */
function bindScreens() {
  const handler = async (e, type) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, v = el.dataset.v;
    const scr = e.currentTarget.id;
    if (type === 'click' && (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
    if (type === 'input' && !(el.tagName === 'INPUT' && el.type === 'range')) return;
    if (type === 'change' && el.dataset.act !== 'name' && el.dataset.act !== 'oname' && el.dataset.act !== 'cname' && el.dataset.act !== 'champTrack' && el.dataset.act !== 'aiCls' && el.dataset.act !== 'ovoice') return;
    if (type === 'click' && el.tagName === 'SELECT') return;
    if (type === 'change' && el.dataset.act === 'ovoice') { UI.optionsAct('ovoice', null, el); return; }
    if (type === 'click' && el.dataset.act === 'champTrack') return;
    if (scr === 'scr-main') {
      Sound.click();
      if (act === 'quick' || act === 'trial' || act === 'champ') UI.setup(act);
      else if (act === 'career') Career.open();
      else if (act === 'rally') Rally.ui();
      else if (act === 'fullscreen') toggleFullscreen();
      else if (act === 'editor') Editor.open();
      else if (act === 'board') UI.board();
      else if (act === 'options') UI.options();
    } else if (scr === 'scr-setup') {
      if (act === 'name') { Options.data.names[+v] = el.value.trim().slice(0, 14) || ('Spieler ' + (+v + 1)); Options.save(); return; }
      if (UI.mode === 'rally') { Rally.uiAct(act, v, el); return; }
      UI.setupAct(act, v, el);
    } else if (scr === 'scr-options') {
      if (act === 'oname') { Options.data.names[+v] = el.value.trim().slice(0, 14) || ('Spieler ' + (+v + 1)); Options.save(); return; }
      UI.optionsAct(act, v, el);
    } else if (scr === 'scr-board') UI.boardAct(act, v);
    else if (scr === 'scr-results') Game.resultsAct(act);
    else if (scr === 'scr-champ') Game.champAct(act);
    else if (scr === 'scr-pause') Game.pauseAct(act);
    else if (scr === 'scr-career') { if (act === 'cname') { Career.setName(el.value); return; } Career.act(act, v, el); }
  };
  document.querySelectorAll('.screen').forEach(s => {
    s.addEventListener('click', e => handler(e, 'click'));
    s.addEventListener('input', e => handler(e, 'input'));
    s.addEventListener('change', e => handler(e, 'change'));
  });
}

  /* ---------- Aktionen ---------- */
  async act(act, v) {
    const D = this.data;
    Sound.click();
    if (act === 'back') { this.save(); UI.main(); return; }
    if (act === 'ncolor') { this.newColor = +v; this.render(); return; }
    if (act === 'create') {
      this.data = { v: 1, name: (this.newName || Options.data.names[0]).trim().slice(0, 14) || 'Fahrer', color: this.newColor, money: CAREER_START_MONEY,
        owned: ['allround'], car: 'allround', unlocked: 0, best: {}, cur: null, lastLeague: null, stats: { races: 0, wins: 0, podiums: 0, titles: 0, earned: 0 } };
      this.save(); this.view = 'hub'; this.render(); return;
    }
    if (!D) return;
    if (act === 'color') D.color = +v;
    else if (act === 'pick') D.car = v;
    else if (act === 'buy') {
      const info = CAREER_CARS[v];
      if (!info || D.owned.includes(v) || D.money < info.price || info.league > D.unlocked) return;
      if (!await confirmDlg(`${CLASSES[clsIndex(v)].name} für ${money(info.price)} kaufen?`, 'Kaufen')) return;
      D.money -= info.price; D.owned.push(v); D.car = v; toast(CLASSES[clsIndex(v)].name + ' gekauft!');
    }
    else if (act === 'start') this.startLeague(+v);
    else if (act === 'continue') { this.save(); this.startEvent(); return; }
    else if (act === 'quitLeague') { if (!await confirmDlg('Liga aufgeben? Startgeld und bisherige Wertung verfallen.', 'Aufgeben')) return; D.cur = null; }
    else if (act === 'reset') { if (!await confirmDlg('Karriere komplett löschen? Geld, Autos und Fortschritt gehen verloren.', 'Löschen')) return; store.del('cr_career'); this.data = null; this.render(); return; }
    else if (act === 'hub') { this.view = 'hub'; }
